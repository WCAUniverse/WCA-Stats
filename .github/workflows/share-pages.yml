# ============================================================================
# Regenerates the /s/ share pages + sitemap.xml from Supabase.
#
# Runs every 6 hours, on every push to index.html, and whenever you press the
# button yourself: Actions tab -> "Build share pages" -> Run workflow.
#
# It commits only when something actually changed, so it won't spam the repo.
#
# NOTE: the commit message must NOT contain [skip ci] — that stops GitHub Pages
# from publishing the new files, so they'd sit in the repo and 404 on the site.
# The paths: filter below is what prevents a loop, not [skip ci].
# ============================================================================
name: Build share pages

on:
  schedule:
    - cron: '0 */6 * * *'      # every 6 hours
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tools/build-share-pages.mjs'
      - '.github/workflows/share-pages.yml'
  workflow_dispatch:            # the manual "Run workflow" button

# the job commits back to the repo, so it needs write access
permissions:
  contents: write

concurrency:
  group: share-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install the image renderer
        run: npm install --no-save @resvg/resvg-js

      - name: Generate share pages
        run: node tools/build-share-pages.mjs

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A s sitemap.xml robots.txt
          if git diff --staged --quiet; then
            echo "No changes — nothing to commit."
          else
            git commit -m "Rebuild share pages"
            # another run may have pushed while we were building
            git pull --rebase --autostash origin main || true
            git push
          fi
