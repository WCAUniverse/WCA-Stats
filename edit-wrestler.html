<style>
  :root{
    --bg:#0d0d0f; --panel:#161618; --panel2:#1d1d20; --line:#2a2a2e;
    --gold:#E9B949; --gold-dim:#b08d2e;
    --win:#3ECF8E; --loss:#E24B4A;
    --txt:#f2f2f0; --muted:#8a8a86;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--txt); font-family:'Barlow',sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  h1,h2,.disp{font-family:'Anton',sans-serif; font-weight:600; letter-spacing:.5px; text-transform:uppercase;}
  .wrap{max-width:760px; margin:0 auto; padding:0 20px 80px;}
  header{
    border-bottom:1px solid var(--line); background:linear-gradient(180deg,#111 0%,var(--bg) 100%);
    padding:18px 20px; display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;
  }
  .brand{font-family:'Anton'; font-weight:700; font-size:22px; color:var(--gold); letter-spacing:1px; text-decoration:none;}
  .back-link{color:var(--muted); font-size:14px; text-decoration:none; font-family:'Anton'; letter-spacing:.3px;}
  .back-link:hover{color:var(--gold);}
  h1.page-title{font-size:28px; margin:28px 0 6px;}
  .hint{color:var(--muted); font-size:14px; margin-bottom:22px; line-height:1.5;}
  .tabs2{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
  .tabs2 button{
    background:var(--panel2); border:1px solid var(--line); color:var(--muted);
    font-family:'Anton'; font-size:14px; letter-spacing:.5px; text-transform:uppercase;
    padding:8px 14px; border-radius:6px; cursor:pointer;
  }
  .tabs2 button.active{border-color:var(--gold); color:var(--gold);}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:18px;}
  label{display:block; font-size:14px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin:14px 0 5px;}
  label:first-child{margin-top:0;}
  input,textarea{
    width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--txt);
    padding:10px 12px; border-radius:8px; font-size:14px; font-family:inherit;
  }
  input:focus,textarea:focus{outline:none; border-color:var(--gold);}
  textarea{resize:vertical; min-height:80px;}
  .row2{display:flex; gap:14px; flex-wrap:wrap;}
  .row2>div{flex:1; min-width:220px;}
  .btn{
    background:var(--gold); color:#15120a; border:none; font-family:'Anton'; font-weight:600;
    font-size:14px; letter-spacing:.5px; text-transform:uppercase; padding:11px 20px;
    border-radius:8px; cursor:pointer;
  }
  .btn:hover{filter:brightness(1.08);}
  .msg{font-size:14px; display:none;}
  .msg.show{display:block;}
  .msg.ok{color:var(--win);}
  .msg.err{color:var(--loss);}
  .empty{color:var(--muted); font-size:14px; padding:30px 0; text-align:center;}
  .subrow{border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px;}
  .pill{font-size:13px; text-transform:uppercase; letter-spacing:.5px; padding:2px 8px; border-radius:10px; border:1px solid;}
  .soc-grid{display:grid; grid-template-columns:1fr 1fr; gap:0 14px;}
  @media(max-width:600px){ .soc-grid{grid-template-columns:1fr;} }
  a{color:var(--gold);}
</style>

<body>

<header>
  <a href="/" class="brand"><img src="brand/wca-logo-sm.png" alt="WCA" style="height:38px;width:auto;display:block;filter:drop-shadow(0 2px 8px rgba(0,0,0,.6))"></a>
  <a href="/account" class="back-link">&larr; Back to my account</a>
</header>

<div id="ew-va-banner" style="display:none;background:#3a2a00;border-bottom:1px solid var(--gold);color:#f7df8e;font-size:14px;padding:9px 20px;text-align:center;"></div>

<div class="wrap">
  <h1 class="page-title">Edit Wrestler Data</h1>
  <p class="hint">Update your character's bio, socials, and moveset. Everything here goes to WCA
    staff for approval before it's applied to the public roster, nothing updates live immediately.</p>
  <div id="ew-body"><div class="empty">Loading…</div></div>
</div>

<script>
const SUPABASE_URL = "https://dmfbhszvrbaknaevdhxh.supabase.co";
const SUPABASE_KEY = "sb_publishable_aXhRkucX-pMcEe-sgLMFkg_-wb3piFD";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, flowType:'pkce' }
});

// key -> display label, same set the public site's socialIcons() understands
const SOCIAL_DEF = [
  ['twitch','Twitch'], ['twitter','Twitter / X'], ['instagram','Instagram'],
  ['youtube','YouTube'], ['tiktok','TikTok'], ['bluesky','Bluesky'], ['discord','Discord']
];

let EW_USER = null;
let EW_ACTING_ID = null;     // the id we're actually operating as (view-as target, or EW_USER's own)
let EW_ACTING_NAME = null;
let EW_WRESTLERS = [];   // every wrestler this user owns (full editable-field rows)
let EW_CURRENT = null;   // the one currently selected in the tab bar

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function ewInit(){
  const body = document.getElementById('ew-body');
  const { data:{ user } } = await sb.auth.getUser();
  EW_USER = user || null;
  if(!EW_USER){
    body.innerHTML = `<div class="card"><p>You need to be signed in to edit character data.
      <a href="index.html">Sign in from the main site</a>, then come back to this page.</p></div>`;
    return;
  }

  // View-as: only honored if this signed-in user actually passes is_admin() —
  // the RPC enforces this too, this is just so the page doesn't even try to
  // pretend for a non-admin whose sessionStorage happens to have a stale value.
  EW_ACTING_ID = EW_USER.id;
  EW_ACTING_NAME = null;
  try{
    const viewAsId = sessionStorage.getItem('wcaViewAsId');
    const viewAsName = sessionStorage.getItem('wcaViewAsName');
    if(viewAsId){
      const { data: isAdmin } = await sb.rpc('is_admin');
      if(isAdmin === true){
        EW_ACTING_ID = viewAsId;
        EW_ACTING_NAME = viewAsName;
      }
    }
  }catch(e){}
  ewRenderBanner();

  const { data: ownedRows } = await sb.from('wrestler_owners').select('wrestler_id').eq('auth_id', EW_ACTING_ID);
  const wids = (ownedRows||[]).map(r=>r.wrestler_id);
  if(!wids.length){
    body.innerHTML = `<div class="card"><p>${EW_ACTING_NAME?esc(EW_ACTING_NAME):'You'} don't have a character assigned yet.
      Reach out to WCA staff if you think this is a mistake.</p></div>`;
    return;
  }
  const { data: mine, error } = await sb.from('wrestlers')
    .select('id,name,bio,nickname,from_loc,theme_song,theme_url,finishers,signatures,socials')
    .in('id', wids).order('name');
  if(error){
    body.innerHTML = `<div class="card"><p>Couldn't load character data: ${esc(error.message)}</p></div>`;
    return;
  }
  EW_WRESTLERS = mine || [];
  EW_CURRENT = EW_WRESTLERS[0] || null;
  ewRenderPage();
}

function ewRenderBanner(){
  const el = document.getElementById('ew-va-banner');
  if(!el) return;
  if(EW_ACTING_NAME){
    el.style.display = 'block';
    el.innerHTML = `👁️ Viewing as <b>${esc(EW_ACTING_NAME)}</b>, for testing only, this isn't a real login as them.`;
  } else {
    el.style.display = 'none';
  }
}


function ewParseSocials(s){
  if(!s) return {};
  if(typeof s === 'string'){ try{ return JSON.parse(s); }catch(e){ return {}; } }
  return s;
}

function ewRenderPage(){
  const body = document.getElementById('ew-body');
  if(!EW_CURRENT){ body.innerHTML = '<div class="empty">No character selected.</div>'; return; }

  const tabs = EW_WRESTLERS.length > 1
    ? `<div class="tabs2">${EW_WRESTLERS.map(w=>
        `<button class="${w.id===EW_CURRENT.id?'active':''}" onclick="ewSwitch(${w.id})">${esc(w.name)}</button>`
      ).join('')}</div>`
    : '';

  const w = EW_CURRENT;
  const socials = ewParseSocials(w.socials);
  const socialInputs = SOCIAL_DEF.map(([k,label])=>
    `<div><label style="margin-top:10px">${label}</label>
      <input type="url" id="ew_soc_${k}" value="${esc(socials[k]||'')}" placeholder="https://…"></div>`
  ).join('');

  body.innerHTML = `
    ${tabs}
    <div class="card">
      <label style="margin-top:0">Bio</label>
      <textarea id="ew_bio" maxlength="2000">${esc(w.bio||'')}</textarea>

      <div class="row2">
        <div><label>Nickname</label><input id="ew_nickname" value="${esc(w.nickname||'')}"></div>
        <div><label>Hometown</label><input id="ew_from_loc" value="${esc(w.from_loc||'')}"></div>
      </div>

      <div class="row2">
        <div><label>Theme song</label><input id="ew_theme_song" value="${esc(w.theme_song||'')}" placeholder="Song title"></div>
        <div><label>Theme song link <span style="text-transform:none">(optional)</span></label>
          <input type="url" id="ew_theme_url" value="${esc(w.theme_url||'')}" placeholder="https://…"></div>
      </div>

      <label>Finishers <span style="text-transform:none">(one per line)</span></label>
      <textarea id="ew_finishers" style="min-height:60px">${esc((w.finishers||[]).join('\n'))}</textarea>

      <label>Signatures <span style="text-transform:none">(one per line)</span></label>
      <textarea id="ew_signatures" style="min-height:60px">${esc((w.signatures||[]).join('\n'))}</textarea>

      <label>Socials</label>
      <div class="soc-grid">${socialInputs}</div>

      <div style="margin-top:20px; display:flex; gap:14px; align-items:center; flex-wrap:wrap">
        <button class="btn" id="ewSend" onclick="ewSubmit()">Submit for approval</button>
        <span class="msg" id="ewMsg"></span>
      </div>
    </div>

    <div id="ewHistory"></div>
  `;
  ewLoadHistory();
}

function ewSwitch(id){
  EW_CURRENT = EW_WRESTLERS.find(x=>String(x.id)===String(id)) || EW_CURRENT;
  ewRenderPage();
}

function ewMsg(text, ok){
  const m = document.getElementById('ewMsg');
  if(!m) return;
  m.className = 'msg show ' + (ok?'ok':'err');
  m.textContent = text;
  if(ok) setTimeout(()=>m.classList.remove('show'), 4000);
}

async function ewSubmit(){
  const w = EW_CURRENT;
  const bio         = document.getElementById('ew_bio').value.trim();
  const nickname    = document.getElementById('ew_nickname').value.trim();
  const from_loc    = document.getElementById('ew_from_loc').value.trim();
  const theme_song  = document.getElementById('ew_theme_song').value.trim();
  const theme_url   = document.getElementById('ew_theme_url').value.trim();
  const finishers   = document.getElementById('ew_finishers').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const signatures  = document.getElementById('ew_signatures').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const socials = {};
  SOCIAL_DEF.forEach(([k])=>{
    const v = (document.getElementById('ew_soc_'+k).value||'').trim();
    if(v) socials[k] = v;
  });

  // Only send fields that actually changed, so the admin diff view stays meaningful
  // instead of re-flagging every field on every submission.
  const newVals = {};
  if(bio !== (w.bio||'')) newVals.bio = bio || null;
  if(nickname !== (w.nickname||'')) newVals.nickname = nickname || null;
  if(from_loc !== (w.from_loc||'')) newVals.from_loc = from_loc || null;
  if(theme_song !== (w.theme_song||'')) newVals.theme_song = theme_song || null;
  if(theme_url !== (w.theme_url||'')) newVals.theme_url = theme_url || null;
  if(JSON.stringify(finishers) !== JSON.stringify(w.finishers||[])) newVals.finishers = finishers;
  if(JSON.stringify(signatures) !== JSON.stringify(w.signatures||[])) newVals.signatures = signatures;
  const oldSocials = ewParseSocials(w.socials);
  if([...new Set([...Object.keys(socials), ...Object.keys(oldSocials||{})])].some(k => (socials[k]||'') !== ((oldSocials||{})[k]||''))) newVals.socials = socials;

  if(!Object.keys(newVals).length){ ewMsg('Nothing changed yet.', false); return; }

  const asUser = (EW_ACTING_ID !== EW_USER.id) ? EW_ACTING_ID : null;
  const btn = document.getElementById('ewSend'); if(btn) btn.disabled = true;
  const { error } = await sb.rpc('submit_bio_edit', { p_wrestler_id: w.id, p_new_values: newVals, p_as_user: asUser });
  if(btn) btn.disabled = false;
  if(error){ ewMsg('Failed: '+error.message, false); return; }
  ewMsg('Submitted for approval ✓', true);
  ewLoadHistory();
}

async function ewLoadHistory(){
  const box = document.getElementById('ewHistory');
  if(!box || !EW_CURRENT) return;
  const { data, error } = await sb.from('wrestler_edit_requests')
    .select('id,status,new_values,review_note,submitted_at')
    .eq('wrestler_id', EW_CURRENT.id).eq('submitted_by', EW_ACTING_ID)
    .order('submitted_at',{ascending:false});
  if(error || !data || !data.length){ box.innerHTML=''; return; }
  box.innerHTML = '<div class="hint" style="margin-bottom:8px">Your edit history for ' + esc(EW_CURRENT.name) + '</div>' +
    data.map(r=>{
      const color = r.status==='approved' ? 'var(--win)' : (r.status==='rejected' ? 'var(--loss)' : 'var(--gold)');
      const fields = Object.keys(r.new_values||{}).join(', ') || '';
      const note = r.review_note ? `<div class="hint" style="margin-top:4px">Note: ${esc(r.review_note)}</div>` : '';
      const when = r.submitted_at ? new Date(r.submitted_at).toLocaleDateString() : '';
      return `<div class="subrow">
        <div style="display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; align-items:center">
          <span>Changed: <b>${esc(fields)}</b> <span class="hint" style="margin:0">· ${esc(when)}</span></span>
          <span class="pill" style="color:${color}; border-color:${color}">${esc(r.status)}</span>
        </div>
        ${note}
      </div>`;
    }).join('');
}

ewInit();
</script>
<!-- ===== Fight Hub look (Nov 2026): background and minimum text size. Look only. ===== -->
<script>
window.FH_LITE = { minText:14, bg:true, scope:'body' };
/* ===== Fight Hub look for the side tools (Nov 2026) — LOOK ONLY =====
   An animated fog background (optional) and a minimum text size.
   Add ?design=classic to the address to turn this whole look off. */
(function(){
  var OFF = /[?&]design=classic\b/i.test(location.search);
  var root = document.documentElement;
  root.setAttribute('data-design', OFF ? 'classic' : 'fight');
  if(OFF) return;
  var CFG = window.FH_LITE || { minText:14, bg:true, scope:'body' };

  /* minimum text size: anything smaller is raised, only the size changes */
  function pass(el){
    if(!el) return;
    var seen = new Set(), w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, { acceptNode:function(n){ return n.nodeValue && n.nodeValue.trim() ? 1 : 3; } }), n;
    while((n = w.nextNode())){
      var p = n.parentElement;
      if(!p || seen.has(p)) continue; seen.add(p);
      if(p.hasAttribute('data-fh-fs') || p.closest('svg,canvas,script,style,.ti,i[class*="ti-"]' + (CFG.skip ? ',' + CFG.skip : ''))) continue;
      var fs = parseFloat(getComputedStyle(p).fontSize);
      if(fs >= 6 && fs < CFG.minText){ p.setAttribute('data-fh-fs', p.style.fontSize || '-'); p.style.fontSize = CFG.minText + 'px'; }
    }
  }
  var t = null;
  function soon(){ clearTimeout(t); t = setTimeout(function(){ document.querySelectorAll(CFG.scope).forEach(pass); }, 300); }
  function start(){
    soon();
    new MutationObserver(function(m){ for(var i=0;i<m.length;i++){ if(m[i].addedNodes.length){ soon(); return; } } }).observe(document.body, { childList:true, subtree:true });
    if(CFG.bg) bg();
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();

  /* fog and particles behind the page, colored by the page's gold */
  function bg(){
    var cv = document.createElement('canvas'); cv.id = 'fh-bg'; cv.setAttribute('aria-hidden','true');
    document.body.insertBefore(cv, document.body.firstChild);
    var x = cv.getContext('2d'), still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    var W, H, a = '233,185,73', h = '120,150,230', base = '#0d0d0f', fog = [], dust = [], T = 0, last = 0;
    function rnd(m,n){ return m + Math.random()*(n-m); }
    function hexRgb(v){ v = String(v||'').trim().replace('#',''); if(v.length===3) v=v[0]+v[0]+v[1]+v[1]+v[2]+v[2]; if(!/^[0-9a-f]{6}$/i.test(v)) return null; return parseInt(v.slice(0,2),16)+','+parseInt(v.slice(2,4),16)+','+parseInt(v.slice(4,6),16); }
    function cols(){ var cs = getComputedStyle(root); a = (cs.getPropertyValue('--gold-rgb').trim()) || hexRgb(cs.getPropertyValue('--gold')) || a; base = cs.getPropertyValue('--bg').trim() || base; }
    function build(){
      var d = Math.min(2, devicePixelRatio||1); W = innerWidth; H = innerHeight; cv.width = W*d; cv.height = H*d; x.setTransform(d,0,0,d,0,0);
      fog = []; for(var i=0;i<12;i++) fog.push({ x:rnd(-.2,1.2), y:rnd(.15,1.1), r:rnd(.25,.55), sp:rnd(.000006,.000016)*(i%2?1:-1), ph:rnd(0,6.28), c:i%3===0, al:rnd(.04,.09) });
      dust = []; var n = Math.round(Math.min(110, W*H/12000)); for(var j=0;j<n;j++) dust.push({ x:rnd(0,W), y:rnd(0,H), z:rnd(.2,1), s:rnd(0,6.28) });
    }
    function cloud(px,py,r,c,al){ var g = x.createRadialGradient(px,py,0,px,py,r); g.addColorStop(0,'rgba('+c+','+al+')'); g.addColorStop(.5,'rgba('+c+','+(al*.45)+')'); g.addColorStop(1,'rgba(0,0,0,0)'); x.fillStyle = g; x.fillRect(px-r,py-r,r*2,r*2); }
    function frame(now){
