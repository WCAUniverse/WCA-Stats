<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>WCA · Fire Pro</title>

<!-- Same fonts + icons + Supabase as the main site, so this page matches and shares the login -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600&family=Barlow:wght@400;500;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  /* base reset so this standalone page looks right on its own */
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:#0a0608;color:#fff;
    font-family:'Barlow',system-ui,sans-serif;overflow:hidden;}

  :root{ --loss:#E24B4A; --gold:#E9B949; }

  /* ============================================================
     FIRE PRO — additive. A toggleable nav button that "transports"
     the visitor through a hyperspace portal into a retro 16-bit
     themed "coming soon" section, with a way back. None of this
     renders unless site_settings.firepro.enabled is true (the
     button is created hidden and only revealed by JS).
     ============================================================ */

  /* The special nav button. Hidden by default; JS shows it only
     when the admin has the section enabled. Arcade look so it
     stands apart from the gold gallery nav. */
  #nav-firepro{
    display:none; position:relative;
    font-family:'Press Start 2P',monospace !important;
    font-size:9px !important; letter-spacing:1px !important;
    color:#ffd23f !important; text-transform:uppercase;
    padding:9px 14px !important;
    border:2px solid #ff3b3b !important; border-radius:4px !important;
    background:linear-gradient(180deg,#2a0a0a,#120406) !important;
    box-shadow:0 0 0 1px #000, 0 0 12px -2px #ff3b3b, inset 0 0 14px -8px #ffd23f;
    text-shadow:1px 1px 0 #b3001b;
    image-rendering:pixelated;
    animation:fpPulse 1.6s ease-in-out infinite;
  }
  #nav-firepro:hover{
    color:#fff !important; border-color:#ffd23f !important;
    box-shadow:0 0 0 1px #000, 0 0 18px 0 #ff3b3b, inset 0 0 14px -6px #ffd23f;
  }
  #nav-firepro::after{display:none !important;} /* kill the gallery underline */
  @keyframes fpPulse{
    0%,100%{box-shadow:0 0 0 1px #000, 0 0 10px -3px #ff3b3b, inset 0 0 14px -8px #ffd23f;}
    50%    {box-shadow:0 0 0 1px #000, 0 0 20px  0px #ff3b3b, inset 0 0 14px -5px #ffd23f;}
  }

  /* ---------- The portal / hyperspace transition overlay ---------- */
  #fp-portal{
    position:fixed; inset:0; z-index:99999; display:none;
    background:#000; overflow:hidden;
    opacity:0; pointer-events:none;
  }
  #fp-portal.on{display:block; opacity:1; pointer-events:auto;}
  /* the warp tunnel: concentric rings rushing the viewer */
  #fp-portal .fp-warp{
    position:absolute; left:50%; top:50%; width:2px; height:2px;
    transform:translate(-50%,-50%);
    background:
      radial-gradient(circle, #ffd23f 0%, transparent 60%);
  }
  #fp-portal .fp-ring{
    position:absolute; left:50%; top:50%; border-radius:50%;
    border:2px solid #ff3b3b;
    transform:translate(-50%,-50%) scale(0);
    box-shadow:0 0 24px 2px rgba(255,59,59,.7);
    opacity:0;
  }
  /* starfield streaks */
  #fp-portal .fp-stars{
    position:absolute; inset:0;
    background:
      radial-gradient(2px 2px at 20% 30%, #fff, transparent),
      radial-gradient(2px 2px at 70% 60%, #ffd23f, transparent),
      radial-gradient(1px 1px at 40% 80%, #fff, transparent),
      radial-gradient(2px 2px at 85% 20%, #ff8a3b, transparent),
      radial-gradient(1px 1px at 55% 45%, #fff, transparent),
      radial-gradient(2px 2px at 10% 70%, #fff, transparent),
      radial-gradient(1px 1px at 90% 85%, #ffd23f, transparent),
      radial-gradient(2px 2px at 30% 15%, #fff, transparent);
    opacity:0;
  }
  #fp-portal .fp-flash{
    position:absolute; inset:0; background:#fff; opacity:0;
  }
  #fp-portal .fp-label{
    position:absolute; left:0; right:0; top:50%; transform:translateY(-50%);
    text-align:center; font-family:'Press Start 2P',monospace;
    font-size:14px; letter-spacing:2px; color:#ffd23f;
    text-shadow:2px 2px 0 #b3001b, 0 0 18px rgba(255,59,59,.8);
    opacity:0;
  }
  /* play state: kick the keyframes */
  #fp-portal.warp .fp-stars{animation:fpStarRush .9s ease-in forwards;}
  #fp-portal.warp .fp-warp{animation:fpWarpGrow 1.1s ease-in forwards;}
  #fp-portal.warp .fp-label{animation:fpLabelIn 1.1s ease-out forwards;}
  #fp-portal.warp .fp-flash{animation:fpFlash 1.15s ease-in forwards;}
  @keyframes fpStarRush{
    0%{opacity:0; transform:scale(1);}
    20%{opacity:1;}
    100%{opacity:1; transform:scale(2.4);}
  }
  @keyframes fpWarpGrow{
    0%{opacity:0; width:2px; height:2px; box-shadow:0 0 0 0 #ffd23f;}
    30%{opacity:1;}
    100%{opacity:1; width:140vmax; height:140vmax;
         box-shadow:0 0 120px 40px #ff3b3b, inset 0 0 200px 60px #120406;}
  }
  @keyframes fpLabelIn{
    0%,30%{opacity:0; transform:translateY(-50%) scale(.7);}
    55%{opacity:1; transform:translateY(-50%) scale(1);}
    85%{opacity:1;}
    100%{opacity:0; transform:translateY(-50%) scale(1.1);}
  }
  @keyframes fpFlash{
    0%,80%{opacity:0;} 92%{opacity:1;} 100%{opacity:0;}
  }
  /* reverse warp (going back to the main site) */
  #fp-portal.warpback .fp-stars{animation:fpStarRush .8s ease-out reverse forwards;}
  #fp-portal.warpback .fp-warp{animation:fpWarpGrow .9s ease-out reverse forwards;}
  #fp-portal.warpback .fp-flash{animation:fpFlash .9s ease-in forwards;}

  /* ---------- The Fire Pro "coming soon" fullscreen view ---------- */
  #fp-zone{
    position:fixed; inset:0; z-index:9000; display:none;
    overflow-y:auto; background:#0a0506;
    font-family:'Press Start 2P',monospace; color:#ffe9b0;
    image-rendering:pixelated;
  }
  #fp-zone.on{display:block;}
  /* CRT scanline + arena vibe background */
  #fp-zone .fp-bg{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 2px, transparent 2px 4px),
      radial-gradient(120% 80% at 50% 0%, #3a0d0d 0%, #160505 45%, #0a0506 100%);
  }
  #fp-zone .fp-bg::after{ /* fiery floor band, echoing the FPW menus */
    content:''; position:absolute; left:0; right:0; bottom:0; height:34%;
    background:
      radial-gradient(80% 120% at 50% 120%, rgba(255,120,30,.45), transparent 70%),
      linear-gradient(0deg, rgba(255,59,59,.25), transparent);
    mix-blend-mode:screen;
  }
  #fp-zone .fp-inner{
    position:relative; z-index:1; min-height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:48px 20px 60px; gap:26px;
  }
  /* top bar: red FPW-style header strip with a back button */
  #fp-zone .fp-top{
    position:fixed; top:0; left:0; right:0; z-index:2;
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px;
    background:linear-gradient(180deg,#b3001b,#6e0010);
    border-bottom:3px solid #ffd23f;
    box-shadow:0 4px 18px -6px #000;
  }
  #fp-zone .fp-top .fp-tag{
    font-size:10px; letter-spacing:2px; color:#ffd23f;
    text-shadow:1px 1px 0 #000;
  }
  #fp-back{
    font-family:'Press Start 2P',monospace; cursor:pointer;
    font-size:9px; letter-spacing:1px; color:#0a0506;
    background:#ffd23f; border:2px solid #fff; border-radius:4px;
    padding:9px 12px; text-transform:uppercase;
    box-shadow:0 0 12px -2px #ffd23f;
    transition:.12s;
  }
  #fp-back:hover{background:#fff; box-shadow:0 0 16px 0 #ffd23f;}
  #fp-zone .fp-logo{
    max-width:min(560px,86vw); width:100%; height:auto;
    filter:drop-shadow(0 0 30px rgba(255,80,30,.55));
    image-rendering:auto;
  }
  /* text fallback if the logo PNG isn't in the repo yet */
  #fp-zone .fp-logo-fallback{
    font-size:clamp(16px,5vw,30px); line-height:1.5; color:#ffd23f;
    text-shadow:3px 3px 0 #b3001b, 0 0 22px rgba(255,59,59,.7);
  }
  #fp-zone .fp-soon{
    font-size:clamp(14px,4.5vw,26px); color:#fff;
    text-shadow:2px 2px 0 #b3001b; letter-spacing:1px;
    animation:fpBlink 1.2s steps(2,end) infinite;
  }
  @keyframes fpBlink{50%{opacity:.25;}}
  #fp-zone .fp-sub{
    font-size:9px; line-height:2; color:#ffb37a; max-width:520px;
    letter-spacing:1px;
  }
  #fp-zone .fp-press{
    margin-top:6px; font-size:8px; color:#9be0ff; letter-spacing:1px;
    animation:fpBlink 1.4s steps(2,end) infinite;
  }
  @media(max-width:600px){
    #fp-zone .fp-top .fp-tag{font-size:8px;}
    #fp-zone .fp-inner{padding-top:64px; gap:20px;}
  }
  @media(prefers-reduced-motion:reduce){
    #nav-firepro{animation:none;}
    #fp-portal *{animation-duration:.01s !important;}
    #fp-zone .fp-soon,#fp-zone .fp-press{animation:none;}
  }

  /* ---------- Persistent FIRE PRO music player (pinned to the bottom) ----------
     This bar will live on EVERY Fire Pro page. Track + position + volume + play
     state carry over between pages via sessionStorage, so the music keeps going
     as the visitor moves around. Hidden until the playlist files exist. */
  #fp-player{
    position:fixed; left:0; right:0; bottom:0; z-index:9500;
    display:none; align-items:center; gap:12px;
    padding:9px 14px calc(9px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(180deg,#6e0010,#3a0008);
    border-top:3px solid #ffd23f;
    box-shadow:0 -4px 22px -6px #000;
    font-family:'Press Start 2P',monospace;
  }
  #fp-player.show{display:flex;}
  /* transport buttons (prev / play / skip) */
  .fp-pbtn{
    font-family:'Press Start 2P',monospace; cursor:pointer;
    font-size:11px; line-height:1; color:#0a0506;
    background:#ffd23f; border:2px solid #fff; border-radius:4px;
    padding:9px 11px; text-transform:uppercase;
    box-shadow:0 0 10px -2px #ffd23f; transition:.12s; white-space:nowrap;
  }
  .fp-pbtn:hover{background:#fff; box-shadow:0 0 14px 0 #ffd23f;}
  .fp-pbtn:active{transform:translateY(1px);}
  #fp-play{min-width:42px;}
  /* now-playing label */
  #fp-now{
    flex:1 1 auto; min-width:0; overflow:hidden; white-space:nowrap;
    text-overflow:ellipsis;
    font-size:9px; letter-spacing:1px; color:#ffd23f;
    text-shadow:1px 1px 0 #000;
  }
  #fp-now b{color:#fff;}
  /* volume cluster */
  .fp-volwrap{display:flex; align-items:center; gap:9px; flex:0 0 auto;}
  #fp-mute{
    font-family:'Press Start 2P',monospace; cursor:pointer; font-size:10px;
    color:#ffd23f; background:transparent; border:2px solid #ffd23f;
    border-radius:4px; padding:8px 9px; transition:.12s; white-space:nowrap;
  }
  #fp-mute:hover{background:rgba(255,210,63,.15);}
  #fp-mute.muted{color:#0a0506; background:#ffd23f;}
  #fp-vol{
    -webkit-appearance:none; appearance:none; width:110px; height:6px;
    background:linear-gradient(90deg,#ff3b3b,#ffd23f); border-radius:6px;
    outline:none; cursor:pointer;
  }
  #fp-vol::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:15px; height:15px;
    border-radius:50%; background:#fff; border:2px solid #ffd23f;
    box-shadow:0 0 8px 0 #ffd23f; cursor:pointer;
  }
  #fp-vol::-moz-range-thumb{
    width:15px; height:15px; border-radius:50%; background:#fff;
    border:2px solid #ffd23f; box-shadow:0 0 8px 0 #ffd23f; cursor:pointer;
  }
  #fp-vol-pct{
    font-size:8px; color:#ffd23f; min-width:30px; text-align:right;
    text-shadow:1px 1px 0 #000;
  }
  /* keep the coming-soon content clear of the bottom bar */
  #fp-zone.has-player .fp-inner{ padding-bottom:96px; }
  @media(max-width:600px){
    #fp-player{gap:8px; padding:7px 9px calc(7px + env(safe-area-inset-bottom,0px)); flex-wrap:wrap;}
    .fp-pbtn{font-size:9px; padding:8px 8px;}
    #fp-now{flex-basis:100%; order:-1; font-size:8px; text-align:center;}
    #fp-vol{width:78px;}
    #fp-mute{font-size:8px; padding:7px 7px;}
  }

</style>
</head>
<body>

<!-- ===== ARRIVAL WARP (plays the tail end of the portal as you land here) ===== -->
<div id="fp-portal" class="on warpback" aria-hidden="true">
  <div class="fp-stars"></div>
  <div class="fp-warp"></div>
  <div class="fp-ring"></div>
  <div class="fp-flash"></div>
  <div class="fp-label">ENTERING&nbsp;FIRE&nbsp;PRO…</div>
</div>

<!-- ===== THE FIRE PRO ZONE (the coming-soon screen, now its own page) ===== -->
<div id="fp-zone" class="on" aria-hidden="false">
  <div class="fp-bg"></div>
  <div class="fp-top">
    <span class="fp-tag">WCA · FIRE PRO WRESTLING WORLD</span>

    <button id="fp-back" onclick="fpExit()">◄ BACK TO WCA</button>
  </div>
  <div class="fp-inner">
    <img class="fp-logo" src="../icons/firepro-logo.png" alt="WCA Fire Pro"
         onerror="this.style.display='none';document.getElementById('fp-logo-fallback').style.display='block';">
    <div class="fp-logo-fallback" id="fp-logo-fallback" style="display:none">WORLD<br>CHAMPIONSHIP<br>ALLIANCE</div>
    <div class="fp-soon">WCA FIRE PRO — COMING SOON</div>
    <div class="fp-sub" id="fp-sub-text">A 16-bit spin-off built in Fire Pro Wrestling World. Its own roster, its own rules, its own chaos. Under construction.</div>
    <div class="fp-press" id="fp-press-text">► PRESS &laquo;BACK TO WCA&raquo; TO RETURN ◄</div>
  </div>
</div>

<!-- ============================================================
     AUDIO  (live — files live in firepro/audio/)
     ------------------------------------------------------------
     BACKGROUND MUSIC playlist (4 tracks, auto-advancing):
       audio/bg-music-1.mp3 … audio/bg-music-4.mp3
     The persistent player bar at the BOTTOM controls it
     (previous / play / skip / volume + mute). The track, playhead
     position, volume and play state CARRY OVER between Fire Pro
     pages via sessionStorage, so the music keeps going as visitors
     move around. Volume starts at 10% on a first visit. Music never
     auto-blasts on the very first load — the visitor taps PLAY once
     (browsers block autoplay); after that it persists across pages.
     To add more tracks later: drop bg-music-5.mp3 in the folder and
     bump FP_TRACKS in the script below.
     ============================================================ -->
<audio id="fp-bg-music" loop preload="none"></audio>

<!-- WARP SOUND EFFECT (plays on arrival + on exit):
       File:  audio/Warp.mp3                                          -->
<audio id="fp-warp-sfx" preload="none" src="audio/Warp.mp3"></audio>

<!-- ===== PERSISTENT FIRE PRO MUSIC PLAYER (pinned bottom, lives on every FP page) ===== -->
<div id="fp-player" aria-label="Fire Pro music player">
  <button class="fp-pbtn" id="fp-prev" onclick="fpPrev()" title="Previous track" aria-label="Previous track">◄◄</button>
  <button class="fp-pbtn" id="fp-play" onclick="fpTogglePlay()" title="Play / pause" aria-label="Play or pause">►</button>
  <button class="fp-pbtn" id="fp-next" onclick="fpNext()" title="Next track" aria-label="Next track">►►</button>
  <div id="fp-now">♪ <b>Track 1</b></div>
  <div class="fp-volwrap">
    <button id="fp-mute" onclick="fpToggleMute()" title="Mute / unmute" aria-label="Mute or unmute">VOL</button>
    <input id="fp-vol" type="range" min="0" max="100" value="10"
           oninput="fpSetVolume(this.value)" aria-label="Music volume">
    <span id="fp-vol-pct">10%</span>
  </div>
</div>

<script>
// ===== SAME SUPABASE PROJECT AS THE MAIN SITE → login carries over automatically =====
const SUPABASE_URL = "https://dmfbhszvrbaknaevdhxh.supabase.co";
const SUPABASE_KEY = "sb_publishable_aXhRkucX-pMcEe-sgLMFkg_-wb3piFD";
let sb = null;
try{
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, flowType:'pkce' }
  });
}catch(e){ /* page still shows fine without the DB */ }

// Pull the admin-editable copy + music settings (same site_settings.firepro row).
async function fpLoadCopy(){
  if(!sb) return;
  try{
    const { data } = await sb.from('site_settings').select('firepro').eq('id',1).single();
    const fp = data && data.firepro;
    if(!fp) return;
    if(fp.sub  && String(fp.sub).trim()){  const s=document.getElementById('fp-sub-text');   if(s) s.textContent = fp.sub; }
    if(fp.press&& String(fp.press).trim()){ const p=document.getElementById('fp-press-text'); if(p) p.textContent = fp.press; }
    // ----- music settings from the Fire Pro admin -----
    if(fp.music){
      const m = fp.music;
      // build the playlist from the admin track count
      const n = (typeof m.count === 'number' && m.count > 0) ? Math.min(m.count, 50) : 0;
      if(n > 0){
        FP_TRACKS = [];
        for(let i=1;i<=n;i++){ FP_TRACKS.push('audio/bg-music-'+i+'.mp3'); }
      }
      // custom track names (optional)
      _fpNames = Array.isArray(m.names) ? m.names.slice() : [];
      // default starting volume (only used if the visitor has no saved volume yet)
      if(typeof m.defaultVol === 'number') _fpDefaultVol = Math.max(0, Math.min(100, m.defaultVol));
    }
  }catch(e){}
}

// ===== ARRIVAL: play the warp tail, then settle on the zone =====
window.addEventListener('load', ()=>{
  const portal = document.getElementById('fp-portal');
  // resume the warp sound from where the previous page left off (seamless fade)
  fpResumeSfx();
  // let the reverse-warp animation finish, then clear the overlay
  setTimeout(()=>{ if(portal){ portal.classList.remove('on','warpback'); } }, 950);
  // load admin copy + music settings FIRST, then boot the player so it uses them
  fpLoadCopy().then(fpPlayerInit).catch(fpPlayerInit);
});

// ===== BACK BUTTON: warp out, then go to the main site =====
function fpExit(){
  const portal = document.getElementById('fp-portal');
  _fpSaveState();   // capture music position/track before we leave
  fpPlaySfx();
  if(portal){
    portal.classList.remove('warp','warpback');
    portal.classList.add('on');
    void portal.offsetWidth;
    portal.classList.add('warp');   // forward warp = "leaving into the flash"
  }
  // at the bright flash, jump back to the main site
  setTimeout(()=>{ window.location.href = '../index.html'; }, 700);
}

// ===== AUDIO HELPERS (do nothing until you add files) =====
function fpPlaySfx(){
  const a = document.getElementById('fp-warp-sfx');
  if(a && a.getAttribute('src')){ try{ a.currentTime=0; a.play().catch(()=>{}); }catch(e){} }
}
// Resume the warp sound from where it was on the previous page, so a long
// fade plays out seamlessly across the page jump. Falls back to playing from
// the start if we don't have a timestamp.
function fpResumeSfx(){
  const a = document.getElementById('fp-warp-sfx');
  if(!(a && a.getAttribute('src'))) return;
  let offset = 0;
  try{
    const started = parseInt(sessionStorage.getItem('fpSfxStart')||'0', 10);
    if(started){ offset = (Date.now() - started) / 1000; }   // seconds elapsed
    sessionStorage.removeItem('fpSfxStart');
  }catch(e){}
  try{
    a.currentTime = (offset > 0 && offset < 30) ? offset : 0;
    a.play().catch(()=>{});
  }catch(e){ try{ a.currentTime=0; a.play().catch(()=>{}); }catch(e2){} }
}
function fpSetupMusicButton(){
  // kept as a no-op shim so any older call sites don't error; the new
  // bottom player handles its own setup in fpPlayerInit().
}

/* =====================================================================
   FIRE PRO MUSIC PLAYER  (persistent across Fire Pro pages)
   ---------------------------------------------------------------------
   • 4-track playlist, auto-advances when a track ends.
   • Prev / Play-Pause / Next + volume slider + mute.
   • Volume starts at 10% on a first visit; remembered after that.
   • Track index, playhead position, play state, volume and mute all
     persist in sessionStorage so the music keeps going (from the same
     spot) as the visitor moves between Fire Pro pages.
   • Never autoplays on the very first load (browsers block it) — the
     visitor taps ► once; from then on it resumes across pages.
   The track count, names, and default volume all come from the Fire Pro
   ADMIN (firepro-admin.html → 🎵 Background music). This list is just a
   fallback if the admin settings haven't loaded yet.
   ===================================================================== */
let FP_TRACKS = [
  'audio/bg-music-1.mp3',
  'audio/bg-music-2.mp3',
  'audio/bg-music-3.mp3',
  'audio/bg-music-4.mp3'
];
let _fpNames = [];          // custom track names from admin (optional)
let _fpDefaultVol = 10;     // admin-set starting volume for new visitors
const FP_MUSIC_KEY = 'fpMusicState';   // sessionStorage blob

let _fpIdx = 0;          // current track index
let _fpVol = 10;         // 0–100
let _fpMuted = false;
let _fpWantPlay = false;  // should music be playing?

function _fpLoadState(){
  try{
    const raw = sessionStorage.getItem(FP_MUSIC_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function _fpSaveState(){
  const a = document.getElementById('fp-bg-music');
  const blob = {
    idx: _fpIdx,
    vol: _fpVol,
    muted: _fpMuted,
    playing: _fpWantPlay,
    t: (a && !isNaN(a.currentTime)) ? a.currentTime : 0,
    ts: Date.now()
  };
  try{ sessionStorage.setItem(FP_MUSIC_KEY, JSON.stringify(blob)); }catch(e){}
}

function fpPlayerInit(){
  const a = document.getElementById('fp-bg-music');
  const bar = document.getElementById('fp-player');
  const zone = document.getElementById('fp-zone');
  if(!a || !bar) return;
  if(!FP_TRACKS.length) return;

  // reveal the bar + give the content room above it
  bar.classList.add('show');
  if(zone) zone.classList.add('has-player');

  // restore saved state (carried over from the previous Fire Pro page).
  // first-time visitor (no saved state) → use the admin-set default volume.
  const st = _fpLoadState();
  let resumeAt = 0;
  if(st){
    _fpIdx   = (typeof st.idx === 'number' && st.idx >= 0) ? st.idx : 0;
    _fpVol   = (typeof st.vol === 'number') ? st.vol : _fpDefaultVol;
    _fpMuted = !!st.muted;
    _fpWantPlay = !!st.playing;
    resumeAt = (typeof st.t === 'number') ? st.t : 0;
  } else {
    _fpVol = _fpDefaultVol;   // first visit → admin default (e.g. 10%)
  }
  // keep the track index valid even if the admin changed the track count
  if(_fpIdx >= FP_TRACKS.length) _fpIdx = 0;

  // load the current track + apply volume/position
  a.src = FP_TRACKS[_fpIdx];
  a.volume = _fpMuted ? 0 : (_fpVol/100);
  try{ a.currentTime = resumeAt > 0 ? resumeAt : 0; }catch(e){}

  // auto-advance when a track finishes
  a.addEventListener('ended', fpNext);
  // if a track fails to load (bad filename etc.), skip to the next one
  // instead of stalling the whole playlist — but only while we're trying to play
  a.addEventListener('error', ()=>{ if(_fpWantPlay) setTimeout(fpNext, 400); });
  window.addEventListener('pagehide', _fpSaveState);
  window.addEventListener('beforeunload', _fpSaveState);

  fpRenderPlayer();

  // if music was already playing on the previous page, try to resume.
  // (works because the visitor already interacted earlier in the session)
  if(_fpWantPlay){
    a.play().then(()=>{ _fpWantPlay = true; fpRenderPlayer(); })
            .catch(()=>{ _fpWantPlay = false; fpRenderPlayer(); }); // blocked → wait for a tap
  }
}

function fpRenderPlayer(){
  const playBtn = document.getElementById('fp-play');
  const muteBtn = document.getElementById('fp-mute');
  const vol     = document.getElementById('fp-vol');
  const pct     = document.getElementById('fp-vol-pct');
  const now     = document.getElementById('fp-now');
  if(playBtn) playBtn.textContent = _fpWantPlay ? '❚❚' : '►';
  if(muteBtn){ muteBtn.textContent = _fpMuted ? 'MUTED' : 'VOL'; muteBtn.classList.toggle('muted', _fpMuted); }
  if(vol) vol.value = _fpVol;
  if(pct) pct.textContent = _fpVol + '%';
  if(now){
    const nm = (_fpNames && _fpNames[_fpIdx] && String(_fpNames[_fpIdx]).trim());
    now.innerHTML = '♪ <b>' + (nm ? nm.replace(/</g,'&lt;') : ('Track ' + (_fpIdx+1))) + '</b>';
  }
}

function fpTogglePlay(){
  const a = document.getElementById('fp-bg-music');
  if(!a) return;
  if(_fpWantPlay){
    a.pause(); _fpWantPlay = false;
  } else {
    a.play().then(()=>{ _fpWantPlay = true; fpRenderPlayer(); _fpSaveState(); })
            .catch(()=>{ _fpWantPlay = false; fpRenderPlayer(); });
    _fpWantPlay = true;
  }
  fpRenderPlayer(); _fpSaveState();
}

function fpLoadTrack(i, autoplay){
  const a = document.getElementById('fp-bg-music');
  if(!a || !FP_TRACKS.length) return;
  _fpIdx = (i + FP_TRACKS.length) % FP_TRACKS.length;   // wrap around
  a.src = FP_TRACKS[_fpIdx];
  try{ a.currentTime = 0; }catch(e){}
  a.volume = _fpMuted ? 0 : (_fpVol/100);
  if(autoplay){
    a.play().then(()=>{ _fpWantPlay = true; fpRenderPlayer(); _fpSaveState(); })
            .catch(()=>{ _fpWantPlay = false; fpRenderPlayer(); });
  }
  fpRenderPlayer(); _fpSaveState();
}
function fpNext(){ fpLoadTrack(_fpIdx + 1, true); }
function fpPrev(){
  const a = document.getElementById('fp-bg-music');
  // if more than 3s into a track, ◄◄ restarts it; otherwise go to previous
  if(a && a.currentTime > 3){ try{ a.currentTime = 0; }catch(e){} _fpSaveState(); return; }
  fpLoadTrack(_fpIdx - 1, true);
}

function fpSetVolume(v){
  _fpVol = Math.max(0, Math.min(100, parseInt(v,10)||0));
  const a = document.getElementById('fp-bg-music');
  // moving the slider above 0 also un-mutes
  if(_fpVol > 0 && _fpMuted){ _fpMuted = false; }
  if(a) a.volume = _fpMuted ? 0 : (_fpVol/100);
  fpRenderPlayer(); _fpSaveState();
}
function fpToggleMute(){
  const a = document.getElementById('fp-bg-music');
  _fpMuted = !_fpMuted;
  if(a) a.volume = _fpMuted ? 0 : (_fpVol/100);
  fpRenderPlayer(); _fpSaveState();
}

// legacy name kept so nothing else breaks
function fpToggleMusic(){ fpTogglePlay(); }
</script>
</body>
</html>
