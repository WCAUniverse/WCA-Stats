<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WCA — World Championship Alliance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0d0d0f; --panel:#161618; --panel2:#1d1d20; --line:#2a2a2e;
    --gold:#E9B949; --gold-dim:#b08d2e; --gold-deep:#1f1d16;
    --win:#3ECF8E; --loss:#E24B4A; --teal:#5DCAA5;
    --txt:#f2f2f0; --muted:#8a8a86; --muted2:#5c5c58;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--txt); font-family:'Barlow',sans-serif; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,.disp{font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:.5px; text-transform:uppercase;}
  .cond{font-family:'Barlow Condensed',sans-serif;}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px 80px;}

  /* header */
  header{border-bottom:1px solid var(--line); background:linear-gradient(180deg,#111 0%,var(--bg) 100%);}
  .head-inner{max-width:1080px; margin:0 auto; padding:22px 20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;}
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand .logo{font-family:'Oswald'; font-weight:700; font-size:28px; color:var(--gold); letter-spacing:2px;}
  .brand .sub{font-size:12px; color:var(--muted); letter-spacing:3px; text-transform:uppercase;}
  nav{display:flex; gap:4px; flex-wrap:wrap;}
  nav button{background:transparent; border:1px solid transparent; color:var(--muted); font-family:'Oswald'; font-size:13px; letter-spacing:1px; text-transform:uppercase; padding:8px 14px; border-radius:6px; cursor:pointer; transition:.15s;}
  nav button:hover{color:var(--txt);}
  nav button.active{color:#111; background:var(--gold); font-weight:600;}
.head-right{display:flex; align-items:center; gap:18px; flex-wrap:wrap;}
  .socials{display:flex; align-items:center; gap:6px;}
  .socials a{
    color:var(--muted); font-size:20px; line-height:1;
    width:34px; height:34px; display:flex; align-items:center; justify-content:center;
    border:1px solid transparent; border-radius:8px; transition:.15s;
  }
  .socials a:hover{color:var(--gold); border-color:var(--line); transform:translateY(-2px);}
  /* brand-color hovers */
  .socials a[aria-label="Twitch"]:hover{color:#9146FF;}
  .socials a[aria-label="YouTube"]:hover{color:#FF0000;}
  .socials a[aria-label="TikTok"]:hover{color:#25F4EE;}
  .socials a[aria-label="Instagram"]:hover{color:#E1306C;}
  .socials a[aria-label="Discord"]:hover{color:#5865F2;}
  @media(max-width:560px){
    .socials{margin-top:4px; gap:10px;}
    .socials a{font-size:22px;}
  }
  .section-title{font-size:13px; color:var(--gold); letter-spacing:3px; margin:36px 0 14px; display:flex; align-items:center; gap:10px;}
  .section-title::after{content:''; flex:1; height:1px; background:var(--line);}

  /* champion dashboard cards */
  .champ-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px;}
  .champ-card{background:var(--gold-deep); border:1px solid var(--gold); border-radius:10px; padding:16px; position:relative; overflow:hidden;}
  .champ-card.chat{background:#1a132b; border-color:#9146FF;}
  .champ-card.chat .lbl{color:#b89cff;}
  .champ-card.chat .belt{color:rgba(145,70,255,.10);}
  .champ-card.vacant{background:#161618; border-color:var(--line);}
  .champ-card.vacant .who{color:var(--muted2); font-style:italic;}
  .champ-card.vacant .lbl{color:var(--muted);}
  .champ-card .lbl{font-family:'Oswald'; font-size:11px; letter-spacing:2px; color:var(--gold-dim); display:flex; align-items:center; gap:6px; margin-bottom:8px;}
  .champ-card .who{font-family:'Oswald'; font-size:24px; font-weight:600; color:#fff; line-height:1.1;}
  .champ-card .meta{font-size:13px; color:var(--muted); margin-top:4px;}
  .champ-card .belt{position:absolute; right:-8px; top:-8px; font-size:60px; color:rgba(233,185,73,.07);}

  /* division block */
  .division{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:6px 6px 10px; margin-bottom:18px;}
  .div-head{display:flex; align-items:center; justify-content:space-between; padding:12px 14px 8px;}
  .div-head h3{font-size:18px; color:#fff;}
  .div-head .count{font-size:12px; color:var(--muted); font-family:'Barlow';}

  .row{display:flex; align-items:center; gap:14px; padding:9px 14px; border-radius:8px;}
  .row.champ{background:var(--gold-deep); border:1px solid var(--gold); margin:0 6px 6px;}
  .row.alt{background:rgba(255,255,255,.02);}
  .rank{width:26px; text-align:center; font-family:'Oswald'; font-size:16px; color:var(--muted); flex-shrink:0;}
  .row.champ .rank{color:var(--gold);}
  .nm{flex:1; font-family:'Barlow Condensed'; font-size:19px; font-weight:500; color:#eee; min-width:0;}
  .row.champ .nm{color:#fff;}
  .tag{font-family:'Oswald'; font-size:10px; letter-spacing:1.5px; padding:2px 7px; border-radius:4px; margin-left:8px; white-space:nowrap;}
  .tag.champ{background:var(--gold); color:#111;}
  .tag.ready{background:rgba(62,207,142,.15); color:var(--win); border:1px solid rgba(62,207,142,.4);}
  .tag.tie{background:rgba(93,202,165,.12); color:var(--teal);}

  /* contender dots */
  .dots{display:flex; gap:4px; flex-shrink:0;}
  .dot{width:10px; height:10px; border-radius:50%; background:#34343a;}
  .dot.on{background:var(--gold);}

  /* radial ring */
  .ring{width:46px; height:46px; flex-shrink:0; position:relative;}
  .ring svg{transform:rotate(-90deg);}
  .ring .pct{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Oswald'; font-size:12px; font-weight:600; color:#fff;}
  .wl{font-family:'Barlow Condensed'; font-size:15px; color:var(--muted); width:54px; text-align:right; flex-shrink:0;}
  .wl b{color:var(--win); font-weight:600;} .wl s{color:var(--loss); text-decoration:none; font-weight:600;}

  /* roster */
  .search{width:100%; background:var(--panel); border:1px solid var(--line); color:var(--txt); font-family:'Barlow'; font-size:15px; padding:12px 14px; border-radius:8px; margin-bottom:16px;}
  .search:focus{outline:none; border-color:var(--gold);}
  .roster-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px;}
  .rcard{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; display:flex; align-items:center; gap:12px;}
  .rcard .av{width:38px; height:38px; border-radius:50%; background:var(--panel2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-family:'Oswald'; font-size:14px; color:var(--gold); flex-shrink:0;}
  .rcard .info{flex:1; min-width:0;}
  .rcard .rn{font-family:'Barlow Condensed'; font-size:18px; font-weight:500; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rcard .rmeta{font-size:12px; color:var(--muted);}
  .gender-pill{font-size:10px; font-family:'Oswald'; letter-spacing:1px; padding:1px 6px; border-radius:4px; background:var(--panel2); color:var(--muted);}

  /* roster photo avatars + clickable cards */
  .rcard{cursor:pointer; transition:.15s;}
  .rcard:hover{border-color:var(--gold); transform:translateY(-2px);}
  .av.av-img{padding:0; overflow:hidden;}
  .av.av-img img{width:100%; height:100%; object-fit:cover; display:block;}
  .rmeta.nick{color:var(--gold-dim); font-style:italic; font-family:'Barlow Condensed'; font-size:14px;}

  /* profile modal */
  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.78); backdrop-filter:blur(3px);
    display:none; align-items:flex-start; justify-content:center; padding:40px 16px; z-index:100; overflow-y:auto;}
  .modal-overlay.open{display:flex;}
  .modal-box{background:var(--panel); border:1px solid var(--gold); border-radius:14px;
    width:100%; max-width:520px; padding:24px; position:relative; box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .modal-close{position:absolute; top:12px; right:12px; background:var(--panel2); border:1px solid var(--line);
    color:var(--muted); width:32px; height:32px; border-radius:8px; cursor:pointer; font-size:18px;
    display:flex; align-items:center; justify-content:center; transition:.15s;}
  .modal-close:hover{color:var(--txt); border-color:var(--gold);}
  .pf-head{display:flex; gap:16px; align-items:center; margin-bottom:16px;}
  .pf-photo{width:140px; height:187px; border-radius:12px; overflow:hidden; flex-shrink:0;
    border:1px solid var(--gold); background:var(--panel2);}
  .pf-photo img{width:100%; height:100%; object-fit:contain; object-position:bottom; display:block;}
  .pf-photo-init{display:flex; align-items:center; justify-content:center;
    font-family:'Oswald'; font-size:32px; color:var(--gold);}
  .pf-nick{font-family:'Barlow Condensed'; font-style:italic; color:var(--gold-dim); font-size:16px;}
  .pf-name{font-size:26px; color:#fff; line-height:1.1; margin:2px 0 6px;}
  .pf-tags{display:flex; gap:6px;}
  .pf-bio{font-size:14px; line-height:1.6; color:var(--muted); margin-bottom:16px;
    padding-bottom:16px; border-bottom:1px solid var(--line);}
  .pf-fields{display:flex; flex-direction:column; gap:0;}
  .pf-row{display:flex; gap:12px; padding:9px 0; border-bottom:1px solid var(--line);}
  .pf-row:last-child{border-bottom:none;}
  .pf-lbl{font-family:'Oswald'; font-size:11px; letter-spacing:1.5px; text-transform:uppercase;
    color:var(--gold-dim); width:100px; flex-shrink:0; padding-top:2px;}
  .pf-val{font-family:'Barlow'; font-size:15px; color:var(--txt); flex:1; min-width:0;}
  .pf-val a{color:var(--gold); text-decoration:none;}
  .pf-val a:hover{text-decoration:underline;}
  .pf-empty{color:var(--muted2); font-style:italic; font-size:14px;}
  @media(max-width:480px){
    .pf-head{flex-direction:column; text-align:center;}
    .pf-tags{justify-content:center;}
    .pf-lbl{width:84px;}
  }

  .loading{text-align:center; color:var(--muted); padding:60px 0; font-family:'Oswald'; letter-spacing:2px;}
  .err{background:#2a1515; border:1px solid var(--loss); color:#f0a0a0; padding:16px; border-radius:10px; margin:20px 0; font-size:14px; line-height:1.6;}
  .page{display:none;} .page.active{display:block;}
  .legend{display:flex; gap:18px; font-size:12px; color:var(--muted); margin:6px 0 20px; flex-wrap:wrap;}
  .legend span{display:flex; align-items:center; gap:6px;}

  /* ===== EVENTS / FIGHT CARD ===== */
  .event-hero{position:relative; border:1px solid var(--gold); border-radius:14px; overflow:hidden;
    margin:30px 0 22px; background:linear-gradient(180deg,#1a1710,#0d0d0f);}
  .event-hero .hero-bg{position:absolute; inset:0; background-size:cover; background-position:center; opacity:.25;}
  .event-hero .hero-in{position:relative; padding:38px 24px; text-align:center;}
  .event-hero .ev-name{font-family:'Oswald'; font-weight:700; font-size:clamp(38px,9vw,72px);
    color:var(--gold); letter-spacing:3px; line-height:.95; text-shadow:0 2px 20px rgba(0,0,0,.6);}
  .event-hero .ev-tag{font-family:'Barlow Condensed'; font-size:clamp(18px,3vw,26px); color:#fff;
    letter-spacing:2px; text-transform:uppercase; margin-top:4px; opacity:.92;}
  .event-meta{display:flex; gap:24px; justify-content:center; flex-wrap:wrap; margin-top:18px;}
  .event-meta .mi{display:flex; align-items:center; gap:8px; font-family:'Barlow Condensed';
    font-size:17px; color:#ddd; letter-spacing:.5px;}
  .event-meta .mi i{color:var(--gold); font-size:18px;}

  .card-list{display:flex; flex-direction:column; gap:12px; margin-top:6px;}
  .bout{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px;
    position:relative; transition:.15s;}
  .bout.main{border-color:var(--gold); background:var(--gold-deep);}
  .bout .bout-label{display:flex; align-items:center; justify-content:center; gap:10px;
    font-family:'Oswald'; font-size:11px; letter-spacing:2px; color:var(--gold-dim); text-transform:uppercase; margin-bottom:10px;}
  .bout.main .bout-label{color:var(--gold);}
  .bout .bout-label::before,.bout .bout-label::after{content:''; height:1px; width:40px; background:var(--line);}
  .bout .vs-row{display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap;}
  .bout .fighter{flex:1; min-width:0; text-align:center;}
  .bout .fighter .fname{font-family:'Oswald'; font-weight:600; font-size:clamp(18px,3.4vw,28px);
    color:#fff; line-height:1.05; letter-spacing:.5px;}
  .bout.main .fighter .fname{font-size:clamp(20px,4vw,34px);}
  .bout .fighter .fsub{font-family:'Barlow Condensed'; font-size:14px; color:var(--muted); margin-top:2px;}
  .bout .vs{font-family:'Oswald'; font-weight:700; font-size:20px; color:var(--gold);
    flex-shrink:0; padding:0 4px; opacity:.9;}
  .bout .stip{text-align:center; font-family:'Barlow Condensed'; font-size:14px; letter-spacing:1px;
    color:var(--teal); text-transform:uppercase; margin-top:8px;}
  .bout .bnotes{text-align:center; font-size:12px; color:var(--muted); margin-top:6px; font-style:italic;}
  .name-link{cursor:pointer; transition:.12s;}
  .name-link:hover{color:var(--gold);}

  .stream-wrap{margin:26px 0 0;}
  .stream-frame{position:relative; padding-top:56.25%; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#000;}
  .stream-frame iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}

  .event-empty{text-align:center; color:var(--muted); padding:70px 20px; font-family:'Oswald'; letter-spacing:2px;}

  /* belt images across the site */
  .belt-bg{position:absolute; right:-10px; top:-6px; width:96px; height:96px; object-fit:contain; opacity:.10; pointer-events:none;}
  .lbl-belt{height:16px; width:auto; vertical-align:middle; object-fit:contain;}
  .rank-belt{width:30px; height:30px; object-fit:contain; vertical-align:middle;}
  i.rank-belt{font-size:20px;}
  .belt-ico{}

  /* title-on-line badge on a bout */
  .title-on-line{display:flex; align-items:center; justify-content:center; gap:8px; margin:2px 0 10px;
    font-family:'Oswald'; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:var(--gold);}
  .title-belt{height:26px; width:auto; object-fit:contain; filter:drop-shadow(0 1px 3px rgba(0,0,0,.5));}

  /* multi-member sides */
  .fmembers{font-family:'Barlow Condensed'; font-size:16px; color:var(--muted); margin-top:2px; line-height:1.2;}
  .bout.main .fmembers{font-size:18px; color:#cfcfcf;}
  .amp{font-family:'Oswald'; font-size:13px; color:var(--gold-dim); margin:1px 0;}
  /* tighten layout when 3 or 4 sides share a row */
  .bout.sides-3 .fighter .fname,.bout.sides-4 .fighter .fname{font-size:clamp(15px,2.6vw,22px);}
  .bout.sides-4 .vs{font-size:16px;}
  @media(max-width:560px){
    .bout.sides-3 .vs-row,.bout.sides-4 .vs-row{flex-direction:column;}
    .bout.sides-3 .vs,.bout.sides-4 .vs{padding:2px 0;}
  }

  /* auth / balance */
  .userbox{display:flex; align-items:center; gap:10px;}
  .login-btn{background:#5865F2; color:#fff; border:none; font-family:'Oswald'; font-size:13px;
    letter-spacing:1px; text-transform:uppercase; padding:9px 14px; border-radius:8px; cursor:pointer;
    display:flex; align-items:center; gap:7px; transition:.15s;}
  .login-btn:hover{filter:brightness(1.1); transform:translateY(-1px);}
  .login-btn i{font-size:16px;}
  .user-chip{display:flex; align-items:center; gap:9px; background:var(--panel); border:1px solid var(--line);
    border-radius:30px; padding:5px 6px 5px 10px;}
  .user-chip .uava{width:28px; height:28px; border-radius:50%; object-fit:cover; border:1px solid var(--gold);}
  .user-chip .uava-init{width:28px;height:28px;border-radius:50%;background:var(--gold-deep);border:1px solid var(--gold);
    display:flex;align-items:center;justify-content:center;font-family:'Oswald';font-size:12px;color:var(--gold);}
  .user-chip .ubal{font-family:'Oswald'; font-size:15px; color:var(--gold); font-weight:600; line-height:1;}
  .user-chip .uname{font-family:'Barlow Condensed'; font-size:12px; color:var(--muted); line-height:1;}
  .user-chip .ucol{display:flex; flex-direction:column; gap:2px;}
  .logout-x{background:transparent; border:none; color:var(--muted2); cursor:pointer; font-size:16px; padding:2px 6px; border-radius:6px;}
  .logout-x:hover{color:var(--loss);}
  @media(max-width:560px){ .userbox{margin-top:6px;} }
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <div class="brand">
      <span class="logo">WCA</span>
      <span class="sub">World Championship Alliance</span>
    </div>
    <div class="head-right">
      <nav>
        <button data-page="dash" class="active">Dashboard</button>
        <button data-page="events">Events</button>
        <button data-page="mens">Mens</button>
        <button data-page="womens">Womens</button>
        <button data-page="undisputed">Undisputed</button>
        <button data-page="factions">Factions</button>
        <button data-page="roster">Roster</button>
      </nav>
      <div class="socials">
        <a href="https://twitch.tv/Infantryink" target="_blank" rel="noopener noreferrer" aria-label="Twitch" title="Twitch"><i class="ti ti-brand-twitch"></i></a>
        <a href="https://youtube.com/@WCAUniverse" target="_blank" rel="noopener noreferrer" aria-label="YouTube" title="YouTube"><i class="ti ti-brand-youtube"></i></a>
        <a href="https://tiktok.com/@wcauniverse" target="_blank" rel="noopener noreferrer" aria-label="TikTok" title="TikTok"><i class="ti ti-brand-tiktok"></i></a>
        <a href="https://instagram.com/wcauniverse" target="_blank" rel="noopener noreferrer" aria-label="Instagram" title="Instagram"><i class="ti ti-brand-instagram"></i></a>
        <a href="https://discord.gg/SBFAnU8SDT" target="_blank" rel="noopener noreferrer" aria-label="Discord" title="Discord"><i class="ti ti-brand-discord"></i></a>
      </div>
      <div class="userbox" id="userbox">
        <button class="login-btn" id="loginBtn"><i class="ti ti-brand-discord"></i> Sign in</button>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <div id="config-error"></div>

  <!-- DASHBOARD -->
  <div class="page active" id="page-dash">
    <div class="section-title">Current Champions</div>
    <div class="champ-grid" id="champ-cards"><div class="loading">Loading…</div></div>

    <div class="section-title">Division Standings — top 5</div>
    <div id="contenders"><div class="loading">Loading…</div></div>
  </div>

  <!-- EVENTS / FIGHT CARD -->
  <div class="page" id="page-events">
    <div id="events-content"><div class="loading">Loading…</div></div>
  </div>

  <!-- DIVISION PAGES -->
  <div class="page" id="page-mens"><div class="legend"><span><span class="dot on" style="position:static"></span> = contender point (3 = ready)</span><span><b style="color:var(--win)">green</b> wins · <s style="color:var(--loss)">red</s> losses</span></div><div id="mens-content"></div></div>
  <div class="page" id="page-womens"><div id="womens-content"></div></div>
  <div class="page" id="page-undisputed"><div id="undisputed-content"></div></div>
  <div class="page" id="page-factions"><div id="factions-content"></div></div>

  <!-- ROSTER -->
  <div class="page" id="page-roster">
    <div class="section-title">Full Roster — A to Z</div>
    <input class="search" id="roster-search" placeholder="Search wrestlers…" autocomplete="off">
    <div class="roster-grid" id="roster-grid"><div class="loading">Loading…</div></div>
  </div>
</div>

<!-- WRESTLER PROFILE MODAL -->
<div class="modal-overlay" id="profile-modal" onclick="if(event.target===this)closeProfile()">
  <div class="modal-box">
    <button class="modal-close" onclick="closeProfile()" aria-label="Close"><i class="ti ti-x"></i></button>
    <div id="profile-body"></div>
  </div>
</div>

<script>
// ============================================================================
//  ONE STEP LEFT: paste your Publishable key on the line below.
//  In Supabase: Settings (gear) > API Keys > "Publishable key"
//  (it starts with  sb_publishable_... ) > click the copy icon.
//  Paste it between the quotes on the SUPABASE_KEY line, keep the quotes, save.
//  Your Project URL is already filled in for you.
// ============================================================================
const SUPABASE_URL = "https://dmfbhszvrbaknaevdhxh.supabase.co";
const SUPABASE_KEY = "sb_publishable_aXhRkucX-pMcEe-sgLMFkg_-wb3piFD";
// ============================================================================

let sb = null;
const isConfigured = SUPABASE_URL.startsWith("http") && SUPABASE_KEY.length > 20;
if (isConfigured) sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function ringSVG(pct){
  const r=18, c=2*Math.PI*r, off=c*(1-pct);
  return `<div class="ring"><svg width="46" height="46" viewBox="0 0 46 46">
    <circle cx="23" cy="23" r="${r}" fill="none" stroke="var(--loss)" stroke-width="5" opacity="0.55"/>
    <circle cx="23" cy="23" r="${r}" fill="none" stroke="var(--win)" stroke-width="5"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" stroke-linecap="round"/>
  </svg><div class="pct">${Math.round(pct*100)}%</div></div>`;
}
function dots(n){
  let h='<div class="dots">';
  for(let i=0;i<3;i++) h+=`<span class="dot ${i<n?'on':''}"></span>`;
  return h+'</div>';
}
function rowHTML(p, idx, isChamp, div){
  const champ = isChamp;
  const ready = p.is_ready_contender;
  let tags='';
  if(champ) tags+='<span class="tag champ">Champion</span>';
  else if(ready) tags+='<span class="tag ready">#1 Contender</span>';
  const rankCell = champ
    ? beltIcon(div, 'rank-belt')
    : p._slot;
  return `<div class="row ${champ?'champ':(idx%2?'alt':'')}">
    <div class="rank">${rankCell}</div>
    ${ringSVG(p.win_pct||0)}
    <div class="nm">${esc(p.name)}${tags}</div>
    ${champ?'':dots(p.contender_points||0)}
    <div class="wl"><b>${p.wins}</b>-<s>${p.losses}</s></div>
  </div>`;
}
function esc(s){if(Array.isArray(s))s=s.join(', ');return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// ===== BELTS: division -> image =====
let BELTS = {};
async function loadBelts(){
  const {data}=await sb.from('belts').select('*');
  (data||[]).forEach(b=>{ BELTS[b.division]=b; });
}
function beltFor(div){ return BELTS[div]||null; }
// Returns an <img> belt if available for that division, else a trophy icon.
function beltIcon(div, cls){
  const b=beltFor(div);
  if(b && b.image_url) return `<img class="${cls||'belt-ico'}" src="${esc(b.image_url)}" alt="${esc(div)} championship">`;
  return `<i class="ti ti-trophy ${cls||'belt-ico'}" style="color:var(--gold)"></i>`;
}

// ===== AUTH + POINTS =====
let CURRENT_USER = null;   // { id, ... } from auth
let MY_PROFILE = null;     // row from profiles
function fmtMoney(n){ return '$' + (Number(n)||0).toLocaleString('en-US'); }

async function signInDiscord(){
  await sb.auth.signInWithOAuth({
    provider: 'discord',
    options: { redirectTo: window.location.href }
  });
}
async function signOut(){ await sb.auth.signOut(); location.reload(); }

async function refreshUser(){
  const { data:{ user } } = await sb.auth.getUser();
  CURRENT_USER = user || null;
  const box = document.getElementById('userbox');
  if(!CURRENT_USER){
    box.innerHTML = `<button class="login-btn" id="loginBtn"><i class="ti ti-brand-discord"></i> Sign in</button>`;
    document.getElementById('loginBtn').onclick = signInDiscord;
    MY_PROFILE = null;
    return;
  }
  // claim any idle points, then load profile
  try{ await sb.rpc('claim_idle_points'); }catch(e){}
  const { data:prof } = await sb.from('profiles').select('*').eq('id', CURRENT_USER.id).single();
  MY_PROFILE = prof || null;
  renderUserChip();
}
function renderUserChip(){
  const box = document.getElementById('userbox');
  if(!MY_PROFILE){ return; }
  const name = MY_PROFILE.display_name || MY_PROFILE.username || 'Player';
  const init = name.slice(0,2).toUpperCase();
  const ava = MY_PROFILE.avatar_url
    ? `<img class="uava" src="${esc(MY_PROFILE.avatar_url)}" alt="" onerror="this.outerHTML='<div class=\\'uava-init\\'>${init}</div>'">`
    : `<div class="uava-init">${init}</div>`;
  box.innerHTML = `<div class="user-chip">
      ${ava}
      <div class="ucol">
        <span class="ubal">${fmtMoney(MY_PROFILE.balance)}</span>
        <span class="uname">${esc(name)}</span>
      </div>
      <button class="logout-x" title="Sign out" onclick="signOut()"><i class="ti ti-logout"></i></button>
    </div>`;
}

// Sort: #1 contenders (ready, by dots) first, then everyone by WINS, win% tiebreak
function sortRanked(list){
  return list.slice().sort((a,b)=>{
    if(a.is_ready_contender!==b.is_ready_contender) return a.is_ready_contender?-1:1;
    if((b.contender_points||0)!==(a.contender_points||0)) return (b.contender_points||0)-(a.contender_points||0);
    if(b.wins!==a.wins) return b.wins-a.wins;
    return (b.win_pct||0)-(a.win_pct||0);
  });
}

async function loadDivision(divName, elId){
  const el=document.getElementById(elId);
  const {data, error} = await sb.from('v_division_rankings').select('*').eq('division',divName);
  if(error){el.innerHTML=`<div class="err">Couldn't load ${divName}: ${error.message}</div>`;return;}
  const champs = data.filter(p=>p.is_champion);
  const rest = sortRanked(data.filter(p=>!p.is_champion));
  rest.forEach((p,i)=>p._slot=i+1);
  let rows = champs.map(p=>rowHTML(p,0,true,divName)).join('');
  rows += rest.map((p,i)=>rowHTML(p,i,false,divName)).join('');
  if(!data.length) rows='<div class="loading" style="padding:30px">No ranked competitors yet</div>';
  el.innerHTML=`<div class="division"><div class="div-head"><h3>${divName} Division</h3><span class="count">${data.length} ranked</span></div>${rows}</div>`;
}

async function loadFactions(){
  const el=document.getElementById('factions-content');
  const {data,error}=await sb.from('v_faction_rankings').select('*');
  if(error){el.innerHTML=`<div class="err">Couldn't load factions: ${error.message}</div>`;return;}
  const {data:champs}=await sb.from('v_current_champions').select('*').eq('division','Faction');
  const champName=(champs&&champs[0])?champs[0].champion:null;
  // pull champion out, sort the rest, then put champion on top
  const champRows=data.filter(p=>champName && p.name===champName);
  const rest=sortRanked(data.filter(p=>!(champName && p.name===champName)));
  const ordered=[...champRows, ...rest];
  let rows='';
  ordered.forEach((p,idx)=>{
    const isChamp = champName && p.name===champName;
    const slot = isChamp ? beltIcon('Faction','rank-belt') : (idx);
    rows+=`<div class="row ${isChamp?'champ':(idx%2?'alt':'')}">
      <div class="rank">${slot}</div>
      ${ringSVG(p.win_pct||0)}
      <div class="nm">${esc(p.name)}${isChamp?'<span class="tag champ">Champion</span>':(p.is_ready_contender?'<span class="tag ready">#1 Contender</span>':'')}
      <div style="font-size:12px;color:var(--muted);font-family:Barlow">${esc(p.members_txt||'')}</div></div>
      ${isChamp?'':dots(p.contender_points||0)}
      <div class="wl"><b>${p.wins}</b>-<s>${p.losses}</s></div>
    </div>`;
  });
  el.innerHTML=`<div class="section-title">Faction Rankings</div><div class="division">${rows||'<div class="loading">No factions</div>'}</div>`;
}

const DIVISIONS=['Mens','Womens','Undisputed'];

async function loadDashboard(){
  // ---- champion cards: always show all divisions, VACANT if none ----
  const {data:champs,error:e1}=await sb.from('v_current_champions').select('*');
  const {data:chat}=await sb.from('v_chat_champion_now').select('*').limit(1);
  const cc=document.getElementById('champ-cards');
  const champMap={};
  (champs||[]).forEach(c=>{champMap[c.division]=c;});
  const cardDivs=[['Mens','Mens'],['Womens','Womens'],['Undisputed','Undisputed'],['Faction','Faction']];
  let cards = cardDivs.map(([key,label])=>{
    const c=champMap[key];
    const vacant=!c;
    const belt=beltFor(key);
    const watermark = belt && belt.image_url
      ? `<img class="belt-bg" src="${esc(belt.image_url)}" alt="">`
      : `<i class="ti ti-trophy belt"></i>`;
    const lblIco = belt && belt.image_url
      ? `<img class="lbl-belt" src="${esc(belt.image_url)}" alt="">`
      : `<i class="ti ti-trophy"></i>`;
    return `<div class="champ-card${vacant?' vacant':''}">
      ${watermark}
      <div class="lbl">${lblIco} ${label}</div>
      <div class="who">${vacant?'VACANT':esc(c.champion)}</div>
      <div class="meta">${vacant?'title up for grabs':'since '+esc(c.show_won||'—')}</div></div>`;
  }).join('');
  const ch=(chat&&chat[0]);
  cards += `<div class="champ-card chat"><i class="ti ti-device-gamepad-2 belt"></i>
    <div class="lbl"><i class="ti ti-device-gamepad-2"></i> Chat Champion</div>
    <div class="who">${ch?esc(ch.username):'—'}</div>
    <div class="meta">${ch?'since '+esc(ch.show_won||''):'none yet'}</div></div>`;
  // all-time most chat championships (show all tied leaders)
  const {data:lb}=await sb.from('v_chat_champion_leaderboard').select('*');
  let topNames='—', topMeta='none yet';
  if(lb&&lb.length){
    const max=lb[0].reigns;
    const leaders=lb.filter(r=>r.reigns===max).map(r=>esc(r.username));
    topNames=leaders.join(', ');
    topMeta=max+(max===1?' reign':' reigns')+' all-time'+(leaders.length>1?' ('+leaders.length+'-way tie)':'');
  }
  cards += `<div class="champ-card chat"><i class="ti ti-crown belt"></i>
    <div class="lbl"><i class="ti ti-crown"></i> Most Chat Titles</div>
    <div class="who" style="font-size:${topNames.length>24?'17px':'24px'}">${topNames}</div>
    <div class="meta">${topMeta}</div></div>`;
  cc.innerHTML=cards;
  if(e1)cc.innerHTML=`<div class="err">${e1.message}</div>`;

  // ---- top 5 per division: #1 contender(s) on top, then next ranked ----
  const ce=document.getElementById('contenders');
  let html='';
  for(const d of DIVISIONS){
    const {data}=await sb.from('v_division_rankings').select('*').eq('division',d);
    if(!data||!data.length) continue;
    const nonChamp=sortRanked(data.filter(p=>!p.is_champion));
    const top5=nonChamp.slice(0,5);
    const readyCount=top5.filter(p=>p.is_ready_contender).length;
    const tie=readyCount>1;
    html+=`<div class="division"><div class="div-head"><h3>${d}</h3>${tie?'<span class="tag tie">'+readyCount+'-way tie — multi-man match</span>':''}</div>`;
    top5.forEach((p,i)=>{
      const ready=p.is_ready_contender;
      html+=`<div class="row ${ready?'champ':(i%2?'alt':'')}">
        <div class="rank">${i+1}</div>
        ${ringSVG(p.win_pct||0)}
        <div class="nm">${esc(p.name)}${ready?'<span class="tag ready">#1 Contender</span>':''}</div>
        ${dots(p.contender_points||0)}
        <div class="wl"><b>${p.wins}</b>-<s>${p.losses}</s></div>
      </div>`;
    });
    html+='</div>';
  }
  ce.innerHTML=html||'<div class="loading" style="padding:30px">No ranked competitors yet</div>';
}

async function loadRoster(){
  const grid=document.getElementById('roster-grid');
  const {data,error}=await sb.from('wrestlers')
    .select('name,gender,is_active,image_url,avatar_url,bio,nickname,height,weight,from_loc,theme_song,theme_url,signatures,finishers,debut_date,last_match')
    .order('name');
  if(error){grid.innerHTML=`<div class="err">${error.message}</div>`;return;}
  window._roster=data;
  renderRoster('');
}
function renderRoster(q){
  const grid=document.getElementById('roster-grid');
  const list=(window._roster||[]).filter(w=>w.name.toLowerCase().includes(q.toLowerCase()));
  if(!list.length){grid.innerHTML='<div class="loading">No matches</div>';return;}
  grid.innerHTML=list.map((w,i)=>{
    const init=w.name.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
    const g=w.gender==='M'?'Mens':w.gender==='F'?'Womens':'Intergender';
    const av = w.avatar_url
      ? `<div class="av av-img"><img src="${esc(w.avatar_url)}" alt="${esc(w.name)}" loading="lazy" onerror="this.parentNode.innerHTML='${init}'"></div>`
      : `<div class="av">${init}</div>`;
    const sub = w.nickname ? `<div class="rmeta nick">"${esc(w.nickname)}"</div>` : '';
    return `<div class="rcard" data-idx="${i}" style="${w.is_active?'':'opacity:.5'}">
      ${av}
      <div class="info"><div class="rn">${esc(w.name)}</div>
      ${sub}
      <div class="rmeta"><span class="gender-pill">${g}</span> ${w.is_active?'':'· inactive'}</div></div>
    </div>`;
  }).join('');
  grid.querySelectorAll('.rcard').forEach(card=>{
    card.onclick=()=>openProfile(list[+card.dataset.idx]);
  });
}

function fieldRow(label, value){
  if(!value) return '';
  return `<div class="pf-row"><span class="pf-lbl">${label}</span><span class="pf-val">${esc(value)}</span></div>`;
}
function fmtDate(d){
  if(!d) return '';
  const dt=new Date(d+'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
}
function openProfile(w){
  if(!w) return;
  const init=w.name.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
  const g=w.gender==='M'?'Mens':w.gender==='F'?'Womens':'Intergender';
  const photo = w.image_url
    ? `<div class="pf-photo"><img src="${esc(w.image_url)}" alt="${esc(w.name)}" onerror="this.parentNode.innerHTML='${init}';this.parentNode.classList.add('pf-photo-init')"></div>`
    : `<div class="pf-photo pf-photo-init">${init}</div>`;
  let theme='';
  if(w.theme_song){
    theme = w.theme_url
      ? `<a href="${esc(w.theme_url)}" target="_blank" rel="noopener noreferrer">${esc(w.theme_song)} <i class="ti ti-external-link" style="font-size:13px"></i></a>`
      : esc(w.theme_song);
  }
  const body = [
    fieldRow('Height', w.height),
    fieldRow('Weight', w.weight),
    fieldRow('From', w.from_loc),
    theme ? `<div class="pf-row"><span class="pf-lbl">Theme</span><span class="pf-val">${theme}</span></div>` : '',
    fieldRow('Signatures', w.signatures),
    fieldRow('Finishers', w.finishers),
    fieldRow('Debut', fmtDate(w.debut_date)),
    fieldRow('Last Match', fmtDate(w.last_match)),
  ].join('');
  const bio = w.bio ? `<div class="pf-bio">${esc(w.bio)}</div>` : '';
  document.getElementById('profile-body').innerHTML = `
    <div class="pf-head">
      ${photo}
      <div class="pf-head-txt">
        ${w.nickname?`<div class="pf-nick">"${esc(w.nickname)}"</div>`:''}
        <h2 class="pf-name">${esc(w.name)}</h2>
        <div class="pf-tags"><span class="gender-pill">${g}</span>${w.is_active?'':'<span class="gender-pill">Inactive</span>'}</div>
      </div>
    </div>
    ${bio}
    <div class="pf-fields">${body||'<div class="pf-empty">No details added yet.</div>'}</div>`;
  document.getElementById('profile-modal').classList.add('open');
}
function closeProfile(){document.getElementById('profile-modal').classList.remove('open');}

// ===== EVENTS / FIGHT CARD =====
function fmtEventDate(ts){
  if(!ts) return '';
  const d=new Date(ts);
  if(isNaN(d)) return '';
  return d.toLocaleString(undefined,{weekday:'short',month:'long',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});
}
// Build a stream iframe from either a full embed URL or a bare Twitch channel name.
function streamEmbed(url){
  if(!url) return '';
  let u=url.trim();
  // YouTube watch link -> embed
  const ytWatch=u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]+)/);
  if(ytWatch) u=`https://www.youtube.com/embed/${ytWatch[1]}`;
  // If it doesn't look like a URL, treat it as a Twitch channel name.
  let src;
  if(/^https?:\/\//i.test(u)){
    src=u;
  }else{
    const parent=location.hostname||'localhost';
    src=`https://player.twitch.tv/?channel=${encodeURIComponent(u)}&parent=${parent}`;
  }
  return `<div class="stream-wrap"><div class="section-title">Watch Live</div>
    <div class="stream-frame"><iframe src="${esc(src)}" allowfullscreen scrolling="no"
      allow="autoplay; fullscreen"></iframe></div></div>`;
}
// A side may have a main name + an extra (partner) name.
function nameLink(n){
  if(!n) return '';
  const known=(window._roster||[]).some(w=>w.name===n);
  return known ? `<span class="name-link" data-wname="${esc(n)}">${esc(n)}</span>` : esc(n);
}
// One side = optional team name + list of members.
function sideCell(side, isMain){
  if(!side) return `<div class="fighter"><div class="fname">TBD</div></div>`;
  const members=(side.members||[]).filter(Boolean);
  let inner='';
  if(side.team_name){
    inner += `<div class="fname">${esc(side.team_name)}</div>`;
    if(members.length) inner += `<div class="fmembers">${members.map(nameLink).join(' &amp; ')}</div>`;
  }else if(members.length){
    inner = members.map(m=>`<div class="fname">${nameLink(m)}</div>`).join('<div class="amp">&amp;</div>');
  }else{
    inner = `<div class="fname">TBD</div>`;
  }
  return `<div class="fighter">${inner}</div>`;
}
function parseSides(m){
  let sides=m.sides;
  if(typeof sides==='string'){ try{ sides=JSON.parse(sides); }catch{ sides=null; } }
  if(Array.isArray(sides) && sides.length) return sides;
  // legacy fallback
  const out=[];
  const a=[m.side_a,m.side_a_extra].filter(Boolean);
  const b=[m.side_b,m.side_b_extra].filter(Boolean);
  if(a.length) out.push({team_name:'',members:a});
  if(b.length) out.push({team_name:'',members:b});
  return out.length?out:[{team_name:'',members:[]},{team_name:'',members:[]}];
}
function boutHTML(m, isMain){
  const sides=parseSides(m);
  const label = m.match_title || (m.match_type && m.match_type!=='Singles' ? m.match_type : (isMain?'Main Event':'Match'));
  // championship badge
  let titleTag='';
  if(m.championship){
    const belt=beltFor(m.championship);
    const img = belt && belt.image_url
      ? `<img class="title-belt" src="${esc(belt.image_url)}" alt="${esc(m.championship)} title">`
      : `<i class="ti ti-trophy" style="color:var(--gold)"></i>`;
    titleTag=`<div class="title-on-line">${img}<span>${esc(m.championship)} Championship</span></div>`;
  }
  const stip = m.stipulation ? `<div class="stip">${esc(m.stipulation)}</div>` : '';
  const notes = m.notes ? `<div class="bnotes">${esc(m.notes)}</div>` : '';
  // join sides with VS
  let vsRow='';
  sides.forEach((s,idx)=>{
    if(idx>0) vsRow+=`<div class="vs">VS</div>`;
    vsRow+=sideCell(s, isMain);
  });
  return `<div class="bout ${isMain?'main':''} sides-${sides.length}">
    <div class="bout-label">${esc(label)}</div>
    ${titleTag}
    <div class="vs-row">${vsRow}</div>
    ${stip}${notes}
  </div>`;
}
async function loadEvents(){
  const el=document.getElementById('events-content');
  const {data:evs,error}=await sb.from('v_featured_event').select('*');
  if(error){el.innerHTML=`<div class="err">Couldn't load events: ${esc(error.message)}</div>`;return;}
  const ev=(evs&&evs[0]);
  if(!ev){el.innerHTML='<div class="event-empty">No upcoming event announced yet — check back soon.</div>';return;}

  const {data:matches}=await sb.from('event_matches').select('*')
    .eq('event_id',ev.id).order('slot');
  const list=(matches||[]).sort((a,b)=>(a.slot||0)-(b.slot||0));

  const meta=[];
  if(ev.event_date) meta.push(`<div class="mi"><i class="ti ti-calendar-event"></i>${esc(fmtEventDate(ev.event_date))}</div>`);
  if(ev.watch_text) meta.push(`<div class="mi"><i class="ti ti-device-tv"></i>${esc(ev.watch_text)}</div>`);
  if(ev.location)   meta.push(`<div class="mi"><i class="ti ti-map-pin"></i>${esc(ev.location)}</div>`);

  const hero=`<div class="event-hero">
    ${ev.poster_url?`<div class="hero-bg" style="background-image:url('${esc(ev.poster_url)}')"></div>`:''}
    <div class="hero-in">
      <div class="ev-name">${esc(ev.name)}</div>
      ${ev.tagline?`<div class="ev-tag">${esc(ev.tagline)}</div>`:''}
      ${meta.length?`<div class="event-meta">${meta.join('')}</div>`:''}
    </div>
  </div>`;

  let cardHTML='';
  if(list.length){
    cardHTML='<div class="section-title">Fight Card</div><div class="card-list">'+
      list.map((m,i)=>boutHTML(m, m.slot===1 || (i===0 && !list.some(x=>x.slot===1)))).join('')+
      '</div>';
  }else{
    cardHTML='<div class="event-empty" style="padding:30px">Card to be announced.</div>';
  }

  el.innerHTML = hero + cardHTML + streamEmbed(ev.stream_url);

  // make known wrestler names open the profile modal
  el.querySelectorAll('.name-link').forEach(n=>{
    n.onclick=()=>{
      const w=(window._roster||[]).find(x=>x.name===n.dataset.wname);
      if(w) openProfile(w);
    };
  });
}

// navigation
document.querySelectorAll('nav button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    const pg=b.dataset.page;
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById('page-'+pg).classList.add('active');
  };
});
document.getElementById('roster-search').addEventListener('input',e=>renderRoster(e.target.value));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeProfile();});

// boot
if(!isConfigured){
  document.getElementById('config-error').innerHTML=
    `<div class="err"><b>Almost there — add your Supabase keys.</b><br>
    Open this file in a text editor and find the line near the top that says
    <code>PASTE_YOUR_PROJECT_URL_HERE</code>. Replace it and the key below it with the
    values from your Supabase project (Settings → API). Then reload. Until then you're
    seeing the layout with no data.</div>`;
}else{
  const lb=document.getElementById('loginBtn'); if(lb) lb.onclick=signInDiscord;
  refreshUser();
  loadBelts().then(()=>{
    loadDashboard();
    loadEvents();
    loadDivision('Mens','mens-content');
    loadDivision('Womens','womens-content');
    loadDivision('Undisputed','undisputed-content');
    loadFactions();
  });
  loadRoster();
}
