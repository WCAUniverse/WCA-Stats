<script>
/* ===== start: who is signed in, then open the editor ===== */
(async function(){
  var host = document.getElementById('mp-body');
  try{
    var r = await sb.auth.getSession();
    var session = r && r.data && r.data.session;
    if(session && session.user){
      CURRENT_USER = session.user;
      try{ var p = await sb.from('profiles').select('*').eq('id', CURRENT_USER.id).maybeSingle(); MY_PROFILE = p.data || null; }catch(e){}
      try{ var a = await sb.rpc('is_admin'); IS_ADMIN = a.data === true; }catch(e){ IS_ADMIN = false; }
      var name = (MY_PROFILE && (MY_PROFILE.display_name || MY_PROFILE.username)) || 'Member';
      var av = MY_PROFILE && (MY_PROFILE.custom_avatar || MY_PROFILE.avatar_url);
      document.getElementById('pe-user').innerHTML = (av ? '<img src="' + escAttr(av) + '" alt="" referrerpolicy="no-referrer">' : '<span class="pe-av">' + esc(name.slice(0, 1).toUpperCase()) + '</span>') + '<span>' + esc(name) + '</span>';
      await mpOpen();
    } else {
      host.innerHTML = '<div class="pm-card pe-signin"><h1>Promotion Editor</h1><p>Sign in on WCAUniverse.com first, then come back here to edit your promotion.</p>'
        + '<a class="spc-post-btn" href="' + wcaHref('dash') + '" style="display:inline-block;text-decoration:none">Sign in on the site</a></div>';
    }
  }catch(e){
    host.innerHTML = '<div class="pm-card pm-empty">The editor could not load: ' + esc(String(e && e.message || e)) + '. Reload the page to try again.</div>';
  }
  sb.auth.onAuthStateChange(function(ev){ if(ev === 'SIGNED_OUT') location.reload(); });
})();
</script>
