    app.innerHTML = `<div class="msbar"><span class="f">${esc(n)}</span><span class="sp"></span><button class="cta ghost" id="msDef">Use the default moves</button><button class="cta big-go" id="msGo">${S.custom ? 'Done ✓' : S.quick ? 'Next: your opponent ▶' : 'Fight! ▶'}</button></div>

      return `<section class="panel ms-pos"><div class="ms-h"><b class="f">${esc(POS[p])}</b><span class="muted">${count} / ${max}</span></div>
        <div class="ms-list">${moves.map(m => { const on = fixed(m) || chosen.has(m.id);
          return `<button class="mvpick${on?' on':''}${fixed(m)?' fixed':''}${isOwn(m, n)?' own':''}" data-m="${esc(m.id)}" ${fixed(m)?'disabled':''}>${isOwn(m, n) ? '<span class="owntag">Their own</span>' : ''}<b>${esc(m.name)}</b><small>${esc(KINDS[m.kind]||m.kind)}${m.dmg?' · '+m.dmg+' dmg':''}${m.kind==='highrisk'?' · misses hurt '+m.crash:''}</small>${(t => t ? `<span class="mtag t-${t.c}">${esc(t.t)}</span>` : '')(moveTag(m))}${revMark(m)}</button>`; }).join('')}</div></section>`; }).join('')}</div>

    app.querySelectorAll('.mvpick:not(.fixed)').forEach(b => b.onclick = () => {
      const m = moveOf(b.dataset.m), here = CFG.moves.filter(x => x.from === m.from && canUse(x, n) && !fixed(x) && chosen.has(x.id)).length;
      if(chosen.has(m.id)){ if(here <= 1) return; chosen.delete(m.id); } else { if(here >= max) return; chosen.add(m.id); }
      saveLoadout(n, [...chosen]); draw();

}

let MT = null;

  const foe = S.quick ? S.foe : S.inSecret ? S.secret : S.tower[S.floor], level = LEVEL(), lv = AI_LEVEL[level] || AI_LEVEL.normal;
  const me = makeFighter(S.me, { brain:humanBrain(), loadout:loadoutOf(S.me) });
  const op = makeFighter(foe, { brain:slowAI(aiBrain(level)), level, hpScale:lv.hp * (S.inSecret ? 1 + (+CFG.settings.secretHp || 0) / 100 : 1), dmgScale:lv.dmg, loadout:defaultLoadout(foe) });
  me.side = 'L'; op.side = 'R';
  // in a tower, health and reversals carry over from the last floor
  if(!S.quick && S.carry){ me.hp = Math.max(1, Math.min(me.max, S.carry.hp)); me.revs = S.carry.revs; }
  S.screen = 'battle'; fitMode(); window.scrollTo(0, 0); battleScreen();

function posLine(m){ if(!m.ctrl) return 'Both standing'; const op = m.other(m.ctrl);
  return { standing:`${op.name} is standing in front of them`, ropes:`${op.name} is bouncing off the ropes`, corner:`${op.name} is in the corner`, behind:`${m.ctrl.name} is behind ${op.name}`, ground:`${op.name} is down on the mat`, top:`${m.ctrl.name} is on the top rope` }[m.pos] || ''; }
function setStage(t, sub){ const a = document.getElementById('stage'), b = document.getElementById('stageSub'); if(a) a.textContent = t; if(b) b.textContent = sub || ''; }

/* the play by play: the big line on top, everything in the log */
/* the play-by-play colors: names first, then damage in red and good news in green */
const reEsc = x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function logColor(t){ let h = esc(t);
  if(MT){ const mineR = MT.meSide === 'R', names = [[MT.a.name, mineR ? 'lg-op' : 'lg-me'], [MT.b.name, mineR ? 'lg-me' : 'lg-op']].filter(x => x[0]).sort((x, y) => y[0].length - x[0].length);
    const re = new RegExp('(' + names.map(x => reEsc(esc(x[0]))).join('|') + ')', 'g'), cls = {}; names.forEach(x => cls[esc(x[0])] = x[1]);
    h = h.replace(re, m => `<b class="${cls[m]}">${m}</b>`); }
  h = h.replace(/(\d+) damage/g, '<span class="lg-dmg">$1 damage</span>')
    .replace(/(\+\d+ health)/g, '<span class="lg-good">$1</span>')
    .replace(/(KICK OUT!|kicks out[^.!<]*|fights out of[^.!<]*|breaks out of the combo|fights back to their feet|gets a reversal back[^.!<]*|gets to the ropes|rolls out of the way|REVERSAL!)/g, '<span class="lg-good">$1</span>')
    .replace(/(TAPS OUT!|ONE\.\.\. TWO\.\.\. THREE!|crashes and burns!)/g, '<span class="lg-bad">$1</span>');
  return h; }
function say(t, kind){
  const log = document.getElementById('log'); if(!log) return;
  // Nov 14: newest line on top, and colors: your wrestler, the opponent, damage (red), good news (green)
  const d = document.createElement('div'); d.className = 'l-' + (kind || 'info'); d.innerHTML = logColor(t); log.prepend(d); log.scrollTop = 0;
  if(['call','big','bighit','hit','move','ability'].includes(kind)){
    const c = document.getElementById('call');
    if(kind === 'ability') c.insertAdjacentHTML('beforeend', `<span class="ab-pop">⚡ ${esc(t.split(':')[0].replace('⚡','').trim())}</span>`);
    else c.innerHTML = `<div class="big f${kind==='big'||kind==='bighit'?' huge':''}">${esc(t)}</div>`;
  }

}

/* simple picture animations: lunges, hits with a red tint, shakes and flashes */
let fxT = 0;
function fx(kind, who, data){
  const now = performance.now(); if(now > fxT) fxT = now; const delay = fxT - now; fxT += kind === 'lunge' ? 140 : kind === 'hit' || kind === 'crash' ? 260 : 0;
  setTimeout(() => runFx(kind, who, data), delay);
}
function runFx(kind, who, data){
  drawBars(); try{ soundFx(kind, who, data); }catch(e){}
  const el = who ? document.getElementById('p' + who.side) : null;
  const again = (n, c) => { if(!n) return; n.classList.remove(c); void n.offsetWidth; n.classList.add(c); };
  const arena = document.getElementById('arena');
  if(kind === 'lunge' && el){ again(el, who.side === 'L' ? 'lungeL' : 'lungeR'); if(data && data.big) again(arena, 'flashbig'); }
  if((kind === 'hit' || kind === 'crash') && el){
    again(el, data && data.big ? 'hitbig' : 'hit');
    const n = document.createElement('div'); n.className = 'dmg' + (kind === 'crash' ? ' crash' : ''); n.textContent = '-' + data.dmg; el.parentElement.appendChild(n); setTimeout(() => n.remove(), 1000);
    if(data && data.big) again(arena, 'quake');
  }
  if(kind === 'heal' && el){ again(el, 'healfx'); const n = document.createElement('div'); n.className = 'dmg heal'; n.textContent = '+' + data; el.parentElement.appendChild(n); setTimeout(() => n.remove(), 1000); }
  if(kind === 'block' && el){ again(el, 'blockfx'); const n = document.createElement('div'); n.className = 'dmg block'; n.textContent = 'BLOCKED'; el.parentElement.appendChild(n); setTimeout(() => n.remove(), 1000); }
  if(kind === 'windup' && el){ again(el, 'windup'); }
  if(kind === 'tieup'){ ['L','R'].forEach(s => again(document.getElementById('p' + s), s === 'L' ? 'pushL' : 'pushR')); setStage('Tie-up', 'Chain wrestling for the advantage'); }
  if(kind === 'circle'){ ['L','R'].forEach(s => again(document.getElementById('p' + s), 'sway')); }
  if(kind === 'control' && who){ setStage(`${who.name} in control`, posLine(MT)); }
  if(kind === 'recover' || (kind === 'state' && data && data.stage === 'neutral' && MT && !MT.ctrl)){ setStage('Circling', 'Both standing'); }
  if(kind === 'pin' && el){ setStage('The cover!', ''); }
  if(kind === 'count'){ showCount(data.n); }
  if(kind === 'sub' && el){ setStage('Submission!', data && data.name); }
  if(kind === 'ability' && el){ again(el, 'abilityfx'); }
}
function uiHooks(){ return { say, fx, wait:ms => sleep(ms), voiceIdle:() => SND.waitIdle(2500) }; }   // voiceIdle: the computer's count keeps in step with the narrator

/* ---------- sound: what the crowd and the narrator do for each moment ---------- */
const SOUNDS_ON = {
  start(){ SND.check().then(() => { SND.fx('sfx-bell'); SND.crowdStart(); SND.vo('vo-start', 2); }); this.ctrl = null; this.ready = false; this.trouble = false; },
  stop(){ SND.crowdStop(); }
};
function soundFx(kind, who, data){
  if(!MT) return;
  const meSide = MT.meSide || 'L', mine = !!(who && who.side === meSide);   // online: you can be on either side
  if(kind === 'control' && who && SOUNDS_ON.ctrl !== who){ SOUNDS_ON.ctrl = who; SND.vo(mine ? 'vo-you-control' : 'vo-opp-control', 1, 6000); }
  if(kind === 'recover' || (kind === 'state' && data && data.stage === 'neutral' && !MT.ctrl)) SOUNDS_ON.ctrl = null;
  if(kind === 'slugfest'){ SND.vo('vo-slugfest', 2); SND.swell('crowd-cheer'); }
  if(kind === 'tieup') SND.vo('vo-tieup', 1, 8000);
  if(kind === 'windup' && data && data.kind === 'sig') SND.vo('vo-signature', 3);
  if(kind === 'windup' && data && data.kind === 'fin'){ SND.vo('vo-finisher', 3); SND.swell('crowd-pop'); }
  if(kind === 'hit' && data){ const big = data.big || data.dmg >= 13;
    // a knockdown has its own sound (the hit, the impact, the body on the mat); without the file it's the slam as before
    SND.fx(data.down && SND.has('sfx-knockdown') ? 'sfx-knockdown' : big || data.dmg >= 9 ? 'sfx-slam' : 'sfx-hit');
    if(big){ SND.vo('vo-big', 1, 4000); SND.swell(mine ? 'crowd-boo' : 'crowd-cheer'); } }
  if(kind === 'crash'){ SND.fx('sfx-slam'); SND.swell('crowd-gasp'); }
  if(kind === 'reversal'){ SND.fx('sfx-whoosh'); SND.vo('vo-reversal', 2); if(mine) SND.swell('crowd-cheer'); }
  if(kind === 'dodge'){ SND.fx('sfx-whoosh'); SND.vo('vo-dodge', 2); }
  if(kind === 'sub'){ SND.vo('vo-sub', 2); }
  if(kind === 'escape') SND.vo('vo-escape', 2);
  if(kind === 'ropebreak') SND.vo('vo-ropes', 2);
  if(kind === 'pin'){ SND.vo('vo-cover', 2); }
  if(kind === 'kickout'){ const n = data ? +data.n || 0 : 1;   // the kick out line matches the count: none, one, two, or two at the last second
    SND.vo(n <= 0 ? 'vo-kickout-0' : n === 1 ? 'vo-kickout-1' : data.close ? 'vo-kickout-3' : 'vo-kickout-2', 3); SND.swell(data && data.n >= 2 ? 'crowd-pop' : 'crowd-gasp'); }
  if(kind === 'end' && data){ if(data.how === 'submission') SND.vo('vo-tap', 4); SND.fx('sfx-bell'); setTimeout(() => SND.swell(mine ? 'crowd-pop' : 'crowd-boo'), 300); }
  // your own warnings
  if(MT.spectate) return;   // spectators get no personal warnings
  const me = meSide === 'R' ? MT.b : MT.a;
  if(!SOUNDS_ON.ready && me.mom >= CFG.settings.mom.finCost){ SOUNDS_ON.ready = true; SND.vo('vo-ready', 1); }
  if(SOUNDS_ON.ready && me.mom < CFG.settings.mom.finCost) SOUNDS_ON.ready = false;

function humanBrain(){
  return {
    neutral(m, f){ setStage('Circling', 'Both standing. Pick your move.');

      const lim = +CFG.settings.neutral.samePick || 0, last = f.hist.slice(-lim), tired = lim && last.length === lim && last.every(x => x === last[0]) ? last[0] : null;
      const b = (k, cls, label, sub, key) => tired === k ? `<button class="mv ${cls} tired" disabled>${label}<small>picked ${lim} times in a row · try something else</small></button>` : `<button class="mv ${cls}" data-v='"${k}"'>${label}<small>${sub} · key ${key}</small></button>`;

      return choose(`<div class="moves">${b('strike','s','Strike','beats Grapple',1)}${b('grapple','g','Grapple','beats Block',2)}${b('block','b','Block','stops a Strike',3)}</div>
        <div class="legend">Both Strike: slugfest, you both get hit. Both Grapple: tie-up and chain wrestling. Both Block: you circle.${lim ? ` You can't pick the same one more than ${lim} times in a row.` : ''}</div>`, keys); },
    chain(m, f, r){ setStage('Tie-up', `Chain wrestling, round ${r}`);
      return choose(`<div class="moves">
        <button class="mv s" data-v='"power"'>Power<small>shove into the corner · beats Speed</small></button>
        <button class="mv g" data-v='"technique"'>Technique<small>wristlock · beats Power</small></button>
        <button class="mv b" data-v='"speed"'>Speed<small>go behind · beats Technique</small></button></div>`, { '1':'power', '2':'technique', '3':'speed' }); },
    control(m, f, opts){
      setStage('You are in control', posLine(m));
      const btn = (o, i) => {
        if(o.type === 'backoff') return `<button class="mvo back" data-v='${JSON.stringify(i)}'><b>Back off</b><small>go back to circling</small></button>`;
        if(o.type === 'sig') return `<button class="mvo sig ready" data-v='${JSON.stringify(i)}'><b>${esc(f.su.sigName)}</b><small>Signature · ${f.su.sigDmg} dmg</small>${revMark({ rev:2 })}</button>`;
        if(o.type === 'fin') return `<button class="mvo fin ready" data-v='${JSON.stringify(i)}'><b>${esc(f.su.finName)}</b><small>Finisher · ${f.su.finDmg} dmg</small>${revMark({ rev:3 })}</button>`;
        const mv = o.move;
        return `<button class="mvo k-${mv.kind}${isOwn(mv, f.name) ? ' own' : ''}" data-v='${JSON.stringify(i)}'>${isOwn(mv, f.name) ? '<span class="owntag">Their own</span>' : ''}<b>${esc(mv.name)}</b><small>${esc(KINDS[mv.kind]||mv.kind)}${mv.dmg?' · '+mv.dmg+' dmg':''}${mv.kind==='highrisk'?' · risky':''}</small>${(t => t ? `<span class="mtag t-${t.c}">${esc(t.t)}</span>` : '')(moveTag(mv))}${revMark(mv)}</button>`;
      };
      const s = CFG.settings, need = [];
      if(f.mom < s.mom.sigCost) need.push(`Signature at ${s.mom.sigCost} momentum (${POS[f.su.sigFrom].toLowerCase()})`);
      else if(f.su.sigFrom !== m.pos) need.push(`Signature is ready: get them ${POS[f.su.sigFrom].toLowerCase()}`);
      if(f.mom >= s.mom.finCost && f.su.finFrom !== m.pos) need.push(`Finisher is ready: get them ${POS[f.su.finFrom].toLowerCase()}`);

      // strikes first, then grapples, high risk, holds, pins, then moving them around; Signature/Finisher up front, Back off last
      const rank = o => o.type === 'fin' ? -2 : o.type === 'sig' ? -1 : o.type === 'backoff' ? 99 : MOVE_KIND_ORDER.indexOf(o.move.kind) < 0 ? 50 : MOVE_KIND_ORDER.indexOf(o.move.kind);
      opts = opts.map((o, i) => [o, i]).sort((x, y) => rank(x[0]) - rank(y[0]) || x[1] - y[1]).map(x => x[0]);
      return choose(`${meter}<div class="mvgrid">${opts.map(btn).join('')}</div>${need.length ? `<div class="legend">${need.map(esc).join(' · ')}</div>` : ''}${symbolKey()}`).then(i => opts[i]);
    },
    async reversal(m, f, move, len, kind){
      const big = kind !== 'move' || move.kind === 'highrisk' || move.rev >= 2;
      if(!big && !S.askAll) return null;
      const verb = move.kind === 'highrisk' ? 'Dodge' : 'Reverse';
      const go = await choose(`<div class="incoming"><div class="f big">${esc(m.other(f).name)} goes for the ${esc(move.name)}!</div>

      if(!go) return null;

    kickout(m, f, zone){ return needleGame(zone); },
    escape(m, f, move, len){ return seqGame(`Fight out of the ${move.name}!`, len, LEVEL()); }
  };
}

/* ---------- after the match ---------- */
async function finish(won, how){
  if(!MT || MT.ui.say === undefined) return;
  let paid = 0, note = '', secretNow = false; const wasSecret = !!S.inSecret, sc = !S.quick ? TW().secret : null;
  if(LIVE && !S.quick){
    // real money: the database decides and pays, inside the daily limit
    if(!SIGNED()) note = 'Sign in on WCAUniverse.com to earn money for every floor.';
    else if(!S.run) note = S.runErr ? 'No money this climb: ' + S.runErr : 'No money this climb.';
    else if(won){ try{ const r = await sbc().rpc('tower_win', { p_run:S.run }); if(r.error) throw r.error; const d = r.data || {};
        paid = +d.paid || 0; secretNow = !!d.secret; TODAY = Object.assign(TODAY || {}, { earned:d.earned, cap:d.cap, balance:d.balance, signed_in:true });
        if(d.why === 'too_fast') note = 'That match was too quick to pay. Matches have to last a little longer to earn money.';
        else if(d.why === 'cap') note = paid ? `You hit today's $${Number(d.cap).toLocaleString()} limit, so you got $${paid}.` : `You've reached today's $${Number(d.cap).toLocaleString()} limit. Keep playing for fun!`;
        if(d.balance != null) note = (note ? note + ' ' : '') + `Your WCA balance: $${Number(d.balance).toLocaleString()}.`;
      }catch(e){ note = 'Could not pay this floor: ' + (e.message || e); } }
    else { try{ await sbc().rpc('tower_lose', { p_run:S.run }); }catch(e){} }
    if(won && !wasSecret) S.floor++;
    drawWallet();
  }
  else if(won && !S.quick){ const boss = S.floor === S.tower.length - 1, amount = wasSecret ? Math.round(TW().reward * sc.mult) : TW().reward * (boss ? 3 : 1);
    paid = pay(amount); if(paid < amount) note = paid ? `You hit today's $${CFG.settings.dailyCap.toLocaleString()} limit, so you got $${paid}.` : `You've reached today's $${CFG.settings.dailyCap.toLocaleString()} limit. Keep playing for fun!`; if(!wasSecret) S.floor++;
    // the secret boss: a chance after beating the whole tower (on the website the database rolls it)
    if(!wasSecret && S.floor >= S.tower.length && Math.random() * 100 < sc.chance) secretNow = true; }
  S.last = { won, how, paid, note, foe:MT.b.name, topped:won && !S.quick && !wasSecret && S.floor >= S.tower.length, secretFight:wasSecret };
  S.inSecret = false;
  // what you take into the next floor: the health you had left plus some back, and your reversals plus some back
  if(won && !S.quick && MT.a && (!S.last.topped || secretNow) && !wasSecret){ const c = TW().carry, me = MT.a, rv = CFG.settings.reversal;
    const back = Math.round(me.max * c.heal / 100), hp = Math.min(me.max, Math.max(1, me.hp) + back), revs = Math.min(+rv.maxHold || +rv.slots || 3, me.revs + c.revs);
    S.carry = { hp, revs, max:me.max, gotHp:hp - Math.max(1, me.hp), gotRevs:revs - me.revs }; S.last.carry = S.carry; }
  if(secretNow){ S.secret = secretFoe(S.tk, S.me, S.tower); S.last.secret = !!S.secret; }
  setTimeout(() => { SOUNDS_ON.stop(); SND.vo(S.last.topped || (wasSecret && won) ? 'vo-tower' : won ? 'vo-win' : 'vo-lose', 6); go('result'); }, 1500);
}

function t2Tower(t){ const fl = floorsOf(t);
  return `<button class="t2-twr" data-t="${esc(t.key)}" style="--c:${esc(t.color)}" aria-label="${esc(t.name)} tower"><span class="t2-col">${fl.map((n, i) => { const boss = i === fl.length - 1;

function t2Turn(dir){ const defs = towerDefs(), i = defs.findIndex(t => t.key === towerSel); towerSel = defs[((i < 0 ? 0 : i) + dir + defs.length) % defs.length].key; t2Spin(); }
function t2Go(){ S.custom = false; S.tk = towerSel; S.quick = false; S.me = null; S.pickFoe = false; go('pick'); }
// put each tower in its spot: the picked one in front, its neighbours turned to the sides, the rest hidden behind

// size the blocks so the tallest tower fits the screen
function t2Fit(){ const ring = document.getElementById('t2Ring'); if(!ring) return;
  const maxB = Math.max(...towerDefs().map(t => floorsOf(t).length), 1), h = ring.clientHeight, w = ring.clientWidth;
  const bh = Math.max(26, Math.min(150, Math.floor((h - 104) / maxB) - 6));   // as big as the screen allows (Nov 14: bigger pictures)

/* ---------- the climb: the camera on the tower between fights ---------- */
let CL = null;
const clMystery = i => i > 0;   // every floor but floor 1 is a mystery until you reach it (Nov 14)
const clHidden = i => !S.quick && clMystery(i) && !(S.revealed || {})[i];   // still a mystery: not reached yet (result screen never spoils it)
function climb(){
  const t = TW(), n = S.tower.length, f = Math.min(S.floor, n - 1), me = W(S.me);
  S.revealed = S.revealed || {};
  const hidden = i => clMystery(i) && !S.revealed[i] && i >= f;   // the current one flips over when the camera gets there
  const rows = S.tower.map((nm, i) => ({ nm, i })).reverse().map(({ nm, i }) => { const boss = i === n - 1, beat = i < f, hid = hidden(i);
    return `<div class="cl-row${i === f ? ' cur' : ''}" data-i="${i}">
      <div class="cl-you">${i === f ? `<span class="cl-me">${face(me)}<b class="f">${esc(S.me)}</b></span><span class="cl-vs f">VS</span>` : ''}</div>
      <div class="cl-blk${boss ? ' boss' : ''}${beat ? ' done' : ''}${hid ? ' hid' : ''}"><i class="f">${boss ? 'BOSS' : 'F' + (i + 1)}</i>
        <span class="cl-nm"><b class="f">${hid ? '???' : esc(nm)}</b><small>${beat ? 'Beaten' : hid ? 'A mystery until you get here' : esc(styleOf(setupOf(nm).style).name)}</small></span>
        <span class="cl-fc">${hid ? sil(true) : face(W(nm))}${beat ? '<span class="cl-chk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>' : ''}</span></div>
      <div class="cl-sp"></div></div>`; }).join('');
  const boss = f === n - 1, payNow = t.reward * (boss ? 3 : 1), c = S.carry;
  app.innerHTML = `<div class="cl" style="--c:${esc(t.color)}">
    <div class="cl-view" id="clView"><div class="cl-cam" id="clCam">${rows}</div></div>
    <aside class="cl-info"><div class="t2-bar"></div><div class="kick" style="color:${esc(t.color)}">${esc(t.name)} tower · ${boss ? 'the boss' : 'floor ' + (f + 1) + ' of ' + n}</div>
      <div class="f t2-tn" id="clFoe">${hidden(f) ? '???' : esc(S.tower[f])}</div>
      <p class="t2-desc">${f === 0 ? 'Your climb starts here. ' : ''}${boss ? 'Beat the boss to conquer the tower.' : 'Win and the camera climbs to the next floor.'}</p>
      <div class="t2-stats"><div><small>This floor pays</small><b class="f">$${payNow.toLocaleString()}</b></div>
        <div><small>Your health</small><b class="f">${c ? c.hp + ' / ' + c.max : 'Full'}</b></div></div>
      ${c ? `<p class="t2-desc">Reversals: <b style="color:var(--gold)">${'◆'.repeat(c.revs) || '0'}</b></p>` : ''}
      <span class="t2-sp"></span>
      <button class="cta big-go t2-go" id="clGo" disabled>Fight ▶</button><button class="cta ghost t2-go" onclick="go('title')">Main menu</button></aside>
    <div class="cl-vsx" id="clVs" hidden></div></div>`;
  CL = { f, n, ready:false, from:S.climbFrom };
  document.getElementById('clGo').onclick = clFight;
  clFit(true);
  // the camera: start where we were (or the whole tower), then glide to this floor
  const cam = document.getElementById('clCam');
  requestAnimationFrame(() => requestAnimationFrame(() => { cam.classList.add('pan'); setTimeout(() => { if(!CL || S.screen !== 'climb') return; clCam(CL.f); }, CL.from == null ? 650 : 350); }));
  setTimeout(clArrive, (CL.from == null ? 650 : 350) + 1500);
}
// where the camera points: a floor (zoomed in) or null (the whole tower)
function clTarget(i){ const v = document.getElementById('clView'), cam = document.getElementById('clCam'); if(!v || !cam) return null;
  const vh = v.clientHeight, rh = parseFloat(getComputedStyle(cam).getPropertyValue('--rh')) || 120, total = CL.n * rh;
  const fitW = (v.clientWidth - 12) / Math.max(1, cam.offsetWidth);   // never wider than the screen (phones)
  if(i == null){ const s = Math.min(1, (vh - 30) / total, fitW); return { s, ty:(vh - total * s) / 2 }; }
  const s = Math.min(1.08, fitW), yc = (CL.n - 1 - i) * rh + rh / 2; return { s, ty:vh / 2 - yc * s }; }
function clCam(i){ const cam = document.getElementById('clCam'), p = clTarget(i); if(!cam || !p) return; CL.at = i;
  cam.style.transform = `translateX(-50%) translateY(${p.ty.toFixed(1)}px) scale(${p.s.toFixed(3)})`; }
function clFit(first){ const v = document.getElementById('clView'), cam = document.getElementById('clCam'); if(!v || !cam || !CL) return;
  const rh = Math.round(Math.max(84, Math.min(140, v.clientHeight / 4.6))); cam.style.setProperty('--rh', rh + 'px');
  if(first){ cam.classList.remove('pan'); clCam(CL.from == null ? null : Math.max(0, CL.from)); } else { const was = cam.classList.contains('pan'); cam.classList.remove('pan'); clCam(CL.at); if(was) requestAnimationFrame(() => cam.classList.add('pan')); } }
// the camera got there: your wrestler steps up, a mystery floor flips over, Fight lights up
function clArrive(){ if(!CL || S.screen !== 'climb') return; const f = CL.f, row = app.querySelector(`.cl-row[data-i="${f}"]`); if(!row) return;
  row.classList.add('here'); const blk = row.querySelector('.cl-blk');
  if(blk && blk.classList.contains('hid')){ blk.classList.add('flip'); setTimeout(() => { const nm = S.tower[f];
      blk.classList.remove('hid'); blk.querySelector('.cl-nm').innerHTML = `<b class="f">${esc(nm)}</b><small>${esc(styleOf(setupOf(nm).style).name)}</small>`;
      blk.querySelector('.cl-fc').innerHTML = face(W(nm)); const fo = document.getElementById('clFoe'); if(fo) fo.textContent = nm; }, 260); }
  S.revealed[f] = true; CL.ready = true; const b = document.getElementById('clGo'); if(b){ b.disabled = false; b.focus({ preventScroll:true }); } }
// the VS screen, then the match
function clFight(){ if(!CL || !CL.ready || CL.going) return; CL.going = true; const nm = S.tower[CL.f], ov = document.getElementById('clVs');
  ov.innerHTML = `<div class="cl-vsrow"><div class="cl-side l"><span class="vpic">${face(W(S.me))}</span><b class="f">${esc(S.me)}</b></div>
    <span class="cl-vsbig f">VS</span><div class="cl-side r"><span class="vpic">${face(W(nm))}</span><b class="f">${esc(nm)}</b></div></div><p class="t2-hint">Click to skip</p>`;
  ov.hidden = false; let gone = false; const start = () => { if(gone) return; gone = true; if(S.screen === 'climb') startBattle(); };
  ov.onclick = start; setTimeout(start, 2600); }

/* =====================================================================
   ONLINE PLAY (Nov 15): lobbies, One on One and Gauntlet (winner stays on),
   spectators, a Players chat and a Spectators chat. Just for fun (no money).
   How it talks: Supabase live messages on the website (no database tables),
   or the browser's own tab-to-tab channel when opened off the site (two tabs can play).
   The left fighter's browser runs the match; the other fighter gets each choice and
   mini game sent to them; everyone else watches. The lobby "leader" (whoever has been
   in the lobby longest) runs the line.
   ===================================================================== */
const PV = { me:null, ch:null, idx:null, idxCh:null, lobs:{}, members:{}, st:null, joined:0, hb:null, chat:{ p:[], s:[] }, tab:'p', unread:{ p:0, s:0 }, run:null, view:null, pk:{ q:'', page:0, sel:null, locked:false }, asks:{} };
const PVC = () => Object.assign({ turnSecs:45, nextSecs:6, gauntletMax:12 }, CFG.settings.pvp || {});
const rid = () => Math.random().toString(36).slice(2, 9);
async function pvIdentity(){ if(PV.me) return PV.me;
  if(LIVE && SIGNED()){ try{ const c = sbc(), u = (await c.auth.getUser()).data.user;
      if(u){ let nm = ''; try{ const p = await c.from('profiles').select('username,display_name').eq('id', u.id).maybeSingle(); nm = p.data && (p.data.display_name || p.data.username); }catch(e){}
        return PV.me = { id:u.id, name:String(nm || 'Player').slice(0, 24), guest:false }; } }catch(e){} }
  let g = null; try{ g = JSON.parse(sessionStorage.getItem('wcaPvpGuest') || 'null'); }catch(e){}
  if(!g){ g = { id:'g' + rid(), name:'Guest ' + (1000 + Math.floor(Math.random() * 9000)) }; try{ sessionStorage.setItem('wcaPvpGuest', JSON.stringify(g)); }catch(e){} }
  return PV.me = { id:g.id, name:g.name, guest:true }; }
const pvCanPlay = () => !(LIVE && PV.me && PV.me.guest);   // on the website you sign in to play and chat; anyone can watch
// one live channel: Supabase broadcast on the site, the browser's tab channel otherwise
function pvChannel(name, onMsg){
  const c = (typeof sbc === 'function') ? sbc() : null;
  if(c && c.channel && ONLINE){ let ready = false; const q = [];
    const ch = c.channel('tower-pvp-' + name, { config:{ broadcast:{ self:false } } });
    ch.on('broadcast', { event:'m' }, ({ payload }) => { try{ onMsg(payload); }catch(e){} });
    ch.subscribe(st => { if(st === 'SUBSCRIBED'){ ready = true; q.splice(0).forEach(p => ch.send({ type:'broadcast', event:'m', payload:p })); } });
    return { send:p => { if(ready) ch.send({ type:'broadcast', event:'m', payload:p }); else q.push(p); }, close:() => { try{ c.removeChannel(ch); }catch(e){} } }; }
  const bc = new BroadcastChannel('tower-pvp-' + name); bc.onmessage = e => { try{ onMsg(e.data); }catch(x){} };
  return { send:p => bc.postMessage(p), close:() => bc.close() }; }

/* ---------- the lobby list (in the title's Online menu) ---------- */
function pvBrowserHTML(){
  return `<div class="t2-panel t2-wide pv-browser"><div class="kick">Online · just for fun</div><h2 class="f">Lobbies</h2>
    <p class="note">Join a lobby to watch, then hop in the line to fight. <b>One on One</b>: two players, rematches until someone leaves. <b>Gauntlet</b>: winner stays on, the loser goes to the back of the line.</p>
    <div class="pv-new"><input id="pvName" maxlength="28" placeholder="Lobby name"><select id="pvMode"><option value="gauntlet">Gauntlet</option><option value="1v1">One on One</option></select><button class="cta" id="pvCreate">Create lobby</button></div>
    <p class="pv-note" id="pvNote"></p>
    <div class="pv-list" id="pvList"><p class="muted">Looking for lobbies…</p></div></div>`; }
async function pvBrowserWire(){ await pvIdentity();
  const note = document.getElementById('pvNote'); if(note) note.innerHTML = pvCanPlay() ? `You're <b>${esc(PV.me.name)}</b>.` : '<b>Sign in on WCAUniverse.com</b> to play and chat. You can still watch.';

  document.getElementById('pvCreate').onclick = () => { if(!pvCanPlay()){ note.innerHTML = '<b>Sign in on WCAUniverse.com</b> to make a lobby.'; return; }
    const name = (nm.value || '').trim().slice(0, 28) || 'Lobby', mode = document.getElementById('pvMode').value; pvEnter({ id:'L' + rid(), name, mode, create:true }); };
  if(!PV.idxCh) PV.idxCh = pvChannel('index', pvIdxMsg);

function pvIdxMsg(p){ if(p && p.t === 'lob' && p.id){ PV.lobs[p.id] = Object.assign(p, { seen:Date.now() }); pvList(); } }
function pvBrowserStop(){ if(PV.idxCh && S.screen !== 'pvp'){ PV.idxCh.close(); PV.idxCh = null; clearInterval(PV.idxT); PV.lobs = {}; } }
function pvList(){ const box = document.getElementById('pvList'); if(!box) return; const now = Date.now();
  Object.keys(PV.lobs).forEach(k => { if(now - PV.lobs[k].seen > 12000) delete PV.lobs[k]; });
  const L = Object.values(PV.lobs).sort((a, b) => (b.players || 0) - (a.players || 0));
  box.innerHTML = L.length ? L.map(l => `<div class="pv-lob"><div class="pv-lt"><b class="f">${esc(l.name)}</b><small>${l.mode === '1v1' ? 'One on One' : 'Gauntlet'} · ${l.players || 0} in line · ${l.watchers || 0} watching${l.phase === 'fight' && l.fighters ? ' · <span class="pv-live">LIVE</span> ' + esc(l.fighters.join(' vs ')) : ''}</small></div>
      <button class="cta" data-lob="${esc(l.id)}">Enter</button></div>`).join('') : '<p class="muted">No open lobbies right now. Make one!</p>';
  box.querySelectorAll('[data-lob]').forEach(b => b.onclick = () => { const l = PV.lobs[b.dataset.lob]; if(l) pvEnter({ id:l.id, name:l.name, mode:l.mode }); }); }

/* ---------- inside a lobby ---------- */
async function pvEnter(lob){ await pvIdentity(); pvLeave(true);
  PV.lob = lob; PV.members = {}; PV.joined = Date.now(); PV.chat = { p:[], s:[] }; PV.unread = { p:0, s:0 }; PV.view = null; PV.run = null; PV.asks = {};
  PV.st = lob.create ? { v:1, id:lob.id, name:lob.name, mode:lob.mode, queue:[], names:{}, phase:'wait', picks:{}, streak:{}, last:null, fight:null, next:0 } : null;
  PV.ch = pvChannel('lobby-' + lob.id, pvOnMsg);
  if(!PV.idxCh) PV.idxCh = pvChannel('index', pvIdxMsg);
  pvHb(); PV.hb = setInterval(pvHb, 3000);
  pvSend({ t:'hello' });
  S.quick = true; S.qdiff = 'normal'; S.screen = 'pvp'; render(); }
function pvLeave(quiet){ if(!PV.ch) return; try{ pvSend({ t:'bye' }); }catch(e){}
  if(PV.run && PV.run.match){ PV.run.match.over = true; PV.run.match.ui = {}; }
  clearInterval(PV.hb); PV.ch.close(); PV.ch = null; PV.st = null; PV.run = null; PV.view = null; MT = null; SND.crowdStop();
  document.querySelectorAll('.mg').forEach(x => x.remove()); }
window.addEventListener('beforeunload', () => { if(PV.ch) pvSend({ t:'bye' }); });
function pvSend(p){ if(!PV.ch) return; p.f = PV.me.id; p.n = PV.me.name; PV.ch.send(p); pvOnMsg(p, true); }
function pvHb(){ if(!PV.ch) return; pvSend({ t:'hb', j:PV.joined });
  const now = Date.now(); Object.keys(PV.members).forEach(id => { if(now - PV.members[id].seen > 10000) delete PV.members[id]; });
  if(pvLeader()) pvLeaderTick(); pvSide(); }
const pvLeaderId = () => { const m = Object.entries(PV.members).sort((a, b) => a[1].j - b[1].j || (a[0] < b[0] ? -1 : 1)); return m.length ? m[0][0] : PV.me.id; };
const pvLeader = () => pvLeaderId() === PV.me.id;
const pvName = id => (PV.members[id] && PV.members[id].n) || (PV.st && PV.st.names[id]) || 'Someone';
const pvFighting = () => !!(PV.st && PV.st.fight && (PV.st.phase === 'fight' || PV.st.phase === 'pick') && [PV.st.fight.a.id, PV.st.fight.b.id].includes(PV.me.id));
function pvOnMsg(p, self){
  if(!p || !p.t) return;
  if(p.t === 'hb' || p.t === 'hello'){ const isNew = !PV.members[p.f]; PV.members[p.f] = { n:String(p.n || '').slice(0, 24), j:p.j || PV.members[p.f] && PV.members[p.f].j || Date.now(), seen:Date.now() };
    if(p.t === 'hello' && !self && pvLeader() && PV.st) pvSend({ t:'st', s:PV.st }); if(isNew) pvSide(); return; }
  if(p.t === 'bye'){ delete PV.members[p.f]; if(pvLeader()) pvLeaderTick(); pvSide(); return; }
  if(p.t === 'st'){ const s = p.s; if(!s) return; if(!PV.st || s.v > PV.st.v || (p.f === pvLeaderId() && s.v >= PV.st.v)){ const was = PV.st; PV.st = s; pvStateChanged(was); } return; }
  if(p.t === 'chat'){ const tab = p.tab === 's' ? 's' : 'p', list = PV.chat[tab]; list.push({ n:String(p.n || '').slice(0, 24), x:String(p.x || '').slice(0, 200), f:p.f }); if(list.length > 120) list.shift();
    if(tab !== PV.tab) PV.unread[tab]++; pvChatDraw(); return; }
  // the match host's broadcast to everyone (opponent + spectators)
  if(p.t === 'say' && !self){ if(PV.view) say(p.x, p.k); return; }
  if(p.t === 'fx' && !self){ if(PV.view){ pvApplySnap(p.snap); const who = p.s ? (p.s === 'L' ? MT.a : MT.b) : null; fx(p.k, who, p.d); } return; }
  if(p.t === 'ask' && !self && p.to === PV.me.id) return pvAnswer(p);
  if(p.t === 'ans' && !self && PV.asks[p.id]){ const r = PV.asks[p.id]; delete PV.asks[p.id]; r(p.v); return; }
  // requests for the leader
  if(!pvLeader() || !PV.st) return;
  const s = PV.st, C = PVC(), max = s.mode === '1v1' ? 2 : Math.max(2, +C.gauntletMax || 12);
  if(p.t === 'join' && !s.queue.includes(p.f) && s.queue.length < max){ s.queue.push(p.f); s.names[p.f] = pvName(p.f); pvCommit(); }
  else if(p.t === 'quit'){ s.queue = s.queue.filter(x => x !== p.f); pvCommit(); }
  else if(p.t === 'pick' && s.phase === 'pick' && s.fight && [s.fight.a.id, s.fight.b.id].includes(p.f) && W(p.name)){
    s.picks[p.f] = { name:p.name, ids:Array.isArray(p.ids) ? p.ids.slice(0, 80) : [] }; pvCommit(); }
  else if(p.t === 'result' && s.phase === 'fight' && s.fight && p.mid === s.fight.mid && p.f === s.fight.a.id) pvResult(p.w, p.how);
}
// the leader keeps the line moving
function pvCommit(){ const s = PV.st; s.v++; pvLeaderTick(true); }
function pvLeaderTick(changed){ let s = PV.st; const lb = PV.lob;
  if(!s){ s = PV.st = { v:1, id:lb.id, name:lb.name, mode:lb.mode, queue:[], names:{}, phase:'wait', picks:{}, streak:{}, last:null, fight:null, next:0 }; changed = true; }
  const here = id => id === PV.me.id || !!PV.members[id];
  const before = s.queue.length; s.queue = s.queue.filter(here); if(s.queue.length !== before) changed = true;
  if(s.fight && (s.phase === 'pick' || s.phase === 'fight')){ const { a, b } = s.fight;
    if(!here(a.id) || !here(b.id) || !s.queue.includes(a.id) || !s.queue.includes(b.id)){
      if(s.phase === 'fight' && (here(a.id) || here(b.id))){ pvResult(here(a.id) && s.queue.includes(a.id) ? a.id : b.id, 'forfeit'); return; }
      s.phase = 'wait'; s.fight = null; s.picks = {}; changed = true; } }
  if(s.phase === 'result' && Date.now() >= s.next){ s.phase = 'wait'; changed = true; }
  if(s.phase === 'wait' && s.queue.length >= 2){ const a = s.queue[0], b = s.queue[1];
    s.phase = 'pick'; s.picks = {}; s.fight = { mid:rid(), a:{ id:a, user:s.names[a] || pvName(a) }, b:{ id:b, user:s.names[b] || pvName(b) } }; changed = true; }
  if(s.phase === 'pick' && s.fight && s.picks[s.fight.a.id] && s.picks[s.fight.b.id]){ s.phase = 'fight';
    s.fight.a.name = s.picks[s.fight.a.id].name; s.fight.b.name = s.picks[s.fight.b.id].name; changed = true; }
  if(changed){ s.v++; pvSend({ t:'st', s }); }
  if(PV.idxCh) PV.idxCh.send({ t:'lob', id:s.id, name:s.name, mode:s.mode, players:s.queue.length, watchers:Math.max(0, Object.keys(PV.members).length - s.queue.length), phase:s.phase,
    fighters:s.phase === 'fight' && s.fight ? [s.fight.a.user, s.fight.b.user] : null }); }
function pvResult(winId, how){ const s = PV.st, f = s.fight; if(!f) return; const loseId = winId === f.a.id ? f.b.id : f.a.id;
  s.streak[winId] = (s.streak[winId] || 0) + 1; s.streak[loseId] = 0;
  s.queue = [winId].concat(s.queue.filter(x => x !== winId && x !== loseId)).concat(s.queue.includes(loseId) ? [loseId] : []);   // winner stays on, loser to the back
  s.last = { w:winId, wn:winId === f.a.id ? f.a.name : f.b.name, wu:s.names[winId] || pvName(winId), l:loseId, lu:s.names[loseId] || pvName(loseId), how, streak:s.streak[winId] };
  s.phase = 'result'; s.fight = null; s.picks = {}; s.next = Date.now() + Math.max(2, +PVC().nextSecs || 6) * 1000; s.v++; pvSend({ t:'st', s }); }

/* ---------- the room screen ---------- */
function pvRoom(){ if(!PV.lob){ go('title'); return; }
  app.innerHTML = `<div class="pv"><section class="pv-main" id="pvMain"></section>
    <aside class="pv-side"><div class="pv-head"><div class="kick">${PV.lob.mode === '1v1' ? 'One on One' : 'Gauntlet · winner stays on'}</div><b class="f pv-title">${esc(PV.lob.name)}</b></div>
      <div class="pv-q" id="pvQ"></div>
      <div class="pv-btns"><button class="cta" id="pvJoin">Join the line</button><button class="cta ghost" id="pvOut" onclick="go('title')">Leave lobby</button></div>
      <div class="pv-chat"><div class="pv-tabs" role="tablist"><button role="tab" data-tab="p">Players <i id="pvUp"></i></button><button role="tab" data-tab="s">Spectators <i id="pvUs"></i></button></div>
        <div class="pv-msgs" id="pvMsgs" aria-live="polite"></div>
        <form class="pv-say" id="pvSay"><input id="pvText" maxlength="200" autocomplete="off" placeholder="Say something"><button class="cta">Send</button></form></div></aside></div>`;
  document.querySelectorAll('.pv-tabs [data-tab]').forEach(b => b.onclick = () => { PV.tab = b.dataset.tab; PV.unread[PV.tab] = 0; pvChatDraw(); });
  document.getElementById('pvJoin').onclick = () => { if(!pvCanPlay()) return; const inQ = PV.st && PV.st.queue.includes(PV.me.id); pvSend({ t:inQ ? 'quit' : 'join' }); };
  document.getElementById('pvSay').onsubmit = e => { e.preventDefault(); const i = document.getElementById('pvText'), x = (i.value || '').trim(); if(!x || !pvCanPlay()) return;
    const tab = pvFighting() ? 'p' : 's'; pvSend({ t:'chat', tab, x }); i.value = ''; if(PV.tab !== tab){ PV.tab = tab; pvChatDraw(); } };
  PV.shown = null; pvStateChanged(null); pvSide(); pvChatDraw(); }
function pvSide(){ const q = document.getElementById('pvQ'); if(!q) return; const s = PV.st;
  const inLine = s ? s.queue : [], watchers = Object.keys(PV.members).filter(id => !inLine.includes(id));
  q.innerHTML = `<div class="pv-sub">In line (${inLine.length})</div>${inLine.map((id, i) => { const fighting = s.fight && [s.fight.a.id, s.fight.b.id].includes(id) && (s.phase === 'pick' || s.phase === 'fight');
      return `<div class="pv-row${id === PV.me.id ? ' me' : ''}${fighting ? ' on' : ''}"><span class="pv-n">${i + 1}</span><span class="pv-nm">${esc(pvName(id))}${id === PV.me.id ? ' (you)' : ''}</span>${(s.streak[id] || 0) >= 1 ? `<span class="pv-st">${s.streak[id]}W</span>` : ''}${fighting ? '<span class="pv-live">FIGHTING</span>' : ''}</div>`; }).join('') || '<p class="muted pv-empty">Nobody yet. Join the line!</p>'}
    <div class="pv-sub">Watching (${watchers.length})</div><div class="pv-watch">${watchers.map(id => `<span>${esc(pvName(id))}${id === PV.me.id ? ' (you)' : ''}</span>`).join('') || '<span class="muted">Nobody</span>'}</div>`;
  const j = document.getElementById('pvJoin'); if(j){ const inQ = s && s.queue.includes(PV.me.id), C = PVC(), max = s && s.mode === '1v1' ? 2 : +C.gauntletMax || 12;
    j.textContent = !pvCanPlay() ? 'Sign in to play' : inQ ? 'Leave the line' : (s && s.queue.length >= max ? 'Line is full' : 'Join the line'); j.disabled = !pvCanPlay() || (!inQ && !!s && s.queue.length >= max); j.classList.toggle('ghost', !!inQ); }
  const ip = document.getElementById('pvText'); if(ip){ ip.disabled = !pvCanPlay(); ip.placeholder = !pvCanPlay() ? 'Sign in to chat' : pvFighting() ? 'Talk to your opponent' : 'Chat with the other spectators'; } }
function pvChatDraw(){ const box = document.getElementById('pvMsgs'); if(!box) return;
  document.querySelectorAll('.pv-tabs [data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === PV.tab));
  const up = document.getElementById('pvUp'), us = document.getElementById('pvUs'); if(up) up.textContent = PV.unread.p ? PV.unread.p : ''; if(us) us.textContent = PV.unread.s ? PV.unread.s : '';
  const list = PV.chat[PV.tab];
  box.innerHTML = list.length ? list.map(m => `<div class="pv-m${m.f === PV.me.id ? ' me' : ''}"><b>${esc(m.n)}</b> ${esc(m.x)}</div>`).join('') : `<p class="muted">${PV.tab === 'p' ? 'The two fighters talk here. Everyone can read it.' : 'Spectators talk here.'}</p>`;
  box.scrollTop = box.scrollHeight; }

/* what the middle shows: waiting, picking, the match, or the result */
function pvStateChanged(was){ pvSide(); const main = document.getElementById('pvMain'); const s = PV.st; if(!main) return;
  if(!s){ main.innerHTML = '<div class="pv-big"><b class="f">Joining…</b></div>'; return; }
  const key = s.phase + '|' + (s.fight ? s.fight.mid : '') + (s.phase === 'result' && s.last ? '|' + s.last.w + s.v : '') + (s.phase === 'wait' ? '|' + s.queue.length + pvCanPlay() : '');
  if(s.phase === 'pick'){ const same = !!(s.fight && PV.pkMid === s.fight.mid); PV.pkMid = s.fight && s.fight.mid; pvPickDraw(same); PV.shown = key; return; }
  if(PV.shown === key) return; PV.shown = key;
  if(s.phase === 'fight'){ pvFightStart(); return; }
  if(PV.run && PV.run.match){ PV.run.match.over = true; PV.run.match.ui = {}; } PV.run = null; PV.view = null; MT = null; SND.crowdStop();
  if(s.phase === 'result' && s.last){ const L = s.last;
    if(L.how === 'forfeit') SND.vo('vo-pvp-forfeit', 4); else if(s.mode !== '1v1' && L.streak >= 2) SND.vo('vo-pvp-streak', 4);
    main.innerHTML = `<div class="pv-big"><div class="kick">${L.how === 'forfeit' ? 'Win by forfeit' : 'Winner'}</div><b class="f pv-win">${esc(L.wu)}</b><p>${esc(L.wn || '')}${L.streak >= 2 ? ` · <span class="pv-st">${L.streak} wins in a row</span>` : ''}</p>
      <p class="muted">${s.mode === '1v1' ? 'Rematch coming up.' : `${esc(L.lu)} goes to the back of the line. Next match coming up.`}</p></div>`; return; }
  const n = s.queue.length;
  main.innerHTML = `<div class="pv-big"><div class="kick">${s.mode === '1v1' ? 'One on One' : 'Gauntlet'}</div><b class="f">${n ? 'Waiting for one more' : 'Waiting for players'}</b>
    <p class="muted">${pvCanPlay() ? 'Press <b>Join the line</b> to fight.' : 'Sign in on WCAUniverse.com to fight.'} Everyone else watches.</p></div>`; }

/* ---------- picking wrestlers (both fighters at once) ---------- */
function pvPickDraw(same){ const s = PV.st, f = s.fight, main = document.getElementById('pvMain'); if(!main || !f) return;
  const mine = [f.a.id, f.b.id].includes(PV.me.id), locked = !!s.picks[PV.me.id];
  if(!same){ PV.pk = { q:'', page:0, sel:PV.pk.sel && W(PV.pk.sel) ? PV.pk.sel : (ROSTER[0] && ROSTER[0].name), locked:false };
    if(s.mode !== '1v1' && was2nd(f)) SND.vo('vo-pvp-next', 3); }
  const lockLine = id => s.picks[id] ? `<span class="pv-ok">Locked in</span>` : `<span class="muted">Choosing…</span>`;
  const head = `<div class="pv-vsh"><div><b class="f">${esc(f.a.user)}</b>${lockLine(f.a.id)}</div><span class="f pv-vs">VS</span><div><b class="f">${esc(f.b.user)}</b>${lockLine(f.b.id)}</div></div>`;
  if(!mine || locked){ main.innerHTML = `${head}<div class="pv-big"><b class="f">${locked ? 'Locked in! Waiting for your opponent' : 'The fighters are choosing'}</b>${locked ? `<p>${esc(s.picks[PV.me.id].name)}</p>` : ''}</div>`; return; }
  if(same && document.getElementById('pvGrid')){ const h = main.querySelector('.pv-vsh'); if(h) h.outerHTML = head; return; }
  main.innerHTML = `${head}<div class="pv-pick"><div class="pv-pl"><div class="pk-top"><input class="search" id="pvQs" placeholder="Find a wrestler"><span class="pk-pg" id="pvPg"></span></div>
      <div class="pk-grid" id="pvGrid"></div><div class="pk-nav"><button class="t2-arr pk-arr" id="pvPrev" aria-label="Previous page">${ARW_L}</button><button class="t2-arr pk-arr" id="pvNext" aria-label="Next page">${ARW_R}</button></div></div>
    <div class="pv-pv" id="pvPv"></div></div>`;
  const q = document.getElementById('pvQs'); q.oninput = () => { PV.pk.q = q.value; PV.pk.page = 0; pvGrid(); };
  document.getElementById('pvPrev').onclick = () => { PV.pk.page--; pvGrid(); }; document.getElementById('pvNext').onclick = () => { PV.pk.page++; pvGrid(); };
  pvGrid(); }
const was2nd = f => !!f;
function pvGrid(){ const g = document.getElementById('pvGrid'); if(!g) return;
  const list = ROSTER.filter(w => !PV.pk.q || w.name.toLowerCase().includes(PV.pk.q.toLowerCase())), tw = window.innerWidth <= 640 ? 70 : 96, th = tw + 26, gap = 8;
  const cols = Math.max(2, Math.floor((g.clientWidth + gap) / (tw + gap))), rows = Math.max(1, Math.floor((g.clientHeight + gap) / (th + gap))), per = cols * rows, pages = Math.max(1, Math.ceil(list.length / per));
  PV.pk.page = Math.max(0, Math.min(pages - 1, PV.pk.page)); g.style.setProperty('--tw', tw + 'px'); g.style.gridTemplateColumns = `repeat(${cols}, ${tw}px)`;
  g.innerHTML = list.slice(PV.pk.page * per, PV.pk.page * per + per).map(w => `<button class="pkc${w.name === PV.pk.sel ? ' sel' : ''}" data-n="${esc(w.name)}" title="${esc(w.name)}"><span class="pkf">${face(w)}</span><b class="f">${esc(w.name)}</b></button>`).join('') || '<p class="muted">Nobody by that name.</p>';
  g.querySelectorAll('.pkc').forEach(b => b.onclick = () => { PV.pk.sel = b.dataset.n; g.querySelectorAll('.pkc').forEach(x => x.classList.toggle('sel', x === b)); pvPv(); });
  document.getElementById('pvPg').textContent = `Page ${PV.pk.page + 1} of ${pages}`; document.getElementById('pvPrev').disabled = PV.pk.page <= 0; document.getElementById('pvNext').disabled = PV.pk.page >= pages - 1; pvPv(); }
function pvPv(){ if(!PV.pk.sel || !W(PV.pk.sel)) PV.pk.sel = ROSTER[0] && ROSTER[0].name; const box = document.getElementById('pvPv'), n = PV.pk.sel; if(!box || !n) return; const su = setupOf(n), st = styleOf(su.style);
  box.innerHTML = `<div class="ph">${face(W(n))}</div><b class="f pv-pn">${esc(n)}</b><span class="chip gold"><span>${esc(st.name)}</span></span>
    <p class="muted">${esc(su.sigName)} · ${esc(su.finName)}</p><button class="cta big-go" id="pvLock">Lock in ▶</button>`;
  document.getElementById('pvLock').onclick = () => { if(!W(n)) return; pvSend({ t:'pick', name:n, ids:loadoutOf(n) }); SND.vo('vo-pvp-lockin', 2, 4000); }; }

/* ---------- the match ---------- */
const pvSnapF = f => ({ hp:f.hp, max:f.max, mom:f.mom, revs:f.revs, stun:!!f.stun, hist:(f.hist || []).slice(-4) });
function pvSnap(m){ return { a:pvSnapF(m.a), b:pvSnapF(m.b), pos:m.pos, ctrl:m.ctrl ? m.ctrl.side : null, combo:m.combo || 0, turn:m.turn }; }
const pvClean = d => { if(d == null || typeof d !== 'object') return d; const o = {}; for(const k in d){ const v = d[k]; if(v == null || typeof v !== 'object') o[k] = v; } return o; };
function pvFightStart(){ const s = PV.st, f = s.fight, main = document.getElementById('pvMain'); if(!f || !main) return;
  const iAmA = PV.me.id === f.a.id, iAmB = PV.me.id === f.b.id;
  battleScreen(main, true); SND.crowdStop(); SOUNDS_ON.start();
  const mk = (who, side, brain, ids) => { const fi = makeFighter(who.name, { brain, loadout:(ids && ids.length ? ids.filter(id => canUse(moveOf(id), who.name)) : defaultLoadout(who.name)).concat(ownMoves(who.name).map(m => m.id)).filter((x, i, a) => a.indexOf(x) === i) });
    fi.side = side; fi.user = who.user; fi.isMe = who.id === PV.me.id; return fi; };
  const pa = s.picks[f.a.id] || {}, pb = s.picks[f.b.id] || {};
  if(iAmA){   // I run the match
    const A = mk(f.a, 'L', pvTimed(humanBrain(), 'L'), pa.ids), B = mk(f.b, 'R', pvRemote(f.b.id), pb.ids);
    const ui = { wait:ms => sleep(ms), voiceIdle:() => SND.waitIdle(2500),
      say:(t, k) => { say(t, k); pvSend({ t:'say', x:t, k }); },
      fx:(k, who, d) => { fx(k, who, d); if(PV.ch) PV.ch.send({ t:'fx', f:PV.me.id, k, s:who ? who.side : null, d:pvClean(d), snap:pvSnap(m) }); } };
    const m = new Match(A, B, ui); m.meSide = 'L'; MT = m; PV.run = { mid:f.mid, match:m }; PV.view = null; drawBars();
    m.run().then(r => { if(!PV.run || PV.run.mid !== f.mid) return; pvSend({ t:'result', mid:f.mid, w:r.winner === A ? f.a.id : f.b.id, how:r.how }); });
    return; }
  // the other fighter and the spectators: a mirror of the match, kept up to date by the host
  const A = mk(f.a, 'L', null, pa.ids), B = mk(f.b, 'R', null, pb.ids);
  MT = { a:A, b:B, pos:null, ctrl:null, combo:0, turn:0, meSide:iAmB ? 'R' : 'L', spectate:!iAmB, other(x){ return x === this.a ? this.b : this.a; } };
  PV.view = { mid:f.mid }; PV.run = null; drawBars();
  if(!iAmB){ const c = document.getElementById('ctl'); if(c) c.innerHTML = `<div class="waiting">You're watching ${esc(f.a.user)} vs ${esc(f.b.user)}</div>`;
    const ask = document.getElementById('askAll'); if(ask) ask.closest('label').style.visibility = 'hidden'; } }
function pvApplySnap(sn){ if(!sn || !MT || MT.run) return; ['a', 'b'].forEach(k => Object.assign(MT[k], sn[k])); MT.pos = sn.pos; MT.combo = sn.combo; MT.turn = sn.turn; MT.ctrl = sn.ctrl ? (sn.ctrl === 'L' ? MT.a : MT.b) : null; }
// the other fighter's choices come over the wire (with a time limit, then the computer picks)
function pvRemote(toId){ const ai = aiBrain('normal');
  const ask = (kind, args, fallback) => new Promise(res => { const id = rid(); let done = false;
    const fin = v => { if(done) return; done = true; delete PV.asks[id]; res(v); };
    PV.asks[id] = fin; if(PV.ch) PV.ch.send({ t:'ask', f:PV.me.id, to:toId, id, kind, args, snap:MT ? pvSnap(MT) : null });
    setTimeout(() => fin(fallback()), Math.max(10, +PVC().turnSecs || 45) * 1000 + 15000); });   // a little extra for the mini games
  return {
    neutral:(m, f) => ask('neutral', {}, () => ai.neutral(m, f)),
    chain:(m, f, r) => ask('chain', { r }, () => ai.chain(m, f, r)),
    control:async (m, f, opts) => { const ser = opts.map(o => ({ type:o.type, mv:o.move ? o.move.id : null, mvo:o.move && !moveOf(o.move.id) ? o.move : null }));
      const i = await ask('control', { opts:ser }, () => opts.indexOf(ai.control(m, f, opts))); return opts[+i] || opts[opts.length - 1]; },
    reversal:(m, f, move, len, kind) => ask('reversal', { move:pvClean(move), len, kind }, () => null),
    kickout:(m, f, zone) => ask('kickout', { zone }, () => ai.kickout(m, f, zone)),
    escape:(m, f, move, len) => ask('escape', { move:pvClean(move), len }, () => ai.escape(m, f, move, len)) }; }
// my own choices as the host also have the time limit
function pvTimed(brain, side){ const ai = aiBrain('normal'), T = () => Math.max(10, +PVC().turnSecs || 45) * 1000;
  const race = (p, fb) => Promise.race([p, new Promise(r => setTimeout(() => r({ __to:true }), T() + 15000))]).then(v => { if(v && v.__to){ document.querySelectorAll('.mg').forEach(x => x.remove()); return fb(); } return v; });
  return { neutral:(m, f) => race(brain.neutral(m, f), () => ai.neutral(m, f)), chain:(m, f, r) => race(brain.chain(m, f, r), () => ai.chain(m, f, r)),
    control:(m, f, o) => race(brain.control(m, f, o), () => ai.control(m, f, o)), reversal:(m, f, mv, l, k) => race(brain.reversal(m, f, mv, l, k), () => null),
    kickout:(m, f, z) => race(brain.kickout(m, f, z), () => ai.kickout(m, f, z)), escape:(m, f, mv, l) => race(brain.escape(m, f, mv, l), () => ai.escape(m, f, mv, l)) }; }
// I'm the other fighter: answer the host's question with the normal controls
async function pvAnswer(p){ if(!MT || MT.run) return; pvApplySnap(p.snap); const me = MT.b, a = p.args || {}, hb = humanBrain(); let v;
  try{
    if(p.kind === 'neutral') v = await hb.neutral(MT, me);
    else if(p.kind === 'chain') v = await hb.chain(MT, me, a.r);
    else if(p.kind === 'control'){ const opts = (a.opts || []).map(o => ({ type:o.type, move:o.mv ? (moveOf(o.mv) || o.mvo) : o.mvo || undefined }));
      const pick = await hb.control(MT, me, opts); v = opts.indexOf(pick); }
    else if(p.kind === 'reversal') v = await hb.reversal(MT, me, a.move, a.len, a.kind);
    else if(p.kind === 'kickout') v = await hb.kickout(MT, me, a.zone);
    else if(p.kind === 'escape') v = await hb.escape(MT, me, a.move, a.len);
  }catch(e){ v = null; }
  const c = document.getElementById('ctl'); if(c && p.kind !== 'kickout') c.innerHTML = '<div class="waiting">…</div>';
  if(PV.ch) PV.ch.send({ t:'ans', f:PV.me.id, id:p.id, v }); }
window.addEventListener('resize', () => { if(S.screen === 'pvp') pvGrid(); });

(async function(){ app.innerHTML = '<div class="kick">Loading the roster…</div>'; await loadRoster(); await refreshToday();
  if(LIVE){ document.querySelectorAll('.top a[href*="tower-admin"], .top .chip').forEach(x => x.remove()); }
  render(); SND.check(); })();

</script>
