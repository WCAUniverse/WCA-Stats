<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tower of Champions | WCA Universe</title>
<!-- Tower of Champions (practice version, Nov 2026). The game.
     Reads the roster and champions from the website; never writes to it.
     Settings are shared between tower.html and tower-admin.html in this browser. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800;1,900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>
<style>
:root{
  --bg:#0b0b0e; --panel:#141418; --panel2:#1c1c22; --line:#2c2c34;
  --gold:#E9B949; --gold-rgb:233,185,73; --on-gold:#15120a;
  --hot:#E24B4A; --win:#3ECF8E; --blue:#5FB4FF; --bet:#3EF0A0;
  --txt:#f4f4f2; --txt2:#d0cec8; --muted:#8c8c94;
  --fight:'Barlow Condensed', 'Arial Narrow', sans-serif; --body:'Barlow', system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1200px 600px at 50% -10%,rgba(var(--gold-rgb),.12),transparent 60%),radial-gradient(900px 500px at 50% 120%,rgba(226,75,74,.14),transparent 60%),var(--bg);
  background-attachment:fixed;color:var(--txt);font-family:var(--body);font-size:17px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:var(--txt);background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.f{font-family:var(--fight);font-style:italic;font-weight:900;text-transform:uppercase;letter-spacing:1px}
.chrome{background:linear-gradient(180deg,#fff 0%,#dfe3ea 45%,#8d94a4 56%,#f0f2f6 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.kick{font-family:var(--fight);font-weight:700;font-size:15px;letter-spacing:3px;text-transform:uppercase;color:var(--gold)}
.muted{color:var(--muted)}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 18px;background:linear-gradient(180deg,rgba(0,0,0,.92),rgba(0,0,0,.75));border-bottom:1px solid rgba(var(--gold-rgb),.3);backdrop-filter:blur(8px)}
.top .title{font-size:26px}
.top .sp{flex:1}
.tbtn{padding:9px 16px;background:rgba(0,0,0,.6);border:1px solid var(--line);font-family:var(--fight);font-style:italic;font-weight:800;font-size:17px;letter-spacing:1px;text-transform:uppercase;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);text-decoration:none;color:var(--txt)}
.tbtn:hover{border-color:var(--gold);color:var(--gold)}
.wrap{max-width:1240px;margin:0 auto;padding:24px 18px 80px}
.panel{position:relative;background:linear-gradient(160deg,rgba(26,26,32,.94),rgba(10,10,14,.94));border:1px solid var(--line);border-radius:4px;padding:22px}
.panel::before{content:"";position:absolute;left:0;top:0;width:120px;height:3px;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.cta{display:inline-flex;align-items:center;gap:10px;padding:13px 28px;border:0;background:var(--gold);color:var(--on-gold);font-family:var(--fight);font-style:italic;font-weight:900;font-size:21px;letter-spacing:1.5px;text-transform:uppercase;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.cta:hover{filter:brightness(1.1)}
.cta.ghost{background:rgba(255,255,255,.08);color:var(--txt)}
.cta:disabled{opacity:.4;cursor:not-allowed}
h1.big{font-size:clamp(44px,7vw,90px);line-height:.9;margin:6px 0 10px}
.note{color:var(--txt2);line-height:1.55;max-width:72ch}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 11px;font-family:var(--fight);font-weight:700;font-size:15px;letter-spacing:.5px;text-transform:uppercase;border:1px solid var(--line);background:rgba(255,255,255,.04);transform:skewX(-10deg);display:inline-block}
.chip > span{display:inline-block;transform:skewX(10deg)}
.chip.gold{background:var(--gold);color:var(--on-gold);border-color:transparent}
.chip.blue{border-color:rgba(95,180,255,.5);color:var(--blue)}
.chip.red{border-color:rgba(226,75,74,.6);color:#ff8f8e}
.ini{display:grid;place-items:center;font-family:var(--fight);font-weight:900;font-style:italic;color:rgba(255,255,255,.35)}
.mini{padding:6px 12px;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:6px;font-size:15px}
.mini:hover{border-color:var(--gold)}
.mini.del{border-color:rgba(226,75,74,.5);color:#ff8f8e}
.saved{color:var(--win);font-weight:600;font-size:15px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wallet{display:flex;align-items:center;gap:10px;padding:6px 16px 6px 8px;background:rgba(0,0,0,.6);border:1px solid var(--line);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.wallet .coin{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:var(--on-gold);font-weight:800}
.wallet b{font-family:var(--fight);font-style:italic;font-size:22px;font-variant-numeric:tabular-nums;line-height:1}
.wallet small{display:block;font-size:13px;color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:22px}
.mode{text-align:left;padding:22px;border:1px solid var(--line);background:linear-gradient(160deg,var(--panel2),var(--panel));border-radius:4px;position:relative;overflow:hidden;transition:transform .15s,border-color .15s}
.mode:hover{transform:translateY(-3px);border-color:var(--c,var(--gold))}
.mode::after{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--c,var(--gold))}
.mode b{display:block;font-family:var(--fight);font-style:italic;font-weight:900;font-size:34px;text-transform:uppercase;line-height:1}
.mode span{display:block;color:var(--txt2);margin-top:6px;font-size:16px;line-height:1.4}
.mode .rw{margin-top:10px;font-family:var(--fight);font-weight:800;font-size:17px;color:var(--bet)}
.howto{margin-top:22px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.howto div{padding:14px 16px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:4px;line-height:1.45;color:var(--txt2)}
.howto b{color:var(--txt);font-family:var(--fight);font-style:italic;font-size:19px;text-transform:uppercase;display:block}
.search{width:100%;max-width:360px}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:14px}
.slot{position:relative;aspect-ratio:3/4;border:0;padding:0;overflow:hidden;background:linear-gradient(160deg,#2a2a33,#0b0b0e);clip-path:polygon(10% 0,100% 0,90% 100%,0 100%);transition:transform .12s,filter .12s;filter:saturate(.85) brightness(.85)}
.slot:hover,.slot:focus-visible,.slot.sel{filter:none;transform:scale(1.04)}
.slot.sel{outline:3px solid var(--gold);outline-offset:-3px}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top}
.slot .ini{position:absolute;inset:0;font-size:44px}
.slot .nm{position:absolute;left:0;right:0;bottom:0;padding:22px 14px 8px;background:linear-gradient(0deg,rgba(0,0,0,.92),transparent);font-family:var(--fight);font-style:italic;font-weight:900;font-size:17px;text-transform:uppercase;text-align:center;line-height:1.05}
.slot .st{position:absolute;top:6px;left:14%;font-family:var(--fight);font-weight:800;font-size:12px;letter-spacing:1px;padding:2px 7px;background:rgba(0,0,0,.7);color:var(--gold);text-transform:uppercase}
.pick-side{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.preview{position:sticky;top:80px}
.preview .ph{aspect-ratio:1/1;max-height:300px;width:100%;overflow:hidden;background:#0b0b0e;margin:-6px 0 12px;display:grid}
.preview .ph img{width:100%;height:100%;object-fit:cover;object-position:center top}
.preview .ph .ini{font-size:90px}
/* moveset */
.ms{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;margin-top:16px}
.ms-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.ms-h b{font-size:24px}
.ms-list{display:grid;gap:6px}
.mvpick{display:block;text-align:left;padding:9px 12px;border:1px solid var(--line);background:rgba(0,0,0,.35);border-radius:6px}
.mvpick b{display:block;font-size:17px}.mvpick small{color:var(--muted);font-size:14px}
.mvpick.on{border-color:var(--gold);background:rgba(var(--gold-rgb),.12)}
.mvpick.on b::before{content:"✓ ";color:var(--gold)}
.mvpick.fixed{opacity:.6;cursor:default}
/* tower */
.tower{display:flex;flex-direction:column-reverse;gap:8px;margin-top:16px}
.floor{display:grid;grid-template-columns:80px 64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 16px;border:1px solid var(--line);background:rgba(0,0,0,.45);border-radius:4px}
.floor .no{font-family:var(--fight);font-style:italic;font-weight:900;font-size:24px;color:var(--muted)}
.floor .fc{width:64px;height:64px;overflow:hidden;background:#0b0b0e;clip-path:polygon(14% 0,100% 0,86% 100%,0 100%);display:grid}
.floor .fc img{width:100%;height:100%;object-fit:cover;object-position:center top}.floor .fc .ini{font-size:22px}
.floor b{font-family:var(--fight);font-style:italic;font-weight:900;font-size:22px;text-transform:uppercase}
.floor small{display:block;color:var(--txt2);font-size:15px}
.floor.done{opacity:.55}.floor.done .no{color:var(--win)}
.floor.next{border-color:var(--gold);box-shadow:0 0 18px rgba(var(--gold-rgb),.25)}.floor.next .no{color:var(--gold)}
.floor.boss{background:linear-gradient(90deg,rgba(var(--gold-rgb),.18),rgba(0,0,0,.5))}.floor.boss .no{color:var(--gold)}
/* fight */
.arena{position:relative;display:grid;grid-template-columns:1fr minmax(160px,auto) 1fr;gap:16px;align-items:end}
.fighter{position:relative;display:flex;flex-direction:column;gap:6px}
.fighter.r{align-items:flex-end;text-align:right}
.fighter.r .chips{justify-content:flex-end}
.portrait{position:relative;width:min(100%,290px);aspect-ratio:1/1;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);transition:filter .2s}
.pimg{position:absolute;inset:0;background:linear-gradient(160deg,#2a2a33,#0b0b0e);display:grid}
.pimg img{width:100%;height:100%;object-fit:cover;object-position:center top}
.pimg .ini{font-size:90px}
.fighter.r .pimg img{transform:scaleX(-1)}
.tint{position:absolute;inset:0;background:#ff1e1e;mix-blend-mode:multiply;opacity:0;pointer-events:none}
.portrait.stun{filter:grayscale(.85) brightness(.6)}
.fighter .nm{font-size:clamp(24px,3vw,40px);line-height:1}
.bar{position:relative;width:min(100%,340px);height:20px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.2);transform:skewX(-18deg);overflow:hidden}
.bar span{position:absolute;top:0;bottom:0;transition:width .35s ease}
.fighter.l .bar span{left:0}.fighter.r .bar span{right:0}
.bar.hp span{background:linear-gradient(90deg,#c2412f,#f5c24a 60%,#3ECF8E)}
.fighter.r .bar.hp span{background:linear-gradient(270deg,#c2412f,#f5c24a 60%,#3ECF8E)}
.bar.mo{height:11px}.bar.mo span{background:var(--blue);box-shadow:0 0 10px var(--blue)}
.bar .tick{position:absolute;top:0;bottom:0;left:50%;width:2px;background:rgba(255,255,255,.5)}
.barlbl{font-family:var(--fight);font-weight:700;font-size:15px;letter-spacing:1px;color:var(--txt2);text-transform:uppercase}
.barlbl b{color:var(--txt)}
.revs{display:inline-flex;gap:4px;vertical-align:middle;margin-left:6px}
.revs i{width:14px;height:14px;transform:skewX(-14deg);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25)}
.revs i.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 8px rgba(var(--gold-rgb),.6)}
.mid{align-self:center;text-align:center}
.stage{font-size:clamp(26px,3vw,40px);line-height:1;color:var(--gold);text-shadow:0 0 24px rgba(var(--gold-rgb),.5)}
.stage-sub{color:var(--txt2);margin-top:6px;font-size:16px}
/* the animations */
.lungeL{animation:lungeL .32s ease-out}.lungeR{animation:lungeR .32s ease-out}
@keyframes lungeL{0%{transform:none}40%{transform:translateX(26%) scale(1.06) rotate(3deg)}100%{transform:none}}
@keyframes lungeR{0%{transform:none}40%{transform:translateX(-26%) scale(1.06) rotate(-3deg)}100%{transform:none}}
.hit{animation:shake .4s}.hit .tint{animation:tint .55s}
.hitbig{animation:shakeBig .6s}.hitbig .tint{animation:tint .9s}
@keyframes tint{0%{opacity:.75}100%{opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px) rotate(-2deg)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(4px)}}
@keyframes shakeBig{0%,100%{transform:none}15%{transform:translate(-20px,6px) rotate(-5deg)}35%{transform:translate(16px,-4px) rotate(4deg)}55%{transform:translate(-10px,3px)}75%{transform:translate(6px,0)}}
.healfx{animation:heal .6s}@keyframes heal{0%{filter:brightness(1.8) hue-rotate(80deg)}100%{filter:none}}
.blockfx{animation:block .5s}@keyframes block{0%{filter:brightness(1.6) drop-shadow(0 0 0 #5FB4FF)}100%{filter:none}}
.windup{animation:windup .45s}@keyframes windup{0%{transform:none}50%{transform:scale(1.08) translateY(-6px)}100%{transform:none}}
.abilityfx{animation:abil .6s}@keyframes abil{0%{filter:drop-shadow(0 0 0 #5FB4FF) brightness(1.6)}100%{filter:none}}
.pushL{animation:pushL .7s ease-in-out}.pushR{animation:pushR .7s ease-in-out}
@keyframes pushL{0%,100%{transform:none}30%,70%{transform:translateX(18%) rotate(4deg)}50%{transform:translateX(12%) rotate(2deg)}}
@keyframes pushR{0%,100%{transform:none}30%,70%{transform:translateX(-18%) rotate(-4deg)}50%{transform:translateX(-12%) rotate(-2deg)}}
.sway{animation:sway .9s ease-in-out}@keyframes sway{0%,100%{transform:none}50%{transform:translateY(-6px) rotate(1.5deg)}}
.quake{animation:quake .5s}@keyframes quake{0%,100%{transform:none}25%{transform:translateY(4px)}50%{transform:translateY(-3px)}75%{transform:translateY(2px)}}
.flashbig{animation:fbig .4s}@keyframes fbig{0%{filter:brightness(2)}100%{filter:none}}
.dmg{position:absolute;top:22%;left:50%;transform:translateX(-50%);font-family:var(--fight);font-style:italic;font-weight:900;font-size:58px;color:#fff;text-shadow:0 0 18px var(--hot),0 4px 0 #000;animation:float 1s ease-out forwards;pointer-events:none;z-index:5;white-space:nowrap}
.dmg.heal{text-shadow:0 0 18px var(--win),0 4px 0 #000}.dmg.crash{color:#ffd0d0}.dmg.block{font-size:36px;text-shadow:0 0 18px var(--blue),0 3px 0 #000}
@keyframes float{from{opacity:1;transform:translate(-50%,0) scale(1.2)}to{opacity:0;transform:translate(-50%,-70px) scale(.9)}}
.call{min-height:92px;margin:14px 0;padding:14px 18px;text-align:center}
.call .big{font-size:clamp(22px,3vw,34px);line-height:1.05}
.call .big.huge{font-size:clamp(30px,4.4vw,52px);color:var(--gold)}
.ab-pop{display:inline-block;margin:8px 4px 0;padding:4px 12px;background:var(--blue);color:#04121f;font-family:var(--fight);font-style:italic;font-weight:900;font-size:17px;text-transform:uppercase;letter-spacing:1px;transform:skewX(-10deg)}
.moves{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mv{padding:18px 10px;border:0;font-family:var(--fight);font-style:italic;font-weight:900;font-size:clamp(22px,2.6vw,30px);text-transform:uppercase;letter-spacing:1px;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);transition:transform .1s,filter .1s;color:#fff}
.mv small{display:block;font-family:var(--body);font-style:normal;font-weight:600;font-size:14px;letter-spacing:0;text-transform:none;opacity:.9;margin-top:2px}
.mv:hover{transform:translateY(-2px);filter:brightness(1.12)}
.mv.s{background:#c2412f}.mv.g{background:#2f6fc2}.mv.b{background:#3a3a44}
.mvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.mvo{text-align:left;padding:12px 14px;border:0;border-left:4px solid #666;background:rgba(255,255,255,.06);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);transition:transform .1s,background .1s}
.mvo:hover{transform:translateY(-2px);background:rgba(255,255,255,.12)}
.mvo b{display:block;font-family:var(--fight);font-style:italic;font-weight:900;font-size:21px;text-transform:uppercase;line-height:1.05}
.mvo small{display:block;color:var(--txt2);font-size:14px;margin-top:3px}
.mvo.k-strike{border-left-color:#c2412f}.mvo.k-grapple{border-left-color:#2f6fc2}.mvo.k-highrisk{border-left-color:#ff8f3a;background:rgba(255,143,58,.1)}
.mvo.k-submission{border-left-color:#b07cff}.mvo.k-pin{border-left-color:var(--bet);background:rgba(62,240,160,.1)}
.mvo.k-whip,.mvo.k-climb,.mvo.k-pickup{border-left-color:#888}
.mvo.sig{background:linear-gradient(90deg,#5FB4FF,#9ad0ff);color:#04121f}.mvo.sig small{color:#04121f}
.mvo.fin{background:linear-gradient(90deg,var(--gold),#ffe29a);color:var(--on-gold)}.mvo.fin small{color:var(--on-gold)}
.mvo.back{border-left-color:#555;opacity:.8}
.ready{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 4px rgba(255,255,255,.3))}50%{filter:drop-shadow(0 0 16px rgba(255,255,255,.9))}}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;margin-top:10px;font-size:15px;color:var(--muted)}
.waiting{text-align:center;color:var(--muted);padding:20px;font-size:22px}
.incoming{text-align:center;padding:10px}.incoming .big{font-size:clamp(24px,3.4vw,38px);color:var(--hot)}
.log{max-height:170px;overflow-y:auto;margin-top:12px;padding:10px 14px;background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:4px;font-size:15px;line-height:1.55;color:var(--txt2)}
.log .l-ability{color:var(--blue)}.log .l-big,.log .l-bighit{color:var(--gold);font-weight:600}.log .l-call{color:var(--txt)}
/* mini games */
.mg{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgba(0,0,0,.72);backdrop-filter:blur(3px);padding:16px}
.mg-box{width:min(760px,100%);padding:22px;text-align:center;background:linear-gradient(160deg,#1c1c24,#0b0b0f);border:1px solid rgba(var(--gold-rgb),.5);box-shadow:0 0 40px rgba(var(--gold-rgb),.25)}
.mg-t{font-size:clamp(28px,4vw,46px);margin:4px 0 14px}
.lane{position:relative;height:84px;background:rgba(0,0,0,.5);border:1px solid var(--line);overflow:hidden;border-radius:6px}
.target{position:absolute;left:16%;top:50%;width:74px;height:74px;transform:translate(-50%,-50%);border:4px solid var(--gold);border-radius:50%;box-shadow:0 0 18px rgba(var(--gold-rgb),.6),inset 0 0 14px rgba(var(--gold-rgb),.3)}
.lnote{position:absolute;left:0;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;display:grid;place-items:center;font-size:36px;font-weight:900;color:#04121f;background:#fff;border-radius:12px;will-change:transform;transition:opacity .25s}
.lnote.hitn{background:var(--win);box-shadow:0 0 20px var(--win)}.lnote.missn{background:var(--hot);color:#fff}.lnote.gone{opacity:0}
.mg-score{display:flex;justify-content:center;gap:24px;margin:10px 0;font-family:var(--fight);font-weight:800;font-size:20px}
.mg-score .ok{color:var(--win)}.mg-score .no{color:var(--hot)}
.pads{display:grid;grid-template-columns:repeat(4,minmax(0,90px));gap:10px;justify-content:center}
.pad{height:72px;font-size:38px;font-weight:900;border:1px solid var(--line);background:rgba(255,255,255,.08);border-radius:10px;touch-action:manipulation}
.pad.pressed{animation:press .2s}@keyframes press{0%{background:var(--gold);color:#000}100%{background:rgba(255,255,255,.08)}}
.mg-res{font-size:44px;margin-top:10px}.mg-res.good{color:var(--win)}.mg-res.bad{color:var(--hot)}
.needlebar{position:relative;height:56px;background:linear-gradient(90deg,#3a1414,#1a1a1a 50%,#3a1414);border:1px solid var(--line);border-radius:6px;cursor:pointer;overflow:hidden}

function deep(o){ return JSON.parse(JSON.stringify(o)); }
function mergeDeep(base, over){ if(!over || typeof over !== 'object' || Array.isArray(over)) return over === undefined ? base : over;
  const out = Array.isArray(base) ? base.slice() : Object.assign({}, base); for(const k in over){ out[k] = (base && typeof base[k] === 'object' && !Array.isArray(base[k])) ? mergeDeep(base[k], over[k]) : over[k]; } return out; }
function loadCfg(){
  let c = null; if(LIVE) c = PUBLISHED ? deep(PUBLISHED) : null; else { try{ c = JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); }catch(e){} }
  const d = deep(DEFAULTS); if(!c){ d.v = 3; return d; }
  const out = { v:c.v || 1, settings:mergeDeep(d.settings, c.settings || {}), moves:Array.isArray(c.moves) && c.moves.length ? c.moves : d.moves,
    styles:Array.isArray(c.styles) && c.styles.length ? c.styles : d.styles, abilities:Array.isArray(c.abilities) ? c.abilities : d.abilities, wrestlers:c.wrestlers || {},
    towers:Array.isArray(c.towers) ? c.towers : [] };
  // settings saved before Nov 13: add the new styles and abilities, and give the High Flyer its health back
  if(out.v < 3){
    d.styles.forEach(st => { if(!out.styles.some(x => x.id === st.id)) out.styles.push(st); });
    d.abilities.forEach(a => { if(!out.abilities.some(x => x.id === a.id)) out.abilities.push(a); });
    const fl = out.styles.find(x => x.id === 'flyer');
    if(fl && +fl.hp === -8){ Object.assign(fl, d.styles.find(x => x.id === 'flyer')); }
    out.v = 3;
  }
  return out;
}

function loadouts(){ try{ return JSON.parse(localStorage.getItem(LOAD_KEY) || '{}') || {}; }catch(e){ return {}; } }
function saveLoadout(name, ids){ const l = loadouts(); l[name] = ids; try{ localStorage.setItem(LOAD_KEY, JSON.stringify(l)); }catch(e){} }
function defaultLoadout(){ const out = [], per = {}; CFG.moves.forEach(m => { per[m.from] = per[m.from] || 0;
  const always = m.kind === 'pin' || m.kind === 'pickup' || m.kind === 'climb' || m.kind === 'whip';
  if(always || per[m.from] < CFG.settings.maxMovesPerPos){ out.push(m.id); if(!always) per[m.from]++; } }); return out; }
function loadoutOf(name){ const l = loadouts()[name]; const ids = Array.isArray(l) ? l.filter(moveOf) : null; return ids && ids.length ? ids : defaultLoadout(); }

/* ---------- abilities in plain words ---------- */
function sentenceWhen(a){ let s = 'When ' + (WHEN[a.when] || a.when);
  if(['land','hitby','reverse','reversed'].includes(a.when) && a.kind && a.kind !== 'any') s += ' (' + KIND_FILTER[a.kind] + ')';
  if(a.cond && a.cond !== 'none') s += ', if ' + CONDS[a.cond] + ' ' + a.condVal + (a.cond === 'turnAtLeast' || a.cond === 'momAtLeast' ? '' : '%');
  return s; }
function sentenceThen(a){ return (a.effects||[]).map(e => { const E = EFFECTS[e.type]; if(!E) return ''; return E.v ? `${E.t} (${e.val}${E.v.startsWith('%') ? '' : ' '}${E.v})` : E.t; }).filter(Boolean).join(', then '); }
function sentence(a){ return `${sentenceWhen(a)}: ${+a.chance >= 100 ? 'always' : a.chance + '% chance to'} ${sentenceThen(a)}${a.once ? ' (once per match)' : ''}.`; }

/* ---------- numbers players and the admin can read ---------- */
function kickZone(f, opp){   // width of the green zone in %, from health
  const s = CFG.settings.pin, pct = Math.max(0, f.hp) / f.max;
  if(f.hp <= 0) return 0;
  let z = s.minZone + (s.maxZone - s.minZone) * Math.pow(pct, 1.15) + (+f.st.kickout || 0) + (f.zoneBonus || 0);
  if(opp && opp.pinBoost) z *= (1 - opp.pinBoost / 100);
  return Math.max(s.minZone * .75, Math.min(70, z));
}
function seqLen(move, defender, kind){   // how many arrows to hit for a reversal
  const s = CFG.settings.seq; let n = s.base + Math.max(0, (move && move.rev || 1) - 1) * s.perLevel;
  if(kind === 'sig') n += s.sigExtra; if(kind === 'fin') n += s.finExtra;
  if(defender && defender.easyNext){ n = Math.max(2, n - 1); }
  return Math.max(2, Math.min(9, n));
}

/* =====================================================================
   THE MATCH ENGINE
   Two "brains" make the choices: a person (the game screen) or the computer.
   Everything waits on brain answers, so the same engine runs the simulator.
   ===================================================================== */
function makeFighter(name, opts){
  const su = setupOf(name), st = styleOf(su.style), o = opts || {};
  const hp = Math.round((CFG.settings.hp + (+st.hp || 0)) * (o.hpScale || 1));
  return { name, w:W(name), su, st, abil:[st.trait].concat(su.abilities).filter(Boolean).map(abilityOf).filter(Boolean),
    hp, max:hp, mom:0, revs:CFG.settings.reversal.slots, stun:false, boost:0, shield:0, pinBoost:0, zoneBonus:0, easyNext:false, used:{}, low:false,
    dmgScale:o.dmgScale || 1, loadout:(o.loadout || loadoutOf(name)).map(moveOf).filter(Boolean), brain:o.brain, level:o.level || 'normal', hist:[] };
}

class Match {
  constructor(a, b, ui){ this.a = a; this.b = b; this.ui = ui || {}; this.turn = 0; this.over = false; this.winner = null; this.how = '';
    this.stats = { abilities:{}, reversals:0, crashes:0, pins:0, subs:0, slugfests:0, tieups:0 }; this.pos = null; this.ctrl = null; this.chainN = 0; }
  say(t, kind){ if(this.ui.say) this.ui.say(t, kind); }
  fx(kind, who, data){ if(this.ui.fx) this.ui.fx(kind, who, data); }
  async wait(ms){ if(this.ui.wait) await this.ui.wait(ms); }
  other(f){ return f === this.a ? this.b : this.a; }

  /* ---- abilities ---- */
  condOK(a, me, op){ const v = +a.condVal || 0, my = me.hp/me.max*100, o = op.hp/op.max*100;
    switch(a.cond){ case 'myHpBelow': return my < v; case 'myHpAbove': return my > v; case 'oppHpBelow': return o < v; case 'momAtLeast': return me.mom >= v; case 'turnAtLeast': return this.turn >= v; default: return true; } }
  fire(when, me, ctx){ const op = this.other(me); ctx = ctx || {};
    for(const a of me.abil){
      if(a.when !== when) continue;
      if(a.kind && a.kind !== 'any' && ctx.kind && a.kind !== ctx.kind) continue;
      if(a.once && me.used[a.id]) continue;
      if(!this.condOK(a, me, op)) continue;
      if(Math.random()*100 >= (+a.chance || 0)) continue;
      me.used[a.id] = true; this.stats.abilities[a.name] = (this.stats.abilities[a.name] || 0) + 1;
      (a.effects||[]).forEach(e => this.effect(e, me, op, ctx));
      this.say(`⚡ ${a.name} (${me.name}): ${sentenceThen(a)}`, 'ability'); this.fx('ability', me, a.name);
    } return ctx; }
  effect(e, me, op, ctx){ const v = +e.val || 0;
    switch(e.type){
      case 'dmg': if('extra' in ctx) ctx.extra += v; else this.damage(me, op, v, {}); break;
      case 'heal': me.hp = Math.min(me.max, me.hp + v); this.fx('heal', me, v); break;
      case 'mom': this.gain(me, v, true); break;
      case 'drain': op.mom = Math.max(0, op.mom - v); break;
      case 'stun': op.stun = true; break;
      case 'boost': me.boost = Math.max(me.boost, v); break;
      case 'shield': me.shield = Math.max(me.shield, v); break;
      case 'kickout': ctx.kickout = true; break;
      case 'escape': ctx.escape = true; break;
      case 'pinboost': me.pinBoost = Math.max(me.pinBoost, v); break;
      case 'revslot': me.revs += Math.max(1, v); break;
      case 'zone': me.zoneBonus = Math.max(me.zoneBonus, v); break;
      case 'control': ctx.control = true; break;
    } }

  gain(f, n, raw){ f.mom = Math.min(100, f.mom + n * (raw ? 1 : (+f.st.mom || 1))); }
  damage(att, def, amount, o){
    o = o || {}; let d = amount * (o.noScale ? 1 : att.dmgScale);
    if(att.boost && !o.self){ d *= 1 + att.boost/100; att.boost = 0; }
    if(def.shield){ d *= 1 - def.shield/100; def.shield = 0; }
    d = Math.max(1, Math.round(d)); def.hp -= d;
    this.fx(o.self ? 'crash' : 'hit', def, { dmg:d, by:att, big:o.big });
    if(!def.low && def.hp > 0 && def.hp/def.max < .3){ def.low = true; this.fire('lowhp', def); }
    return d; }

  /* ---- the match ---- */
  async run(){
    this.fire('start', this.a); this.fire('start', this.b);
    this.say(`The bell rings! ${this.a.name} and ${this.b.name} circle each other.`, 'call');
    this.fx('state', null, { stage:'neutral' });
    let guard = 0;
    while(!this.over && guard++ < 400){
      this.turn++;
      if(this.turn % CFG.settings.reversal.refillTurns === 0){ [this.a, this.b].forEach(f => { if(f.revs < CFG.settings.reversal.slots) f.revs++; }); }
      if(this.ctrl) await this.control(); else await this.neutral();
      this.fx('state', null, { stage:this.ctrl ? 'control' : 'neutral' });
    }
    if(!this.over){ this.over = true; this.winner = this.a.hp >= this.b.hp ? this.a : this.b; this.how = 'decision'; }
    return this;
  }

  async neutral(){
    const a = this.a, b = this.b;
    const [ca, cb] = await Promise.all([a.brain.neutral(this, a), b.brain.neutral(this, b)]);
    const pa = a.stun ? 'dazed' : ca, pb = b.stun ? 'dazed' : cb;
    if(a.stun) this.say(`${a.name} is stunned!`); if(b.stun) this.say(`${b.name} is stunned!`);
    a.stun = false; b.stun = false;
    if(ca !== 'dazed') a.hist.push(ca); if(cb !== 'dazed') b.hist.push(cb);
    const n = CFG.settings.neutral;
    if(pa === 'dazed' && pb === 'dazed'){ this.say('Both are seeing stars.'); return; }
    if(pa === 'dazed' || pb === 'dazed'){ const win = pa === 'dazed' ? b : a; return this.takeControl(win, 'standing', `${win.name} takes advantage!`); }
    if(pa === 'strike' && pb === 'strike') return this.slugfest();
    if(pa === 'grapple' && pb === 'grapple') return this.tieup();
    if(pa === 'block' && pb === 'block'){ this.gain(a, n.circleMom); this.gain(b, n.circleMom); this.say('They circle, feeling each other out.', 'call'); this.fx('circle'); return; }
    const pick = (x, y) => (pa === x && pb === y) ? [a, b] : (pb === x && pa === y) ? [b, a] : null;
    let r;
    if((r = pick('strike','grapple'))){ const [s, g] = r; this.fx('lunge', s); this.damage(s, g, n.strikeFirst * (+s.st.strike || 1), {}); this.fire('neutralwin', s); this.fire('neutrallose', g);
      return this.takeControl(s, 'standing', `${s.name} strikes first before ${g.name} can lock up!`); }
    if((r = pick('grapple','block'))){ const [g, bl] = r; this.fire('neutralwin', g); this.fire('neutrallose', bl);
      return this.takeControl(g, 'standing', `${g.name} grabs ${bl.name}. A block can't stop a grab.`); }
    if((r = pick('block','strike'))){ const [bl, s] = r; this.gain(bl, n.blockMom); this.fx('block', bl); this.fire('neutralwin', bl); this.fire('neutrallose', s);
      return this.takeControl(bl, 'standing', `${bl.name} blocks the strike and takes the opening!`); }
  }
  async slugfest(){
    const a = this.a, b = this.b, n = CFG.settings.neutral; this.stats.slugfests++;
    this.fire('slugfest', a); this.fire('slugfest', b);
    const roll = f => (+f.st.strike || 1) * (1 + f.mom/250) * (0.75 + Math.random()*.5);
    const ra = roll(a), rb = roll(b), win = ra >= rb ? a : b, lose = this.other(win);
    this.say(`SLUGFEST! ${a.name} and ${b.name} trade bombs!`, 'call'); this.fx('slugfest');
    this.fx('lunge', a); this.fx('lunge', b);
    this.damage(win, lose, n.slug * (+win.st.strike || 1), {});
    this.damage(lose, win, n.slug * (+lose.st.strike || 1) * n.slugWinnerTakes / 100, {});
    await this.wait(250);
    return this.takeControl(win, 'standing', `${win.name} wins the slugfest!`);
  }
  async tieup(){
    const a = this.a, b = this.b, c = CFG.settings.chain; this.stats.tieups++;
    this.say('Collar and elbow tie-up! Chain wrestling for the advantage.', 'call'); this.fx('tieup');
    const BEAT = { power:'speed', speed:'technique', technique:'power' };
    for(let r = 1; r <= c.rounds; r++){
      const [ca, cb] = await Promise.all([a.brain.chain(this, a, r), b.brain.chain(this, b, r)]);
      let win = null;
      if(ca === cb){
        // a tie: the better chain wrestler (style) can still squeeze it out
        const edge = (+a.st.chain || 0) - (+b.st.chain || 0);
        if(Math.abs(edge) > 0 && Math.random()*100 < Math.abs(edge)) win = edge > 0 ? a : b;
        else { this.say(`Both go for ${ca}. Nobody budges.`); continue; }
      } else win = BEAT[ca] === cb ? a : b;
      const lose = this.other(win), how = win === a ? ca : cb;
      this.fire('chainwin', win); this.fire('chainlose', lose); this.gain(win, c.winMom);
      if(how === 'technique') this.damage(win, lose, c.techDmg, {});
      const pos = how === 'power' ? 'corner' : how === 'speed' ? 'behind' : 'standing';
      return this.takeControl(win, pos, how === 'power' ? `${win.name} shoves ${lose.name} into the corner!` : how === 'speed' ? `${win.name} slips behind ${lose.name}!` : `${win.name} twists the arm with a wristlock!`);
    }
    this.say('They break the hold and reset.', 'call');
  }
  takeControl(f, pos, line){ this.ctrl = f; this.pos = pos; this.chainN = 0; if(line) this.say(line, 'call'); this.fx('control', f, { pos }); }

  /* ---- one wrestler on offense ---- */
  options(f){
    const s = CFG.settings, pos = this.pos, opp = this.other(f);
    const list = f.loadout.filter(m => m.from === pos);
    const out = list.map(m => ({ type:'move', move:m }));
    if(f.mom >= s.mom.sigCost && f.su.sigFrom === pos) out.push({ type:'sig' });
    if(f.mom >= s.mom.finCost && f.su.finFrom === pos) out.push({ type:'fin' });
    if(pos === 'ground' && !list.some(m => m.kind === 'pin')) out.push({ type:'move', move:moveOf('cover') || { id:'cover', name:'Pin', from:'ground', kind:'pin', dmg:0, to:'ground', mom:0, rev:0 } });
    if(pos !== 'top') out.push({ type:'backoff' });
    return out;
  }
  async control(){
    const att = this.ctrl, def = this.other(att);
    if(att.stun){ att.stun = false; this.say(`${att.name} is stunned and loses control!`); this.ctrl = null; return; }
    const pick = await att.brain.control(this, att, this.options(att));
    if(!pick || pick.type === 'backoff'){ this.say(`${att.name} backs off. They circle again.`, 'call'); this.ctrl = null; return; }
    let move, kind = 'move';
    if(pick.type === 'sig' || pick.type === 'fin'){
      kind = pick.type; const isFin = kind === 'fin';
      att.mom = Math.max(0, att.mom - (isFin ? CFG.settings.mom.finCost : CFG.settings.mom.sigCost));
      move = { id:kind, name:isFin ? att.su.finName : att.su.sigName, from:this.pos, kind:'grapple', dmg:isFin ? att.su.finDmg : att.su.sigDmg, to:'ground', mom:0, rev:isFin ? 3 : 2, crash:0, keep:false };
    } else move = pick.move;
    this.chainN++;
    // the moves that only change position
    if(['whip','climb','pickup'].includes(move.kind)){
      this.pos = move.to; this.gain(att, move.mom || 0);
      this.say(`${att.name}: ${move.name}.`, 'move'); this.fx('lunge', att); this.fx('control', att, { pos:this.pos });
      return;
    }
    if(move.kind === 'pin') return this.pin(att, def, move);
    if(move.kind === 'submission') return this.submission(att, def, move);

    // can the defender reverse (or dodge) it?
    this.say(kind === 'move' ? `${att.name} goes for a ${move.name}!` : `${att.name} sets up the ${move.name}!`, kind === 'move' ? 'move' : 'big');
    this.fx('windup', att, { name:move.name, big:kind !== 'move', kind });
    let reversed = false;
    if(move.rev > 0 && def.revs > 0){
      const len = seqLen(move, def, kind);
      const tried = await def.brain.reversal(this, def, move, len, kind);
      if(tried !== null && tried !== undefined){ def.revs--; def.easyNext = false; reversed = !!tried; }
    }
    if(reversed){
      this.stats.reversals++;
      if(move.kind === 'highrisk'){
        this.stats.crashes++; this.say(`${def.name} rolls out of the way! ${att.name} crashes and burns!`, 'call');
        this.damage(def, att, (move.crash || 6) * (+att.st.highrisk >= 1.2 ? .7 : 1), { self:true, noScale:true });
        this.fire('crash', att); this.fire('dodge', def); this.fx('dodge', def);
        this.ctrl = def; this.pos = 'ground'; this.chainN = 0; this.fx('control', def, { pos:'ground' });
      } else {
        this.say(`REVERSAL! ${def.name} counters the ${move.name}!`, 'call'); this.fx('reversal', def);
        this.fx('lunge', def); this.damage(def, att, CFG.settings.reversal.counterDmg * (1 + (+def.st.reversal || 0)/100), {});
        this.fire('reverse', def, { kind:move.kind }); this.fire('reversed', att, { kind:move.kind });
        this.takeControl(def, 'standing');
      }
      return;
    }
    // it lands
    const power = move.kind === 'strike' ? (+att.st.strike || 1) : move.kind === 'highrisk' ? (+att.st.highrisk || 1) : (+att.st.grapple || 1);
    const ctx = this.fire(kind === 'sig' ? 'sig' : kind === 'fin' ? 'fin' : 'land', att, { kind:move.kind, extra:0 });
    if(kind !== 'move') this.fire('land', att, ctx);
    this.fx('lunge', att, { big:kind !== 'move' });
    const d = this.damage(att, def, move.dmg * power + (ctx.extra || 0), { big:kind !== 'move' });
    this.fire(kind === 'move' ? 'hitby' : 'hitbig', def, { kind:move.kind }); if(kind !== 'move') this.fire('hitby', def, { kind:move.kind });
    this.gain(att, move.mom || 0); this.gain(def, 3);
    if(kind === 'fin') att.pinBoost = Math.max(att.pinBoost, CFG.settings.pin.finisherShrink);
    this.say(kind === 'move' ? `${move.name} connects! ${d} damage.` : `${move.name.toUpperCase()}! ${d} damage!`, kind === 'move' ? 'hit' : 'bighit');
    this.pos = move.to;
    if(ctx.control){ return; }
    // does the defender recover and get back to their feet?
    const c = CFG.settings.control;
    const chance = move.keep ? c.recoverBase/2 : c.recoverBase + c.recoverStep * (this.chainN - 1);
    if(def.hp > 0 && Math.random()*100 < chance && this.pos !== 'top'){
      this.say(`${def.name} fights back to their feet!`, 'call'); this.ctrl = null; this.pos = null; this.fx('recover', def);
    } else this.fx('control', att, { pos:this.pos });
  }

  async pin(att, def, move){
    this.stats.pins++;
    this.say(`${att.name} goes for the cover!`, 'big'); this.fx('pin', att);
    this.fire('pinning', att);
    const ctx = this.fire('pinned', def, {});
    let zone = kickZone(def, att); if(move && move.id === 'rollup') zone = Math.min(70, zone + 10);
    att.pinBoost = 0; def.zoneBonus = 0;
    // the count: every miss of the needle is one count. Three and it's over.
    // A person plays the needle (it counts as it goes); for the computer the count is shown here.
    let out = !!ctx.kickout, counts = out ? 2 : 3, played = false;
    if(!out && def.hp > 0){
      const r = await def.brain.kickout(this, def, zone);
      if(r && typeof r === 'object'){ out = !!r.out; counts = r.count; played = true; }
      else { out = !!r; counts = out ? (Math.random() < .4 ? 1 : 2) : 3; }
    }
    if(!played) for(let c = 1; c <= counts; c++){ await this.wait(c === 1 ? 500 : 650); this.fx('count', def, { n:c }); }
    const COUNT = ['', 'ONE...', 'ONE... TWO...', 'ONE... TWO... THREE!'];
    if(out){
      if(def.hp <= 0) def.hp = 1;
      this.say(ctx.kickout ? `${COUNT[counts]} ${def.name} kicks out thanks to an ability!` : counts ? `${COUNT[counts]} KICK OUT!` : `${def.name} kicks out right away!`, 'call');
      this.fx('kickout', def, { n:counts }); att.mom = Math.max(0, att.mom - 10); this.ctrl = null; this.pos = null; return;
    }
    this.say(COUNT[3], 'big');
    this.end(att, 'pinfall');
  }
  async submission(att, def, move){
    this.stats.subs++; const s = CFG.settings.sub;
    this.say(`${att.name} locks in the ${move.name}!`, 'big'); this.fx('sub', att, { name:move.name });
    for(let r = 1; r <= s.rounds; r++){
      const ctx = this.fire('submitted', def, {});
      if(ctx.escape){ this.say(`${def.name} gets to the ropes!`, 'call'); this.fx('ropebreak', def); this.ctrl = null; this.pos = null; return; }
      const ok = await def.brain.escape(this, def, move, s.seqLen + (r - 1));
      if(ok){ this.say(`${def.name} fights out of the ${move.name}!`, 'call'); this.fx('escape', def); this.ctrl = null; this.pos = null; return; }
      this.damage(att, def, move.dmg * (+att.st.submission || 1), {});
      this.gain(att, move.mom || 0);
      if(def.hp <= 0 || def.hp/def.max*100 <= s.tapAt){ this.say(`${def.name} TAPS OUT!`, 'big'); return this.end(att, 'submission'); }
      this.say(`${def.name} is still in the hold...`);
    }
    this.say('Rope break! The hold is broken.', 'call'); this.fx('ropebreak', def); this.ctrl = null; this.pos = null;
  }
  end(w, how){ this.over = true; this.winner = w; this.how = how; this.fx('end', w, { how }); }
}

/* ---------- the computer ---------- */
function aiBrain(level){
  const L = AI_LEVEL[level] || AI_LEVEL.normal, s = () => CFG.settings;
  const revSkill = f => (s().reversal.ai[level] || 45) + (+f.st.reversal || 0);
  return {
    neutral(m, f){ const op = m.other(f), last = op.hist.slice(-4), c = { strike:0, grapple:0, block:0 };
      last.forEach(x => { if(c[x] != null) c[x]++; }); const fav = Object.keys(c).sort((x,y) => c[y]-c[x])[0];
      if(last.length >= 2 && Math.random() < L.read) return { strike:'block', grapple:'strike', block:'grapple' }[fav];
      const st = f.st; const w = { strike:1 + ((+st.strike||1) - 1) * 3, grapple:1 + ((+st.grapple||1) - 1) * 3, block:1 };
      let r = Math.random() * (w.strike + w.grapple + w.block); for(const k in w){ if((r -= w[k]) <= 0) return k; } return 'block'; },
    chain(m, f){ const st = f.st; if((+st.grapple||1) > 1.1 && Math.random() < .4) return 'power'; if((+st.chain||0) >= 15 && Math.random() < .4) return 'technique';
      return ['power','technique','speed'][Math.floor(Math.random()*3)]; },
    control(m, f, opts){ const op = m.other(f), hpPct = op.hp/op.max*100;
      const fin = opts.find(o => o.type === 'fin'), sig = opts.find(o => o.type === 'sig');
      const pin = opts.find(o => o.type === 'move' && o.move.kind === 'pin');
      if(pin && (op.hp <= 0 || (hpPct < 22 && Math.random() < L.smart + .1) || (hpPct < 40 && Math.random() < .2))) return pin;
      if(fin && Math.random() < L.smart + .1) return fin;
      if(sig && Math.random() < L.smart) return sig;
      const sub = opts.filter(o => o.type === 'move' && o.move.kind === 'submission');
      if(sub.length && hpPct < 35 && Math.random() < L.smart * .5) return sub[Math.floor(Math.random()*sub.length)];
      const moves = opts.filter(o => o.type === 'move' && o.move.kind !== 'pin' && o.move.kind !== 'submission' && !(o.move.kind === 'highrisk' && level === 'easy' && Math.random() < .5));
      if(!moves.length) return pin || opts[0];
      if(Math.random() < L.smart){ moves.sort((x,y) => (y.move.dmg||1) - (x.move.dmg||1)); return moves[Math.floor(Math.random()*Math.min(3, moves.length))]; }
      return moves[Math.floor(Math.random()*moves.length)]; },
    reversal(m, f, move, len, kind){ const worth = kind !== 'move' || move.dmg >= 10 || move.kind === 'highrisk';
      if(!worth && Math.random() > .25) return null;
      return Math.random()*100 < revSkill(f) - (len - 3) * 6; },
    kickout(m, f, zone){ const tries = (s().pin.ai[level] || 1.5); return Math.random() < 1 - Math.pow(1 - zone/100, tries * 1.6); },
    escape(m, f, move, len){ return Math.random()*100 < revSkill(f) - (len - 4) * 5; }
  };
}

/* ---------- daily tower ---------- */
const today = () => new Date().toLocaleDateString('en-CA');
function seeded(str){ let h = 1779033703 ^ str.length; for(let i=0;i<str.length;i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  return function(){ h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); h ^= h >>> 16; let t = (h >>> 0) + 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function bossFor(diff){ const set = CFG.settings.boss[diff]; if(set && W(set)) return set;
  const pref = diff === 'hard' ? ['Undisputed','Mens','Womens'] : diff === 'normal' ? ['Mens','Womens','Undisputed'] : ['Womens','Mens','Undisputed'];
  for(const d of pref) if(CHAMPS[d] && W(CHAMPS[d])) return CHAMPS[d]; return ROSTER[0] && ROSTER[0].name; }
/* every tower a player can climb: Easy, Normal and Hard, then the admin's custom towers.
   A tower is a list of slots, bottom floor first, boss last. Each slot is { name, lock }.
   Locked slots always have that wrestler. Unlocked slots get a new random wrestler
   every climb (an unlocked boss is a random champion). */
const DIFF_COL = { easy:'#3ECF8E', normal:'#E9B949', hard:'#E24B4A' };
function defaultSlots(d){ const n = (CFG.settings.floors && CFG.settings.floors[d]) || 4; return Array.from({ length:n + 1 }, () => ({ name:'', lock:false })); }
function slotsOf(arr){ return (Array.isArray(arr) ? arr : []).map(x => typeof x === 'string' ? { name:x, lock:true } : { name:(x && x.name) || '', lock:!!(x && x.lock) }); }
function builtinSlots(d){ const s = CFG.settings;
  if(s.slots && Array.isArray(s.slots[d]) && s.slots[d].length) return slotsOf(s.slots[d]);
  if(s.stacks && Array.isArray(s.stacks[d]) && s.stacks[d].length) return slotsOf(s.stacks[d]);   // hand-picked before Nov 14: every floor locked
  return defaultSlots(d); }
function customSlots(t){ return slotsOf(t.slots && t.slots.length ? t.slots : t.stack); }
function towerDefs(){
  const s = CFG.settings, out = ['easy','normal','hard'].map(d => ({ key:d, name:d, level:d, reward:+s.reward[d] || 0, color:DIFF_COL[d], builtin:true, slots:builtinSlots(d) }));
  (CFG.towers || []).filter(t => t && t.on !== false).forEach(t => { const sl = customSlots(t); if(sl.length) out.push({ key:'c:' + t.id, name:t.name || 'Custom tower', level:AI_LEVEL[t.level] ? t.level : 'normal',
    reward:+t.reward || 0, color:t.color || '#5FB4FF', builtin:false, slots:sl, about:t.about || '' }); });
  out.forEach(t => { t.stack = t.slots.map(x => x.lock && W(x.name) ? x.name : ''); });   // '' = changes every climb
  return out;
}
const towerDef = key => towerDefs().find(t => t.key === key) || towerDefs()[1];
// the actual opponents for one climb (new random ones every time for the unlocked floors)
function rollSlots(slots, me){
  const locked = slots.filter(x => x.lock && W(x.name) && x.name !== me).map(x => x.name);
  const pool = ROSTER.map(w => w.name).filter(n => n !== me && !locked.includes(n));
  const take = list => { const ok = list.filter(n => pool.includes(n)); const from = ok.length ? ok : pool; const n = from[Math.floor(Math.random() * from.length)]; const i = pool.indexOf(n); if(i >= 0) pool.splice(i, 1); return n; };
  const champs = Object.values(CHAMPS).filter(n => W(n));
  const out = new Array(slots.length), last = slots.length - 1;
  [last].concat(slots.map((_, i) => i).filter(i => i !== last)).forEach(i => { const x = slots[i];   // the boss is picked first, so a champion is free for it
    if(x.lock && W(x.name) && x.name !== me) out[i] = x.name;
    else out[i] = i === last ? (take(champs) || take([])) : take([]); });
  return out.filter(Boolean);
}
function towerFloors(key, me){ return rollSlots(towerDef(key).slots, me); }
function towerFor(diff, me){ const rnd = seeded('wca-tower|' + today() + '|' + diff), boss = bossFor(diff);
  const pool = ROSTER.map(w => w.name).filter(n => n !== boss && n !== me);
  for(let i = pool.length - 1; i > 0; i--){ const j = Math.floor(rnd()*(i+1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  const floors = pool.slice(0, CFG.settings.floors[diff]); return floors.concat([boss === me ? (pool[floors.length] || pool[0]) : boss]); }

  { id:'vo-tower',      cat:'Narrator', n:1, line:'"Tower conquered!"' }
];
const SND_FILE = (id, i, n) => n > 1 ? `${id}-${i}.mp3` : `${id}.mp3`;
const SND = {
  ok:{}, tried:false, loop:null, voice:null, voicePri:0, last:{}, muted:false,
  cfg(){ return Object.assign({ on:true, folder:'sounds/', crowd:35, cheer:60, voice:90, fx:60, placeholders:true }, CFG.settings.sound || {}); },
  url(file){ const f = this.cfg().folder || ''; return f + (f && !/\/$/.test(f) ? '/' : '') + file; },
  on(){ return this.cfg().on && !this.muted; },
  // find which files are there (once). Missing ones are simply skipped.
  check(){ if(this.tried) return Promise.resolve(this.ok); this.tried = true;
    const all = []; SOUNDS.forEach(s => { for(let i = 1; i <= s.n; i++) all.push(SND_FILE(s.id, i, s.n)); });
    return Promise.all(all.map(f => new Promise(r => { const a = new Audio(); a.preload = 'auto';
      const done = ok => { if(ok) this.ok[f] = true; r(); }; a.oncanplaythrough = () => done(true); a.onerror = () => done(false); setTimeout(() => done(false), 4000); a.src = this.url(f); }))).then(() => this.ok); },
  pick(id){ const s = SOUNDS.find(x => x.id === id); if(!s) return null; const have = []; for(let i = 1; i <= s.n; i++){ const f = SND_FILE(id, i, s.n); if(this.ok[f]) have.push(f); }
    return have.length ? have[Math.floor(Math.random() * have.length)] : null; },
  play(id, vol){ if(!this.on()) return null; const f = this.pick(id);
    if(!f){ if(this.cfg().placeholders) SYN.play(id, vol); return null; }
    const a = new Audio(this.url(f)); a.volume = Math.max(0, Math.min(1, vol)); a.play().catch(() => {}); return a; },
  fx(id){ return this.play(id, this.cfg().fx / 100); },
  // the narrator: one line at a time. A more important line cuts in, a less important one waits its turn or is skipped.
  vo(id, pri, gap){ if(!this.on()) return; const now = Date.now(); pri = pri || 1;
    if(gap && this.last[id] && now - this.last[id] < gap) return;
    const busy = (this.voice && !this.voice.ended && !this.voice.paused) || SYN.talking();
    if(busy){ if(pri <= this.voicePri) return; if(this.voice) this.voice.pause(); SYN.hush(); }
    const f = this.pick(id); this.last[id] = now; this.voicePri = pri;
    if(!f){ this.voice = null; if(this.cfg().placeholders) SYN.say(id, this.cfg().voice / 100); return; }
    const a = new Audio(this.url(f)); a.volume = this.cfg().voice / 100; a.play().catch(() => {}); this.voice = a; },
  crowdStart(){ if(!this.on()) return; const f = this.pick('crowd-loop'); this.crowdStop();
    if(!f){ if(this.cfg().placeholders) SYN.crowd(this.cfg().crowd / 100); return; }
    const a = new Audio(this.url(f)); a.loop = true; a.volume = this.cfg().crowd / 100; a.play().catch(() => {}); this.loop = a; },
  crowdStop(){ if(this.loop){ this.loop.pause(); this.loop = null; } SYN.crowdOff(); },
  // the crowd swells for a moment, then settles back to the loop level
  swell(id){ if(!this.on()) return; this.play(id, this.cfg().cheer / 100); SYN.swell();
    const a = this.loop; if(!a) return; const base = this.cfg().crowd / 100, top = Math.min(1, base * 1.8 + .1); a.volume = top;
    clearInterval(this.sw); this.sw = setInterval(() => { if(!this.loop){ clearInterval(this.sw); return; } a.volume = Math.max(base, a.volume - .02); if(a.volume <= base) clearInterval(this.sw); }, 80); }
};
try{ SND.muted = localStorage.getItem('wcaTowerMute') === '1'; }catch(e){}

/* =====================================================================
   PLACEHOLDER SOUNDS: made on the spot by the browser, used for any file
   that isn't in the sounds folder yet. The narrator uses the browser's
   own voice to read the line. Drop in a real mp3 and it takes over.
   ===================================================================== */
const SYN = {
  ac:null, loopNodes:null,
  ctx(){ if(!this.ac){ const A = window.AudioContext || window.webkitAudioContext; if(!A) return null; this.ac = new A(); } if(this.ac.state === 'suspended') this.ac.resume(); return this.ac; },
  noise(ac, secs){ const b = ac.createBuffer(1, Math.max(1, Math.floor(ac.sampleRate * secs)), ac.sampleRate), d = b.getChannelData(0); for(let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1; return b; },
  // one burst of filtered noise with an attack and a fade
  burst(o){ const ac = this.ctx(); if(!ac) return; const t = ac.currentTime + (o.at || 0);
    const src = ac.createBufferSource(); src.buffer = this.noise(ac, o.len + .1);
    const f = ac.createBiquadFilter(); f.type = o.type || 'bandpass'; f.frequency.setValueAtTime(o.f || 1000, t); if(o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t + o.len); f.Q.value = o.q || 1;
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(.0002, o.vol), t + (o.atk || .005)); g.gain.exponentialRampToValueAtTime(.0001, t + o.len);
    src.connect(f); f.connect(g); g.connect(ac.destination); src.start(t); src.stop(t + o.len + .05); },
  tone(o){ const ac = this.ctx(); if(!ac) return; const t = ac.currentTime + (o.at || 0);
    const osc = ac.createOscillator(); osc.type = o.wave || 'sine'; osc.frequency.setValueAtTime(o.f, t); if(o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t + o.len);
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(.0002, o.vol), t + .005); g.gain.exponentialRampToValueAtTime(.0001, t + o.len);
    osc.connect(g); g.connect(ac.destination); osc.start(t); osc.stop(t + o.len + .05); },
  play(id, vol){ vol = Math.max(.02, vol || .5); const base = id.replace(/-\d+$/, '');
    switch(base){
      case 'sfx-bell': [0, .32, .64].forEach(at => { this.tone({ f:1046, len:1.2, vol:vol*.35, at }); this.tone({ f:1568, len:.8, vol:vol*.15, at }); }); break;
      case 'sfx-hit': this.burst({ f:1400, q:.8, len:.09, vol:vol*.9 }); this.tone({ f:180, f2:90, len:.08, vol:vol*.5 }); break;
      case 'sfx-slam': this.tone({ f:110, f2:40, len:.35, vol:vol }); this.burst({ type:'lowpass', f:600, len:.3, vol:vol*.8 }); break;
      case 'sfx-mat': this.burst({ type:'lowpass', f:1800, len:.07, vol:vol }); this.tone({ f:140, f2:70, len:.12, vol:vol*.6 }); break;
      case 'sfx-whoosh': this.burst({ f:400, f2:3200, q:2, len:.35, vol:vol*.6, atk:.15 }); break;
      case 'crowd-cheer': this.burst({ f:1300, q:.6, len:1.6, vol:vol*.5, atk:.35 }); this.burst({ f:2600, q:.8, len:1.3, vol:vol*.25, atk:.3 }); break;
      case 'crowd-pop': this.burst({ f:1200, q:.5, len:2.2, vol:vol*.8, atk:.2 }); this.burst({ f:2800, q:.7, len:1.8, vol:vol*.35, atk:.2 }); break;
      case 'crowd-boo': this.burst({ f:260, q:1.5, len:1.6, vol:vol*.7, atk:.35 }); this.tone({ f:140, f2:110, len:1.4, vol:vol*.12, wave:'sawtooth' }); break;
      case 'crowd-gasp': this.burst({ f:900, f2:1500, q:1.2, len:.6, vol:vol*.45, atk:.08 }); break;
    } },
  // the crowd under the whole match: soft noise that breathes
  crowd(vol){ const ac = this.ctx(); if(!ac) return; this.crowdOff();
    const src = ac.createBufferSource(); src.buffer = this.noise(ac, 4); src.loop = true;
    const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 700; f.Q.value = .4;
    const g = ac.createGain(); g.gain.value = vol * .18;
    const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = .23; lg.gain.value = vol * .05; lfo.connect(lg); lg.connect(g.gain);
    src.connect(f); f.connect(g); g.connect(ac.destination); src.start(); lfo.start();
    this.loopNodes = { src, lfo, g, base:vol * .18 }; },
  crowdOff(){ if(this.loopNodes){ try{ this.loopNodes.src.stop(); this.loopNodes.lfo.stop(); }catch(e){} this.loopNodes = null; } },
  swell(){ const n = this.loopNodes, ac = this.ac; if(!n || !ac) return; const t = ac.currentTime;
    n.g.gain.cancelScheduledValues(t); n.g.gain.setValueAtTime(n.g.gain.value, t); n.g.gain.linearRampToValueAtTime(n.base * 2.4, t + .3); n.g.gain.linearRampToValueAtTime(n.base, t + 2.2); },
  // the narrator: the browser reads the line out loud
  lines(id){ const s = SOUNDS.find(x => x.id === id); if(!s) return []; const q = s.line.match(/"([^"]+)"/g) || []; return q.map(x => x.slice(1, -1)); },
  say(id, vol){ if(!window.speechSynthesis) return; const L = this.lines(id); if(!L.length) return;
    const u = new SpeechSynthesisUtterance(L[Math.floor(Math.random() * L.length)]); u.rate = 1.08; u.pitch = .85; u.volume = Math.max(0, Math.min(1, vol));
    const v = speechSynthesis.getVoices().find(x => /en(-|_)US/i.test(x.lang) && /male|david|guy|daniel|google us/i.test(x.name)) || speechSynthesis.getVoices().find(x => /^en/i.test(x.lang)); if(v) u.voice = v;
    speechSynthesis.speak(u); },
  talking(){ return !!(window.speechSynthesis && speechSynthesis.speaking); },
  hush(){ try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){} }
};

/* ---------- practice wallet ---------- */

  if(LIVE){ const t = TODAY || {}; const wl = a.closest('.wallet'); if(wl) wl.title = 'Tower money you earned today, paid into your WCA balance';
    a.textContent = t.signed_in ? '$' + Number(t.earned || 0).toLocaleString() : 'Sign in';
    document.getElementById('wSub').textContent = t.signed_in ? 'today · limit $' + Number(t.cap || 0).toLocaleString() : 'to earn money'; return; }
  const w = wallet(); a.textContent = '$' + w.earned.toLocaleString(); document.getElementById('wSub').textContent = 'today · limit $' + CFG.settings.dailyCap.toLocaleString(); }
/* the website: money is paid by the database (tower_start / tower_fight / tower_win / tower_lose) */
let TODAY = null;

}

    app.innerHTML = `<div class="kick">${esc(n)} · step 2</div><h1 class="big f chrome" style="font-size:clamp(40px,6vw,70px)">Choose your moves</h1>
    <p class="note">Pick up to ${max} moves for each spot. These are what you'll be able to do when you're in control. Pins, whips, picking them up and climbing are always there. Your Signature (<b>${esc(su.sigName)}</b>, ${esc(POS[su.sigFrom].toLowerCase())}) and Finisher (<b>${esc(su.finName)}</b>, ${esc(POS[su.finFrom].toLowerCase())}) are set by the admin.</p>
    <div class="ms">${Object.keys(POS).map(p => { const moves = CFG.moves.filter(m => m.from === p); if(!moves.length) return '';
      const count = moves.filter(m => !fixed(m) && chosen.has(m.id)).length;

/* simple picture animations: lunges, hits with a red tint, shakes and flashes */
let fxT = 0;
function fx(kind, who, data){
  const now = performance.now(); if(now > fxT) fxT = now; const delay = fxT - now; fxT += kind === 'lunge' ? 140 : kind === 'hit' || kind === 'crash' ? 260 : 0;
  setTimeout(() => runFx(kind, who, data), delay);
}
function runFx(kind, who, data){
  drawBars(); try{ soundFx(kind, who, data); }catch(e){}
  const el = who ? document.getElementById('p' + who.side) : null;
  const again = (n, c) => { if(!n) return; n.classList.remove(c); void n.offsetWidth; n.classList.add(c); };
  const arena = document.getElementById('arena');
  if(kind === 'lunge' && el){ again(el, who.side === 'L' ? 'lungeL' : 'lungeR'); if(data && data.big) again(arena, 'flashbig'); }
  if((kind === 'hit' || kind === 'crash') && el){
    again(el, data && data.big ? 'hitbig' : 'hit');
    const n = document.createElement('div'); n.className = 'dmg' + (kind === 'crash' ? ' crash' : ''); n.textContent = '-' + data.dmg; el.parentElement.appendChild(n); setTimeout(() => n.remove(), 1000);
    if(data && data.big) again(arena, 'quake');
  }
  if(kind === 'heal' && el){ again(el, 'healfx'); const n = document.createElement('div'); n.className = 'dmg heal'; n.textContent = '+' + data; el.parentElement.appendChild(n); setTimeout(() => n.remove(), 1000); }
  if(kind === 'block' && el){ again(el, 'blockfx'); const n = document.createElement('div'); n.className = 'dmg block'; n.textContent = 'BLOCKED'; el.parentElement.appendChild(n); setTimeout(() => n.remove(), 1000); }
  if(kind === 'windup' && el){ again(el, 'windup'); }
  if(kind === 'tieup'){ ['L','R'].forEach(s => again(document.getElementById('p' + s), s === 'L' ? 'pushL' : 'pushR')); setStage('Tie-up', 'Chain wrestling for the advantage'); }
  if(kind === 'circle'){ ['L','R'].forEach(s => again(document.getElementById('p' + s), 'sway')); }
  if(kind === 'control' && who){ setStage(`${who.name} in control`, posLine(MT)); }
  if(kind === 'recover' || (kind === 'state' && data && data.stage === 'neutral' && MT && !MT.ctrl)){ setStage('Circling', 'Both standing'); }
  if(kind === 'pin' && el){ setStage('The cover!', ''); }
  if(kind === 'count'){ showCount(data.n); }
  if(kind === 'sub' && el){ setStage('Submission!', data && data.name); }
  if(kind === 'ability' && el){ again(el, 'abilityfx'); }
}

/* ---------- sound: what the crowd and the narrator do for each moment ---------- */
const SOUNDS_ON = {
  start(){ SND.check().then(() => { SND.fx('sfx-bell'); SND.crowdStart(); SND.vo('vo-start', 2); }); this.ctrl = null; this.ready = false; this.trouble = false; },

function soundFx(kind, who, data){
  if(!MT) return;
  const mine = who && who === MT.a;           // the person playing is always on the left
  if(kind === 'control' && who && SOUNDS_ON.ctrl !== who){ SOUNDS_ON.ctrl = who; SND.vo(mine ? 'vo-you-control' : 'vo-opp-control', 1, 6000); }
  if(kind === 'recover' || (kind === 'state' && data && data.stage === 'neutral' && !MT.ctrl)) SOUNDS_ON.ctrl = null;
  if(kind === 'slugfest'){ SND.vo('vo-slugfest', 2); SND.swell('crowd-cheer'); }
  if(kind === 'tieup') SND.vo('vo-tieup', 1, 8000);
  if(kind === 'windup' && data && data.kind === 'sig') SND.vo('vo-signature', 3);
  if(kind === 'windup' && data && data.kind === 'fin'){ SND.vo('vo-finisher', 3); SND.swell('crowd-pop'); }
  if(kind === 'hit' && data){ const big = data.big || data.dmg >= 13;
    SND.fx(big || data.dmg >= 9 ? 'sfx-slam' : 'sfx-hit');
    if(big){ SND.vo('vo-big', 1, 4000); SND.swell(who === MT.a ? 'crowd-boo' : 'crowd-cheer'); } }
  if(kind === 'crash'){ SND.fx('sfx-slam'); SND.swell('crowd-gasp'); }
  if(kind === 'reversal'){ SND.fx('sfx-whoosh'); SND.vo('vo-reversal', 2); if(mine) SND.swell('crowd-cheer'); }
  if(kind === 'dodge'){ SND.fx('sfx-whoosh'); SND.vo('vo-dodge', 2); }
  if(kind === 'sub'){ SND.vo('vo-sub', 2); }
  if(kind === 'escape') SND.vo('vo-escape', 2);
  if(kind === 'ropebreak') SND.vo('vo-ropes', 2);
  if(kind === 'pin'){ SND.vo('vo-cover', 2); }
  if(kind === 'kickout'){ SND.vo('vo-kickout', 3); SND.swell(data && data.n >= 2 ? 'crowd-pop' : 'crowd-gasp'); }
  if(kind === 'end' && data){ if(data.how === 'submission') SND.vo('vo-tap', 4); SND.fx('sfx-bell'); setTimeout(() => SND.swell(who === MT.a ? 'crowd-pop' : 'crowd-boo'), 300); }
  // your own warnings
  const me = MT.a;
  if(!SOUNDS_ON.ready && me.mom >= CFG.settings.mom.finCost){ SOUNDS_ON.ready = true; SND.vo('vo-ready', 1); }
  if(SOUNDS_ON.ready && me.mom < CFG.settings.mom.finCost) SOUNDS_ON.ready = false;
  if(!SOUNDS_ON.trouble && me.hp > 0 && me.hp / me.max < .3){ SOUNDS_ON.trouble = true; SND.vo('vo-trouble', 1); }

/* ---------- the person's choices ---------- */
function choose(html, keys){

function humanBrain(){

    control(m, f, opts){

  };

/* ---------- mini game 1: the arrow sequence (reversals and submissions) ---------- */
const ARROWS = { ArrowUp:'↑', ArrowDown:'↓', ArrowLeft:'←', ArrowRight:'→' };
function seqGame(titleText, len){
  return new Promise(res => {
    const keys = Object.keys(ARROWS), seq = Array.from({length:len}, () => keys[Math.floor(Math.random()*4)]);
    const ov = document.createElement('div'); ov.className = 'mg';
    ov.innerHTML = `<div class="mg-box"><div class="kick">Hit each arrow as it reaches the ring</div><div class="f mg-t">${esc(titleText)}</div>
      <div class="lane" id="lane"><div class="target"></div></div>
      <div class="mg-score"><span class="ok" id="sOk">0 hit</span><span class="no" id="sNo">0 missed</span></div>
      <div class="pads">${keys.map(k => `<button class="pad" data-k="${k}">${ARROWS[k]}</button>`).join('')}</div>
      <div class="legend">Arrow keys or tap the buttons. Need ${Math.floor(len/2)+1} of ${len}.</div></div>`;
    document.body.appendChild(ov);
    const lane = ov.querySelector('#lane'), W = lane.clientWidth, targetX = W * .16, tol = Math.max(30, W * .045);
    const speed = (W * .55) * (CFG.settings.seq.speed / 100);       // pixels per second
    const gap = .62 / (CFG.settings.seq.speed / 100);                // seconds between arrows
    const notes = seq.map((k, i) => { const n = document.createElement('div'); n.className = 'lnote'; n.textContent = ARROWS[k]; lane.appendChild(n); return { k, el:n, t0:i * gap + .5, done:false }; });
    let ok = 0, no = 0, start = performance.now(), raf;
    const xOf = (nt, t) => W + 30 - (t - nt.t0) * speed;
    const judge = (nt, hit) => { nt.done = true; nt.el.classList.add(hit ? 'hitn' : 'missn'); if(hit) ok++; else no++;
      ov.querySelector('#sOk').textContent = ok + ' hit'; ov.querySelector('#sNo').textContent = no + ' missed';
      if(notes.every(x => x.done)) end(); };
    const press = k => { const t = (performance.now() - start) / 1000;
      const nt = notes.find(x => !x.done); if(!nt) return;
      const d = Math.abs(xOf(nt, t) - targetX);
      if(d <= tol) judge(nt, nt.k === k); else if(d <= tol * 2.4) judge(nt, false);
      const pad = ov.querySelector(`[data-k="${k}"]`); if(pad){ pad.classList.remove('pressed'); void pad.offsetWidth; pad.classList.add('pressed'); } };
    const kd = e => { if(ARROWS[e.key]){ e.preventDefault(); press(e.key); } };
    document.addEventListener('keydown', kd);
    ov.querySelectorAll('.pad').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); press(b.dataset.k); }));
    const loop = () => { const t = (performance.now() - start) / 1000;
      notes.forEach(nt => { if(nt.done && !nt.el.classList.contains('gone')){ if(!nt.fade){ nt.fade = 1; setTimeout(() => nt.el.classList.add('gone'), 250); } return; }
        const x = xOf(nt, t); nt.el.style.transform = `translateX(${x}px)`; if(!nt.done && x < targetX - tol) judge(nt, false); });
      raf = requestAnimationFrame(loop); };
    let ended = false;
    function end(){ if(ended) return; ended = true; cancelAnimationFrame(raf); document.removeEventListener('keydown', kd);
      const win = ok > len / 2; ov.querySelector('.mg-box').insertAdjacentHTML('beforeend', `<div class="mg-res f ${win?'good':'bad'}">${win ? 'Success!' : 'Failed!'}</div>`);
      setTimeout(() => { ov.remove(); res(win); }, 750); }
    raf = requestAnimationFrame(loop);
  });
}

/* ---------- mini game 2: the kick out needle ----------
   Every miss is a count. Miss once: ONE. Twice: TWO. Three times: THREE, it's over.
   Waiting too long also counts. Stop the needle in the green to kick out.
   The needle speeds up a little after each count. */
function needleGame(zone){
  return new Promise(res => {
    const P = CFG.settings.pin, ov = document.createElement('div'); ov.className = 'mg';
    const left = 50 - zone / 2;
    ov.innerHTML = `<div class="mg-box"><div class="kick">Stop the needle in the green</div><div class="f mg-t">Kick out!</div>
      <div class="refcount f" id="rc"><span>1</span><span>2</span><span>3</span></div>
      <div class="needlebar" id="nb"><div class="green" style="left:${left}%;width:${zone}%"></div><div class="needle" id="nd"></div></div>
      <div class="ctimer"><span id="ct"></span></div>
      <div class="row" style="justify-content:center;margin-top:14px"><button class="cta" id="stop">STOP (space or tap)</button></div>
      <div class="legend">Every miss is a count, and so is waiting too long. Three and it's over. The green gets smaller the more damage you've taken. It's ${Math.round(zone)}% wide right now.</div></div>`;
    document.body.appendChild(ov);
    const nd = ov.querySelector('#nd'), ct = ov.querySelector('#ct'), win0 = Math.max(.8, +P.countTime || 1.8) * 1000;
    let period = 1500, phase = 0, last = performance.now(), raf, done = false, x = 0, count = 0, ready = false, deadline = performance.now() + win0 + 350;
    const loop = now => { phase = (phase + (now - last) / period) % 1; last = now; x = phase < .5 ? phase * 200 : (1 - phase) * 200; nd.style.left = x + '%';
      const left2 = Math.max(0, deadline - now); ct.style.width = (left2 / win0 * 100) + '%';
      if(ready && now >= deadline) miss();
      if(!done) raf = requestAnimationFrame(loop); };
    const finish = (out) => { done = true; cancelAnimationFrame(raf); document.removeEventListener('keydown', kd);
      ov.querySelector('.mg-box').insertAdjacentHTML('beforeend', `<div class="mg-res f ${out?'good':'bad'}">${out ? (count ? 'Kick out at ' + count + '!' : 'Kick out!') : 'Three!'}</div>`);
      setTimeout(() => { ov.remove(); res({ out, count }); }, out ? 800 : 1000); };
    function miss(){ if(done) return; count++;
      ov.querySelectorAll('#rc span').forEach((s, i) => s.classList.toggle('on', i < count));
      SND.fx('sfx-mat'); SND.vo('vo-count-' + count, 5);
      const a = document.getElementById('arena'); if(a){ const c = document.createElement('div'); c.className = 'count f'; c.textContent = count; a.appendChild(c); setTimeout(() => c.remove(), 900); }
      nd.classList.remove('missed'); void nd.offsetWidth; nd.classList.add('missed');
      if(count >= 3){ finish(false); return; }
      period = period / (1 + (+P.speedUp || 0) / 100); deadline = performance.now() + win0; }
    const stop = () => { if(done || !ready) return;
      if(x >= left && x <= left + zone) finish(true); else miss(); };
    const kd = e => { if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); stop(); } };
    // a short beat before the needle can be stopped, so a held key doesn't stop it at once
    setTimeout(() => { ready = true; document.addEventListener('keydown', kd); ov.querySelector('#stop').onclick = stop; ov.querySelector('#nb').onclick = stop; }, 350);
    raf = requestAnimationFrame(loop);
  });
}

/* ---------- after the match ---------- */
async function finish(won, how){
  if(!MT || MT.ui.say === undefined) return;
  let paid = 0, note = '';
  if(LIVE && !S.quick){
    // real money: the database decides and pays, inside the daily limit
    if(!SIGNED()) note = 'Sign in on WCAUniverse.com to earn money for every floor.';
    else if(!S.run) note = S.runErr ? 'No money this climb: ' + S.runErr : 'No money this climb.';
    else if(won){ try{ const r = await sbc().rpc('tower_win', { p_run:S.run }); if(r.error) throw r.error; const d = r.data || {};
        paid = +d.paid || 0; TODAY = Object.assign(TODAY || {}, { earned:d.earned, cap:d.cap, balance:d.balance, signed_in:true });
        if(d.why === 'too_fast') note = 'That match was too quick to pay. Matches have to last a little longer to earn money.';
        else if(d.why === 'cap') note = paid ? `You hit today's $${Number(d.cap).toLocaleString()} limit, so you got $${paid}.` : `You've reached today's $${Number(d.cap).toLocaleString()} limit. Keep playing for fun!`;
        if(d.balance != null) note = (note ? note + ' ' : '') + `Your WCA balance: $${Number(d.balance).toLocaleString()}.`;
      }catch(e){ note = 'Could not pay this floor: ' + (e.message || e); } }
    else { try{ await sbc().rpc('tower_lose', { p_run:S.run }); }catch(e){} }
    if(won) S.floor++;
    drawWallet();
  }
  else if(won && !S.quick){ const boss = S.floor === S.tower.length - 1, amount = TW().reward * (boss ? 3 : 1);
    paid = pay(amount); if(paid < amount) note = paid ? `You hit today's $${CFG.settings.dailyCap.toLocaleString()} limit, so you got $${paid}.` : `You've reached today's $${CFG.settings.dailyCap.toLocaleString()} limit. Keep playing for fun!`; S.floor++; }
  S.last = { won, how, paid, note, foe:MT.b.name, topped:won && !S.quick && S.floor >= S.tower.length };
  setTimeout(() => { SOUNDS_ON.stop(); SND.vo(S.last.topped ? 'vo-tower' : won ? 'vo-win' : 'vo-lose', 6); go('result'); }, 1500);
}
function result(){
  const r = S.last, how = { pinfall:'by pinfall', submission:'by submission', decision:'on the scorecards' }[r.how] || '';
  const champ = r.won ? S.me : r.foe, loser = r.won ? r.foe : S.me;
  app.innerHTML = `<div class="panel result${r.won ? ' won' : ' lost'}">
    <div class="res-pics"><div class="res-win">${face(W(champ))}<span class="res-tag f">Winner</span></div><div class="res-lose">${face(W(loser))}</div></div>
    <div class="res-body"><div class="kick">${r.won ? 'Victory' : 'Defeat'} ${esc(how)}</div>
    <h1 class="big f chrome">${r.topped ? 'Tower conquered!' : `${esc(champ)} wins!`}</h1>
    ${r.paid ? `<p class="f" style="font-size:40px;color:var(--bet);margin:6px 0">+$${r.paid.toLocaleString()}</p>` : ''}${r.note ? `<p class="note res-note">${esc(r.note)}</p>` : ''}
    <p class="note res-note">${S.quick ? 'Quick matches are just for fun.' : r.topped ? 'You beat the champion at the top of the tower.' : r.won ? `Next up, floor ${S.floor+1} of ${S.tower.length}${S.floor === S.tower.length - 1 ? ', the boss' : ''}: ${esc(S.tower[S.floor])}.` : `The climb is over on floor ${S.floor+1}. Try again from the bottom, or change your moves.`}</p>
    ${!S.quick ? `<div class="climb">${S.tower.map((n, i) => `<span class="cf${i < S.floor ? ' done' : ''}${i === S.floor && !r.topped ? ' next' : ''}${i === S.tower.length - 1 ? ' boss' : ''}" title="${esc(n)}">${face(W(n))}</span>`).join('')}</div>` : ''}
    <div class="row res-btns">
      ${!S.quick && r.won && !r.topped ? `<button class="cta big-go" onclick="startBattle()">Next fight ▶</button>` : ''}
      ${!S.quick && !r.won ? `<button class="cta big-go" onclick="beginClimb()">Try again ▶</button><button class="cta ghost" onclick="go('moveset')">Change moves</button>` : ''}
      ${!S.quick && r.topped ? `<button class="cta big-go" onclick="beginClimb()">Climb again ▶</button>` : ''}
      ${S.quick ? `<button class="cta big-go" onclick="startBattle()">Rematch ▶</button><button class="cta ghost" onclick="S.me=null;S.pickFoe=false;go('pick')">New match</button>` : ''}
      <button class="cta ghost" onclick="go('title')">Main menu</button></div></div></div>`;

}

(async function(){ app.innerHTML = '<div class="kick">Loading the roster…</div>'; await loadRoster(); await refreshToday();
  if(LIVE){ document.querySelectorAll('.top a[href*="tower-admin"], .top .chip').forEach(x => x.remove()); }
  render(); SND.check(); })();
